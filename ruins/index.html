<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ruins exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#d6d0c4;--dim:#78726a;--faint:#4a4640;--red:#8a1d16;--redL:#b5372b;--gold:#c9b48a;--line:rgba(214,208,196,.14);--panel:rgba(10,10,10,.9);--icon:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;touch-action:none;user-select:none;-webkit-user-select:none}
.latin{font-family:"Cormorant Garamond","Times New Roman",serif}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
/* 画面効果：周辺減光とざらつき */
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#fx.vig::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}
#fx.grain::after{content:'';position:absolute;inset:-50%;opacity:.13;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .6s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-7%,4%)}50%{transform:translate(5%,-6%)}75%{transform:translate(-3%,-3%)}100%{transform:translate(4%,6%)}}
/* 共通の暗いパネル */
.grunge{background:linear-gradient(180deg,rgba(14,13,12,.96),rgba(6,6,6,.97)),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.02' numOctaves='4'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .28 0 0 0 0 .25 0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:84px;padding:14px 8px 12px;font-size:13px;letter-spacing:.14em;color:var(--dim);text-align:center;border-left:1px solid var(--line);white-space:nowrap}
.tab:first-child{border-left:none}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';display:block;margin:8px auto 0;width:40%;height:1px;background:var(--ink)}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px 13px 20px;text-align:left;font-size:15px;letter-spacing:.06em;color:#b9b3a8;transition:color .2s}
.row.sel{color:#f0ebe2}
.row.sel::before{content:'';position:absolute;inset:2px 0;background:linear-gradient(90deg,rgba(138,29,22,.95),rgba(110,22,17,.75) 60%,rgba(110,22,17,0));z-index:-1;box-shadow:0 0 18px rgba(140,30,20,.25)}
.row .val{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink)}
.arrowB{width:30px;height:30px;font-size:12px;color:var(--dim)}
.row.sel .arrowB{color:#f0ebe2}
.seg{display:flex;gap:3px;margin-top:6px;justify-content:center}
.seg i{display:block;width:22px;height:2px;background:rgba(214,208,196,.18)}
.seg i.on{background:#e8e2d6}
.slider{width:120px;height:2px;background:rgba(214,208,196,.25);position:relative}
.slider b{position:absolute;top:-6px;width:3px;height:14px;background:#e8e2d6}
.secH{padding:16px 20px 6px;font-size:12px;color:var(--dim);letter-spacing:.2em}
.hints{display:flex;justify-content:flex-end;gap:22px;padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);font-size:12px;color:var(--dim);border-top:1px solid var(--line)}
.hints span b{display:inline-block;width:18px;height:18px;line-height:16px;text-align:center;border:1px solid var(--dim);border-radius:50%;margin-right:6px;font-size:10px;font-weight:400}
/* タイトル */
.title{position:fixed;inset:0;display:none;flex-direction:column;z-index:10}
.title.show{display:flex}
.title::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 20%,rgba(60,50,44,.35),rgba(0,0,0,0) 60%),radial-gradient(ellipse at 80% 90%,rgba(80,20,16,.25),rgba(0,0,0,0) 55%),#050505}
.tHead{padding:calc(env(safe-area-inset-top) + 34px) 22px 18px}
.tHead h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:42px;letter-spacing:.08em;line-height:1.05;color:#e9e3d8;text-shadow:0 0 30px rgba(140,30,20,.35)}
.tHead .jp{margin-top:8px;font-size:12px;letter-spacing:.3em;color:var(--dim)}
.tBody{flex:1;display:flex;min-height:0}
.tList{flex:1;overflow-y:auto;touch-action:pan-y;padding:6px 0 10px;position:relative;z-index:0}
.tList .row .n{font-family:"Cormorant Garamond",serif;font-size:14px;color:var(--dim);width:22px}
.tList .row .p{margin-left:auto;font-size:12px;color:var(--dim)}
.tList .row.sel .p{color:#e8dccc}
.tList .row .cl{font-size:10px;color:var(--gold);margin-left:8px;letter-spacing:.1em}
.tPrev{display:none}
.prev.grunge,.tPrev.grunge{background-color:rgba(8,8,8,.9)}
.prev{padding:16px 20px 14px;border-top:1px solid var(--line);min-height:170px}
.prev .pt{font-size:22px;letter-spacing:.15em}
.prev .pk{font-size:11px;color:var(--dim);letter-spacing:.25em;margin:4px 0 10px}
.prev .ps{font-size:12px;color:var(--gold);letter-spacing:.1em}
.prev p{font-size:13px;line-height:1.95;color:#b8b2a6;margin:8px 0 12px}
.go{display:block;width:100%;padding:13px;border:1px solid rgba(181,55,43,.7);background:linear-gradient(90deg,rgba(138,29,22,.55),rgba(138,29,22,.15));font-size:15px;letter-spacing:.3em;color:#f0ebe2}
.howto{font-size:11px;color:var(--faint);line-height:1.8;padding:0 20px 8px}
@media (min-width:820px){.tPrev{display:block;width:44%;border-left:1px solid var(--line)}.tBody .prev.inline{display:none}.prev{border-top:none;padding:30px}}
/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:8}
.hud.show{display:block}
.hudTop{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:flex-start;gap:8px}
.hudInfo{flex:1;min-width:0;text-shadow:0 1px 6px #000}
#hudName{font-size:16px;letter-spacing:.25em;color:#e6e0d4}
#hudCount{font-size:12px;color:var(--dim);margin-top:3px;white-space:nowrap;letter-spacing:.08em}
#goal{font-size:12px;color:#c9c1b2;margin-top:6px;line-height:1.6;max-width:210px;padding-left:8px;border-left:2px solid var(--red)}
.topBtns{display:flex;gap:0;flex-shrink:0;border:1px solid var(--line);background:rgba(6,6,6,.55)}
.hb{pointer-events:auto;padding:8px 9px;font-size:12px;letter-spacing:.08em;color:#cfc8bb;border-left:1px solid var(--line)}
.hb:first-child{border-left:none}
.hb:active{background:rgba(138,29,22,.6)}
.mini{position:absolute;top:calc(env(safe-area-inset-top) + 58px);right:14px;width:150px;height:150px;border:1px solid var(--line);background:rgba(4,4,4,.6);pointer-events:auto;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 190px);transform:translateX(-50%);max-width:82%;text-align:center;font-size:14px;line-height:1.8;padding:8px 18px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.75) 15%,rgba(0,0,0,.75) 85%,rgba(0,0,0,0));opacity:0;transition:opacity .8s;pointer-events:none;letter-spacing:.08em}
.toast.show{opacity:1}
.joyG{position:absolute;left:calc(env(safe-area-inset-left) + 34px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:110px;height:110px;border-radius:50%;border:1px dashed rgba(214,208,196,.18);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(214,208,196,.32);pointer-events:none}
.lookG{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);font-size:11px;color:rgba(214,208,196,.25);pointer-events:none}
.bigmap{display:block;width:100%;max-width:360px;aspect-ratio:1;margin:10px auto;border:1px solid var(--line);background:#050505;image-rendering:pixelated}
.exam{z-index:2;position:absolute;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:76px;height:76px;border-radius:50%;
  background:radial-gradient(circle,rgba(230,240,250,.85) 0,rgba(170,200,230,.3) 16%,rgba(170,200,230,0) 58%);font-size:0;opacity:0;transform:scale(calc(var(--icon)*.6));transition:opacity .8s,transform .8s;pointer-events:none}
.exam.show{opacity:.7;transform:scale(var(--icon));pointer-events:auto;animation:breathe 3.2s ease-in-out infinite}
.exam.seal{background:radial-gradient(circle,rgba(255,225,190,.85) 0,rgba(230,160,120,.3) 18%,rgba(230,160,120,0) 60%)}
body.iconBtn .exam{border-radius:0;width:auto;height:auto;padding:12px 20px;font-size:14px;letter-spacing:.2em;background:linear-gradient(90deg,rgba(138,29,22,.9),rgba(110,22,17,.6));border:1px solid rgba(181,55,43,.8);animation:none}
body.iconBtn .exam.show{opacity:1}
@keyframes breathe{50%{opacity:.4}}
.actB{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(6,6,6,.5);border:1px solid rgba(214,208,196,.22);transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none}
.actB .ic{font-size:16px;line-height:1;color:#ddd6ca}.actB .lb{font-size:10px;color:rgba(214,208,196,.65)}
.actB:active{transform:scale(.92)}
.jumpB{right:calc(env(safe-area-inset-right) + 104px);bottom:calc(env(safe-area-inset-bottom) + 30px);width:72px;height:72px}
.runB{right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 112px)}
.lampB{right:calc(env(safe-area-inset-right) + 94px);bottom:calc(env(safe-area-inset-bottom) + 116px);width:52px;height:52px}
.actB.on{background:rgba(138,29,22,.55);border-color:rgba(181,55,43,.9);box-shadow:0 0 14px rgba(140,30,20,.45)}
body.photo .hud>*:not(.photoX){display:none!important}
body.photo #fx{display:none}
.photoX{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;pointer-events:auto;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:6px 12px;font-size:12px;color:rgba(255,255,255,.7)}
body.photo .photoX{display:block}
body.noGoal #goal,body.noMini .mini{display:none}
.joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);display:none;pointer-events:none;z-index:9}
.joy.show{display:block}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(214,208,196,.25);transform:translate(-50%,-50%);transition:background .2s,box-shadow .2s}
#knob.fast{background:rgba(160,40,30,.7);box-shadow:0 0 14px rgba(160,40,30,.6)}
.hintA{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-size:14px;letter-spacing:.18em;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 0 10px #000;z-index:8}
.hintA.show{opacity:1}
.arr{font-size:42px;color:#d8cfc0;text-shadow:0 0 16px rgba(160,40,30,.8);margin-bottom:4px;transition:transform .3s}
/* モーダル */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:18px;z-index:20}
.modal.show{display:flex;animation:fade .45s}
#modalBody{background-color:rgba(9,9,9,.96);width:100%;max-width:480px;max-height:86vh;overflow-y:auto;touch-action:pan-y;border:1px solid var(--line);padding:22px 22px 18px;box-shadow:0 0 80px rgba(0,0,0,.9);position:relative}
#modalBody::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--red),rgba(138,29,22,0))}
#modalBody h2{font-size:20px;letter-spacing:.14em;margin:6px 0 14px;font-weight:700;color:#ece6da}
.ch{font-size:11px;color:var(--redL);letter-spacing:.25em}
.itext{font-size:15px;line-height:2.05;margin:0 0 20px;color:#cfc8bb}
.btn{display:block;width:100%;margin:10px 0 0;padding:13px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:14px;letter-spacing:.15em;text-align:center;color:#e0d9cd}
.btn:active,.btn.choice:active{background:rgba(138,29,22,.5)}
.btn.ghost{color:var(--dim);border-color:rgba(214,208,196,.08)}
.btn.gold{background:linear-gradient(90deg,rgba(138,29,22,.8),rgba(138,29,22,.25));border-color:rgba(181,55,43,.8);color:#f3eee6}
.btn.choice{text-align:left;padding:14px 16px;line-height:1.5;letter-spacing:.05em}
.nch{margin:16px 0 22px;padding-top:12px;border-top:1px solid var(--line)}
.nct{font-size:14px;color:#e2dbcf;letter-spacing:.12em;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.nct span{font-size:11px;color:var(--dim)}
.nit{margin:10px 0;padding-left:10px;border-left:1px solid rgba(138,29,22,.6)}.nit b{font-size:14px;color:#e6dfd2}.nit p{margin:3px 0 0;font-size:13px;line-height:1.85;color:#b5aea2}
.nit.un{opacity:.35;border-left-color:var(--line)}
.dim{color:var(--dim);font-size:13px;line-height:1.8}
.pq{font-size:16px!important;line-height:1.8}
.dials{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial button{width:52px;height:38px;border:1px solid var(--line);font-size:14px;color:var(--dim)}
.dial button:active{background:rgba(138,29,22,.6);color:#fff}
.dg{width:52px;height:60px;display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid rgba(214,208,196,.3);background:rgba(0,0,0,.5);color:#ece6da;font-family:"Cormorant Garamond",serif}
.btn.picked{background:rgba(138,29,22,.35);border-color:rgba(181,55,43,.7)}
.num{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:var(--red);color:#fff;font-size:12px;margin-right:8px}
.hintT{font-size:13px;color:#c9c1b2;line-height:1.8;margin:14px 0 0;padding:10px 12px;border-left:2px solid var(--red);background:rgba(138,29,22,.08)}
.wrong{color:#d98a7a;font-size:14px;margin:12px 0 0;animation:shake .4s}
.ending{font-size:15px;line-height:2.3;margin:10px 0 24px;color:#d8d1c4}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}}
/* 設定 */
.settings{position:fixed;inset:0;display:none;flex-direction:column;z-index:25;background-color:#070707}
.settings.show{display:flex;animation:fade .3s}
.sBody{flex:1;display:flex;min-height:0}
.sList{flex:1;overflow-y:auto;touch-action:pan-y;padding:6px 0;position:relative;z-index:0}
.sDesc{padding:14px 20px;border-top:1px solid var(--line);font-size:13px;color:#b8b2a6;line-height:1.9;min-height:76px}
.sDesc b{display:block;color:#ece6da;font-size:14px;margin-bottom:4px;letter-spacing:.1em}
@media (min-width:820px){.sBody .sDesc{border-top:none;border-left:1px solid var(--line);width:40%;padding:40px}.sWrap{display:flex;flex:1;min-height:0}}
/* 幻・導入 */
.vision{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:30;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(30,22,20,.85),rgba(0,0,0,.97))}
.vision.show{display:flex;animation:vis 1.8s ease}
@keyframes vis{0%{opacity:0;filter:blur(10px)}100%{opacity:1;filter:blur(0)}}
.vy{font-size:12px;color:var(--redL);letter-spacing:.35em}
.vt{font-size:21px;letter-spacing:.22em;margin:10px 0 22px;color:#ece6da}
.vt.big{font-size:38px;letter-spacing:.4em;margin-bottom:4px;padding-left:.4em}
.vk{font-size:12px;color:var(--dim);letter-spacing:.3em;margin-bottom:24px}
.vision p{max-width:440px;font-size:15px;line-height:2.2;margin:0 0 10px;color:#cfc8bb}
.vision .hint{font-size:12px;color:var(--dim);margin-top:14px}
.vtap{margin-top:34px;font-size:11px;color:var(--dim);letter-spacing:.25em;animation:blink 2.5s infinite}
@keyframes blink{50%{opacity:.3}}
.loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:40;letter-spacing:.4em;color:var(--dim);font-size:13px}
.loading.show{display:flex}
.loading::after{content:'';width:120px;height:1px;margin-top:18px;background:linear-gradient(90deg,rgba(138,29,22,0),var(--redL),rgba(138,29,22,0));animation:blink 1.6s infinite}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;line-height:2;background:#000;z-index:50}
</style>
</head>
<body>
<div id="view"></div>
<div id="fx" class="vig grain"></div>
<div class="joy" id="joy"><div id="knob"></div></div>

<div class="title show" id="title">
  <div class="tHead"><h1>Ruins<br>exploration</h1><div class="jp">記憶を拾い、真相を考察する</div></div>
  <div class="tabs"><button class="tab on" data-act="tabRuins">探索する廃墟</button><button class="tab" data-act="openSettings">設定</button></div>
  <div class="tBody">
    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <div class="tList" id="cards"></div>
      <div class="prev inline grunge" id="prevA"></div>
    </div>
    <div class="tPrev grunge"><div class="prev" id="prevB"></div></div>
  </div>
  <div class="hints"><span><b>◯</b>選ぶ</span><span><b>◎</b>もう一度で探索開始</span></div>
</div>

<div class="settings grunge" id="settings">
  <div class="tabs" id="sTabs"></div>
  <div class="sBody"><div class="sWrap" style="flex:1;display:flex;flex-direction:column;min-height:0;width:100%"><div class="sList" id="sList"></div><div class="sDesc" id="sDesc"></div></div></div>
  <div class="hints"><button data-act="setReset"><span><b>△</b>初期設定に戻す</span></button><button data-act="closeSettings"><span><b>◯</b>戻る</span></button></div>
</div>

<div class="hud" id="hud">
  <div class="hudTop">
    <div class="hudInfo"><div id="hudName"></div><div id="hudCount"></div><div id="goal"></div></div>
    <div class="topBtns">
      <button class="hb" data-act="hint">気配</button>
      <button class="hb" data-act="menu">ノート</button>
      <button class="hb" data-act="openSettings">設定</button>
      <button class="hb" data-act="exit">出る</button>
    </div>
  </div>
  <canvas class="mini" id="mini" width="300" height="300" data-act="bigmap"></canvas>
  <div class="hintA" id="hintArrow"></div>
  <div class="toast" id="toast"></div>
  <div class="joyG" id="joyG"><span>移動</span></div>
  <div class="lookG">なぞって見回す</div>
  <button class="exam" id="examine" data-act="examine" aria-label="調べる">調べる</button>
  <button class="actB jumpB" data-act="jump"><span class="ic">▲</span><span class="lb">跳ぶ</span></button>
  <button class="actB runB" data-act="run"><span class="ic">≫</span><span class="lb">走る</span></button>
  <button class="actB lampB" data-act="lamp"><span class="ic">◐</span><span class="lb">灯り</span></button>
  <button class="photoX" data-act="photoOff">撮影をやめる</button>
</div>

<div class="modal" id="modal"><div id="modalBody" class="grunge"></div></div>
<div class="vision" id="vision"></div>
<div class="loading" id="loading">廃墟を組み上げています</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 廃墟ごとのストーリー =====
// 各廃墟：4章 × 5アイテム = 20アイテム

  let s = 0, n = 0; for (let z = z0; z <= z1; z += 2) for (let x = x0; x <= x1; x += 2) { s += groundY(x, z); n++; }
  const y = yForce ?? Math.round(s / n), m = 10;
  for (let z = z0 - m; z <= z1 + m; z++) for (let x = x0 - m; x <= x1 + m; x++) {

    const d = Math.max(x0 - x, 0, x - x1, z0 - z, 0, z - z1), g = groundY(x, z), t = d === 0 ? y : Math.round(y + (g - y) * Math.min(1, d / m));

// ===== 操作 =====

// ===== 画面の光をタッチして調べる =====
function toScreen(x, y, z) {

    const objs = []; (G.doors || []).forEach(D => { if (!D.open) objs.push([D.grp, { D, p: D.pos }]); }); (G.boxes || []).forEach(B => { if (!B.opened) objs.push([B.grp, { B, p: B.pos }]); });
    (G.sides || []).forEach(Sd => objs.push([Sd.grp, { Sd, p: Sd.pos }])); G.items.forEach(it => { if (it.g.visible) objs.push([it.g, { it, p: it.g.position }]); });

    .concat((G.boxes || []).filter(B => !B.opened).map(B => ({ B, p: B.pos }))).concat((G.doors || []).filter(D => !D.open).map(D => ({ D, p: D.pos }))).concat((G.looks || []).map(L => ({ L, p: L.pos }))).concat((G.sides || []).map(Sd => ({ Sd, p: Sd.pos })));

// ===== ループ =====

    if (G.ftT > 3) { G.ftT = 0; const pr = G.renderer.getPixelRatio(); if (SET.quality !== 'auto') { const want = SET.quality === 'high' ? Math.min(devicePixelRatio || 1, 1.6) : .75; if (pr !== want) G.renderer.setPixelRatio(want); } else if (G.ft > .03 && pr > .75) G.renderer.setPixelRatio(Math.max(.75, pr - .25)); else if (G.ft < .018 && pr < Math.min(devicePixelRatio || 1, 1.6)) G.renderer.setPixelRatio(Math.min(1.6, pr + .25)); } }
