const DOWN=new THREE.Vector3(0,-1,0);
function ik(rig,side,target,pole){
  const sh=side<0?rig.shR:rig.shL, el=side<0?rig.elR:rig.elL, D=rig.dims;
  const S=sh.userData.rest, a=D.upper, b=D.fore+D.handR*0.55;
  const d=target.clone().sub(S); let dist=d.length(); dist=Math.min(a+b-1e-4,Math.max(Math.abs(a-b)+1e-4,dist));
  const dir=d.normalize();
  const cosA=Math.min(1,Math.max(-1,(a*a+dist*dist-b*b)/(2*a*dist))), A=Math.acos(cosA);
  const P=(pole||new THREE.Vector3(side*0.9,-0.4,-0.5)).clone();
  const perp=P.sub(dir.clone().multiplyScalar(P.dot(dir))).normalize();
  const e1=dir.clone().multiplyScalar(cosA).add(perp.multiplyScalar(Math.sin(A))).normalize();
  const E=S.clone().add(e1.clone().multiplyScalar(a)), T2=S.clone().add(dir.clone().multiplyScalar(dist));
  const e2=T2.sub(E).normalize();
  const qU=new THREE.Quaternion().setFromUnitVectors(DOWN,e1);
  const e2l=e2.applyQuaternion(qU.clone().invert());
  sh.userData.tq.copy(qU); el.userData.tq.setFromUnitVectors(DOWN,e2l);
}

  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+0.02); }

function tagMult(t){ const I=S.items; let m=1; if(t==='fun'&&I.jokebook) m=1.3; if(t==='apo'&&I.apobook) m=1.3; if(t==='log'&&I.logicnote) m=1.3; if(t==='flat'&&I.flatter) m=1.3; if(t==='wait'&&I.music) m=1.5; if(t==='force') m=(I.protein?1.3:1)*(1+(S.forceBonus||0))*(K?K.forceX:1); return m; }
function choose(i){

    for(const t of r.tags) best=Math.max(best,tagMult(t));
    if(weakHit){ mult=2; K.combo++; S.combo++; } else { K.combo=0; S.combo=0; mult=0.9; }

function setMotionNow(rig,m){ if(!rig) return; rig.base=m; rig.tempUntil=0; setMotion(rig,m,T); }
function act(rig,m,dur,expr){ if(!rig) return; rig.temp=m; rig.tempUntil=T+dur; rig.tempExpr=expr||null; }
function setOp(m,expr){ if(!opRig) return; opRig.base=m; opRig.baseExpr=expr||'normal'; opRig.tempUntil=0; }
function moodClaimer(){
  if(!clRig||!K) return;
  if(K.state==='talk'){ clRig.base=K.anger>70?'phone_angry':'phone'; clRig.baseExpr=K.anger>70?'angry':K.anger>35?'grumpy':'calm'; }
}
function tick(rig){
  if(!rig) return;
  let m=rig.base, ex=rig.baseExpr||rig.expr;
  if(rig.tempUntil>T){ m=rig.temp; if(rig.tempExpr) ex=rig.tempExpr; }
  if(rig===clRig&&K&&K.state!=='talk') ex=clRig.expr;
  if(rig===opRig&&mode==='call'&&!(rig.tempUntil>T)&&S&&S.mental<30) ex='worried';
  rig.expr=ex||'normal'; setMotion(rig,m,T); animateHuman(rig,m,T);
}

function noise(d=0.4,v=0.15,lp=1200,delay=0){ const a=au(); if(!a||muted) return; const n=Math.floor(a.sampleRate*d), buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; const g=a.createGain(); g.gain.value=v;
  s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+delay); }

  const bowl=cyl(0.07,0.05,0.05,mat('#c0392b'),14); bowl.position.set(0.2,top+0.025,zF+0.55); bowl.visible=false; og.add(bowl); intG.userData.katsudon=bowl;
  const lampG=new THREE.Group(); lampG.position.set(0.15,1.75,0.35); intG.add(lampG);
  lampG.add(at(cyl(0.005,0.005,0.6,mat('#222'),4),0,0.3,0)); const sh=cone(0.16,0.14,mat('#2a2a2a',{side:THREE.DoubleSide}),16); lampG.add(sh);
  lampG.add(at(sph(0.04,mat('#fff6c0',{emissive:'#ffe080',emissiveIntensity:2})),0,-0.05,0));
  intLamp=new THREE.SpotLight(0xffe8b0,10,5,0.75,0.5,1); intLamp.position.set(0,-0.05,0); lampG.add(intLamp); lampG.add(intLamp.target); intLamp.target.position.set(0,-2,0); intLamp.castShadow=true;
  intDet=addRig(DETECTIVE_H,intG,0.75,0.25,-1.3,'think','grumpy');
  addRig(POLICE_H,intG,1.45,-0.55,-0.5,'idle','normal');
}
function buildJail(years){
  jailG.clear(); clearExtra();
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(6,4),mat('#5a5a58',{roughness:1})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; jailG.add(fl);
  const wl=new THREE.Mesh(new THREE.PlaneGeometry(6,3),mat('#7a786f',{roughness:1})); wl.position.set(0,1.5,-1); jailG.add(wl);
  for(let i=0;i<years;i++){ const m=cube(0.02,0.14,0.005,'#333'); m.position.set(0.6+(i%5)*0.05+(i%5===4?0:0),1.2-Math.floor(i/5)*0.2,-0.99); if(i%5===4){ m.rotation.z=1.1; m.position.x=0.7; } jailG.add(m); }
  const win=new THREE.Mesh(new THREE.PlaneGeometry(0.4,0.3),mat('#a0c8e8',{emissive:'#6090b0',emissiveIntensity:0.4})); win.position.set(-0.6,1.9,-0.99); jailG.add(win);
  for(let i=0;i<4;i++){ const b=cyl(0.01,0.01,0.3,mat('#333'),6); b.position.set(-0.75+i*0.1,1.9,-0.98); jailG.add(b); }
  const bed=cube(0.9,0.25,0.45,'#8a8a90'); bed.position.set(-0.9,0.125,-0.6); jailG.add(bed); const pil=cube(0.25,0.07,0.35,'#eee'); pil.position.set(-1.25,0.28,-0.6); jailG.add(pil);
  const H=Object.assign({},OPERATORS[SAVE.op||0][1],{top:'shirt',topC:'#e08a30',accC:'#e08a30',bottom:'pants',botC:'#e08a30',acc:[],hat:'none',shoes:'sandal'});
  addRig(H,jailG,0,-0.2,0,'sad','cry');
  for(let i=0;i<11;i++){ const b=cyl(0.025,0.025,2.4,mat('#444',{metalness:0.7,roughness:0.3}),10); b.position.set(-1.25+i*0.25,1.2,0.75); b.castShadow=true; jailG.add(b); }
  for(const y of [0.1,2.3]){ const b=cube(2.6,0.06,0.06,mat('#444',{metalness:0.7,roughness:0.3})); b.position.set(0,y,0.75); jailG.add(b); }
}

/* 逮捕判定：実力行使・悪口のたびに */
function policeCheck(r){
  const add=Math.round((r.police||((r.compla||0)*0.5))*(S.items.mask?0.6:1)); if(!add) return false;
  S.police=Math.min(100,S.police+add); K.result+=`　🚓通報度 +${add}`;
  const chance=Math.max(0,S.police-40)/320+(r.id==="dokuzetsu"||r.id==="bomb"?0.03:0);
  return Math.random()<chance;
}
let arrestedFrom=null;
function startArrest(){
  mode='arrest'; stopSpeech(); hideBubbles(); S.arrests=(S.arrests||0)+1; unlockAch('arrest'); K.state='arrest';
  logPush('sys','🚨 ウーーー！ 警察が突入してきた！','bad'); renderCall(true); renderHUD();
  siren(true); vib([300,100,300]); popText('🚓 警察だ！！','fire');
  const p1=addRig(POLICE_H,gameG,2.6,0.25,-Math.PI/2,'walk'), p2=addRig(Object.assign({},POLICE_H,{hair:'bob',hairC:'#3a2a20'}),gameG,3.0,-0.15,-Math.PI/2,'walk');
  if(clRig){ clRig.base='laugh'; clRig.baseExpr='happy'; clRig.tempUntil=0; }
  setOp('sit_type','shock'); setTimeout(()=>{ setBubble('cl','ざまぁみろ！通報してやったわ！',3); speak('ざまぁみろ！通報してやったわ！',clVoice()); },300);
  const car=emojiSprite('🚓',0.45); car.position.set(-3.2,1.2,-0.9); gameG.add(car);
  anim(5.2,p=>{ const lt=p*5.2;
    car.position.x=-3.2+Math.min(1,lt/1.2)*1.0;
    if(lt<1.6){ const q=lt/1.6; p1.root.position.x=2.6-q*2.75; p2.root.position.x=3.0-q*2.85; }
    else if(lt<2.8){ if(p1.base!=='point'){ p1.base='point'; p2.base='angry'; p2.baseExpr='angry'; p1.baseExpr='angry'; act(opRig,'surprise',1.3,'shock'); setBubble('op','えっ…ちょっ…！？',2); speak('警察だ！動くな！',[0.5,1.1]); popText('動くな！！','fire'); } }
    else { if(p1.base!=='walk'){ p1.base='walk'; p2.base='walk'; opRig.base='walk'; opRig.baseExpr='cry'; opRig.tempUntil=0; p1.root.rotation.y=-Math.PI/2; p2.root.rotation.y=-Math.PI/2; opRig.root.rotation.y=-Math.PI/2-0.32; }
      const q=(lt-2.8)/2.4; opRig.root.position.x=-q*2.6; p1.root.position.x=-0.15-q*2.6; p2.root.position.x=0.25-q*2.6; }
  },()=>{ gameG.remove(car); siren(false); startInterrogation(); });
}
let I=null;
function intLogHTML(){ return I.log.map(m=>{ if(m.who==='sys') return `<div class="sys ${m.kind||''}">${esc(m.text)}</div>`;
  const d=m.who==='det'; return `<div class="msg ${d?'cl':'op'}"><div class="av">${d?'🕵️':'🎧'}</div><div class="mb"><div class="nm">${d?'鬼刑事 '+'権田':'あなた'}</div><div class="bb">${esc(m.text)}</div></div></div>`; }).join(''); }
function startInterrogation(){
  clearExtra(); if(opRig){ opRig.root.position.set(0,0,0); opRig.root.rotation.y=0; opRig.base='op_talk'; }
  mode='interro'; showScene('int'); buildInt();
  const tk=pick(Object.keys(DET_TYPES)); const prior=(S.arrests||1)-1;
  I={type:tk,sus:Math.min(90,35+Math.round(S.police*0.3)+prior*8),mood:50,round:0,max:4,log:[],prior,lastV:K&&K.lastViolent?K.lastViolent:'あの電話対応'};
  S.police=Math.max(0,S.police-40);
  I.log.push({who:'sys',text:`🏢 ${['中央','港','北','湾岸'][Math.floor(Math.random()*4)]}警察署・取調室${prior?`（前科${prior}犯）`:''}`});
  I.log.push({who:'det',text:DET_TYPES[tk].intro}); I.q=DET_Q[0];
  I.log.push({who:'det',text:I.q}); speak(DET_TYPES[tk].intro+'。'+I.q,DET_TYPES[tk].v);
  setDetBubble(DET_TYPES[tk].intro);
  dealInt(); renderInt(); HUD.innerHTML='';
}
function setDetBubble(t){ SB.cl.full=t; SB.cl.n=0; SB.cl.until=T+6; SB.cl.el.style.display='block'; }
function dealInt(){ I.hand=shuffle(INT_OPTS.slice()).slice(0,12); }
function renderInt(){
  HUD.innerHTML=`<div class="top"><span>🚔 取り調べ ${Math.min(I.round+1,I.max)}/${I.max}</span><span class="mt">🤨疑い${Math.round(I.sus)}${bar(I.sus,100,I.sus>65?'#e04848':I.sus>35?'#e6a23a':'#3ab06a')}</span><span class="mt">😠機嫌${Math.round(I.mood)}${bar(I.mood,100,'#8a6ad0')}</span></div>
   <div class="hr"><div class="cn">🕵️ 鬼刑事 権田</div><div>判決の目安</div><div class="wk"><span class="tg" style="background:#3ab06a">〜34 釈放</span><span class="tg" style="background:#e6a23a">35〜64 罰金</span><span class="tg" style="background:#e04848">65〜 実刑</span></div></div>`;
  UI.innerHTML=`<div class="logwrap"><div class="loghead"><span>🚔 取調室の会話</span><button class="mini" id="vtg">${voiceOn?'🔊 音声ON':'🔇 音声OFF'}</button></div><div class="log" id="log">${intLogHTML()}</div></div>
   ${I.done?'':`<div class="chhead">▼ 刑事への返答を選ぶ（${I.hand.length}択）</div><div class="grid">${I.hand.map((o,i)=>`<button class="ch" data-q="${i}"><b>${o[1]}</b><small>${o[2]}</small></button>`).join('')}</div>`}`;
  const lg=$('#log'); if(lg) lg.scrollTop=lg.scrollHeight;
  UI.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answerInt(+b.dataset.q));
  const vt=$('#vtg'); if(vt) vt.onclick=()=>{ const on=toggleVoice(); vt.textContent=on?'🔊 音声ON':'🔇 音声OFF'; };
}
function answerInt(i){
  if(I.done) return; const o=I.hand[i]; SFX.click(); stopSpeech();
  let ds=o[3]+(o[5][I.type]||0), dm=o[4];
  if(o[0]==='alibi') ds=Math.random()<0.45?-20:25;
  if(o[0]==='lawyer'&&S.items.lawyer) ds-=15;
  if(S.items.lawyer) ds-=3;
  if(o[0]==='meditate') S.mental=Math.min(S.maxMental,S.mental+10);
  if(o[0]==='katsudon'&&I.type==='ninjo'){ intG.userData.katsudon.visible=true; dm=15; }
  if(I.type==='tanki') dm*=1.5;
  I.mood=Math.max(0,Math.min(100,I.mood+dm));
  if(I.mood<20) ds+=5; if(I.mood>70) ds-=5;
  ds=Math.round(ds*rnd(0.85,1.15)); I.sus=Math.max(0,Math.min(100,I.sus+ds));
  const kind=ds<=-6?'good':ds>=6?'bad':'mid';
  I.log.push({who:'op',text:o[2]}); setBubble('op',o[2],2.5); speak(o[2],opVoice());
  I.log.push({who:'sys',text:`疑い ${ds>=0?'+':''}${ds}・機嫌 ${dm>=0?'+':''}${Math.round(dm)}${o[0]==='meditate'?'・メンタル +10':''}`,kind});
  const re=pick(DET_REACT[kind]); I.log.push({who:'det',text:re});
  if(intDet){ intDet.base=kind==='bad'?(Math.random()<0.5?'yell':'angry'):kind==='good'?'calm':'think'; intDet.baseExpr=kind==='bad'?'angry':kind==='good'?'calm':'grumpy'; }
  if(intOp){ intOp.base=kind==='bad'?'op_stress':kind==='good'?'op_bow':'op_talk'; intOp.baseExpr=kind==='bad'?'cry':'worried'; }
  if(kind==='bad'){ SFX.slap(); shake=0.3; } else if(kind==='good') SFX.good();
  I.round++;
  if(I.round>=I.max){ I.done=true; renderInt(); speak(re,DET_TYPES[I.type].v); setTimeout(()=>setDetBubble(re),700); return setTimeout(verdict,2200); }
  I.q=DET_Q[1+Math.floor(Math.random()*(DET_Q.length-1))]; if(I.round===I.max-1) I.q=DET_Q[DET_Q.length-1];
  I.log.push({who:'det',text:I.q}); speak(re+'。'+I.q,DET_TYPES[I.type].v); setTimeout(()=>setDetBubble(re+' '+I.q),700);
  dealInt(); renderInt();
}
function verdict(){
  const strict=I.prior*8, s=I.sus;
  I.log.push({who:'sys',text:`🕵️ 刑事のタイプ：${DET_TYPES[I.type].n}`});
  let res, txt, extra='';
  if(s<35-strict*0.5){ res='free'; txt='釈放（厳重注意）'; S.score=Math.max(0,S.score-100); extra='スコア -100'; unlockAch('free'); }
  else if(s<65-strict){ res='fine'; const fine=Math.round(S.coins*0.5); S.coins-=fine; S.score=Math.max(0,S.score-300); S.mental=Math.max(1,S.mental-20); txt='罰金・執行猶予'; extra=`罰金 💰${fine}・スコア -300・メンタル -20`; }
  else { res='jail'; txt='実刑判決'; }
  if(res==='jail') return jail();
  SFX.win(); popText(res==='free'?'釈放！':'執行猶予…',res==='free'?'win':'');
  if(intDet){ intDet.base='point'; intDet.baseExpr='grumpy'; } if(intOp){ intOp.base=res==='free'?'op_win':'op_bow'; intOp.baseExpr=res==='free'?'happy':'worried'; }
  speak(res==='free'?'今回だけは見逃してやる。二度と来るなよ':'罰金だ。次はないと思え',DET_TYPES[I.type].v);
  UI.innerHTML=`<div class="card center"><div class="big ${res==='free'?'green':''}">⚖️ ${txt}</div><div class="bubble">🕵️「${res==='free'?'今回だけは見逃してやる。二度と来るなよ。':'罰金だ。次はないと思え。'}」</div>
   <p>${extra}<br><small>刑事のタイプ：${DET_TYPES[I.type].n}・最終疑い度 ${Math.round(s)}</small></p><button class="btn" id="go">会社に戻る</button></div>`;
  $('#go').onclick=()=>{ SFX.click(); clearExtra(); showScene('game'); hideBubbles(); S.dayLog.push({c:K.c,res:'arrest',sc:0}); S.callIdx++; if(S.callIdx>=CALLS_PER_DAY) dayEnd(); else beforeCall(); };
}
function jail(){
  mode='jail'; finishRun(); unlockAch('jail'); stopSpeech(); hideBubbles();
  const years=Math.max(1,Math.min(15,Math.round((I.sus-50)/5)+I.prior*2));
  showScene('jail'); buildJail(years); SFX.fire(); vib([400,100,400]); popText(`懲役${years}年`,'fire');
  speak(`判決、懲役${years}年。`,[0.4,0.8]);
  UI.innerHTML=`<div class="card center"><div class="big red">⛓️ 判決：懲役${years}年</div><p>取り調べはうまくいかなかった…<br>あなたのオペレーター人生はここで終わった。</p>
   <div class="bubble">🕵️「暴力と悪口はクレーム対応じゃない。塀の中で頭を冷やすんだな」</div>
   <div class="score">${S.score}<small> pt</small></div><p>称号：<b>${rankOf(S.score)}</b>（前科${S.arrests}犯）<br>ベスト：${SAVE.best}</p>
   <button class="btn" id="re">出所して再就職する</button><button class="btn sub" id="tt">タイトルへ</button></div>`;
  $('#re').onclick=()=>{ SFX.click(); clearExtra(); showScene('game'); newGame(); }; $('#tt').onclick=()=>{ SFX.click(); clearExtra(); showScene('game'); title(); };
}
function updatePolice(){
  if(sirenOn){ const a=Math.sin(T*12)>0; sirenR.intensity=a?6:0; sirenB.intensity=a?0:6; }
  if(intLamp) intLamp.intensity=10+Math.sin(T*2)*0.6+(Math.random()<0.02?-6:0);
}

/* ---------- カメラ・ループ ---------- */
function fitCamera(){
  const a=camera.aspect, th=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(1.75/(2*th),3.2/(2*th*a));
  camera.position.set(0,1.15,d); camera.lookAt(0,0.72,0);
}
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); if(mode!=='viewer') fitCamera(); }
new ResizeObserver(resize).observe(stage);
let T=0; const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;
  const k=1-Math.exp(-dt*14);
  if(viewerG.visible){ if(viewRig){ viewRig.expr=viewRig.baseExpr||'normal'; setMotion(viewRig,viewRig.base,T); animateHuman(viewRig,viewRig.base,T); applyRig(viewRig,k); } controls.update(); }
  else {
    moodClaimer();
    if(opRig){ tick(opRig); applyRig(opRig,k); }
    if(clRig&&clG.visible){ tick(clRig); applyRig(clRig,k);
      if(K&&K.popIn){ const p=Math.min(1,(T-K.popIn)/0.35); clG.scale.setScalar(0.01+0.99*(1-Math.pow(1-p,3))*(1+0.12*Math.sin(p*Math.PI))); if(p>=1) K.popIn=0; }
      updateFinish();
    }
    // 怒り演出
    const ang=K&&(mode==='call'||mode==='end')&&clRig&&clG.visible&&K.state==='talk'?K.anger:(K&&K.state==='fire'?100:0);
    if(ang>30&&clRig&&clG.visible){ angerMark.visible=true; const hp=headPos(clRig); angerMark.position.set(hp.x+0.2,hp.y+0.28,hp.z); const sc=(0.12+ang/100*0.22)*(1+Math.sin(T*10)*0.12); angerMark.scale.set(sc,sc,sc); } else angerMark.visible=false;
    if(K&&clG.visible&&(mode==='call'||mode==='end')){ const tc=new THREE.Color(bdBase).lerp(new THREE.Color('#ff5a4a'),Math.max(0,ang-40)/100); bdMat.color.lerp(tc,0.1); redLight.intensity=THREE.MathUtils.lerp(redLight.intensity,ang>70?2.5:0,0.1); } else redLight.intensity*=0.9;
    if(flames.visible) flames.children.forEach(f=>{ const s=0.8+Math.sin(T*18+f.userData.ph)*0.3; f.scale.set(s,1+Math.sin(T*13+f.userData.ph)*0.5,s); f.position.y=0.2+Math.sin(T*9+f.userData.ph)*0.05; });
    if(gameG.userData.clockHand) gameG.userData.clockHand.rotation.z=-T*0.5;
    lineSprite.position.y=1.8+Math.sin(T*3)*0.04; lineSprite.material.rotation=mode==='ring'?Math.sin(T*30)*0.3:0;
    for(const r of extraRigs){ tick(r); applyRig(r,k); }
    updatePolice(); updateAnims(); updateBubbles(dt);
    fitCamera(); if(shake>0){ camera.position.x+=(Math.random()-0.5)*shake*0.15; camera.position.y+=(Math.random()-0.5)*shake*0.1; shake=Math.max(0,shake-dt*1.2); }
  }
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life-=dt; f.v.y-=dt*2.2; f.o.position.addScaledVector(f.v,dt); f.o.material.opacity=Math.min(1,f.life*2); if(f.life<=0){ scene.remove(f.o); f.o.material.map.dispose(); f.o.material.dispose(); fx.splice(i,1); } }
  renderer.render(scene,camera);
}
resize(); title(); loop();

</script>
