<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:#3b2f25;background:#9fd4f5;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#stSub{font-size:12px;color:#6b5a48;margin-top:2px}
#mm{position:fixed;top:8px;right:56px;width:120px;height:60px;border-radius:10px;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:none}

#help{position:fixed;left:10px;bottom:10px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
#act{position:fixed;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:60vw;border:0;border-radius:18px;background:#e9a24a;color:#fff;font:inherit;font-weight:800;font-size:16px;padding:16px 18px;box-shadow:0 4px 0 #b97a2a,0 6px 18px rgba(0,0,0,.25)}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);display:none;pointer-events:none}

#log{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);max-width:92%;background:rgba(40,32,26,.86);color:#fff;border-radius:14px;padding:8px 14px;font-size:14px;font-weight:700;line-height:1.4;opacity:0;transition:.25s;pointer-events:none;text-align:center;z-index:15}

#dlg{position:fixed;left:8px;right:8px;bottom:8px;max-height:66vh;overflow-y:auto;background:#fffaf1;border-radius:18px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 6px 30px rgba(0,0,0,.3);z-index:12}

#dlg .who{font-weight:800;font-size:15px;color:#9a6a2a;margin-bottom:4px}
#dlg .say{font-size:15px;line-height:1.65;margin-bottom:8px}
#dlg .ch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
#dlg .ch button{border:1.5px solid #e4d6bf;background:#fff;border-radius:12px;padding:10px 9px;font:inherit;font-size:13.5px;color:#3b2f25;text-align:left;line-height:1.35}
#dlg .ch button.sub{background:#efe4d2;border-color:#efe4d2}
#dlg .ch button.on{border-color:#2ecc71;background:#eafaf0}
#dlg .ch button:disabled{opacity:.35}
#dlg .ch small{display:block;font-size:10.5px;color:#9a7f5f}
.mk{font-style:normal;font-weight:900;font-size:15px;margin-left:4px}
.hint{background:#fff6dc;border-radius:10px;padding:7px 10px;font-size:13px;color:#8a6a1a;margin:6px 0}
.seq{display:flex;flex-direction:column;gap:3px;background:#f6efe2;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
#pad{margin:6px auto;max-width:260px}
#pad .disp{background:#20262e;color:#ffd75a;font:700 26px ui-monospace,monospace;text-align:center;border-radius:10px;padding:6px;letter-spacing:4px}
#pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
#pad .keys button{border:0;border-radius:10px;background:#efe4d2;font:700 19px inherit;padding:10px 0;color:#3b2f25}
.note{font-size:12.5px;color:#7a6550;line-height:1.55;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:4px 0 6px;font-size:12.5px;background:#f6efe2;border-radius:10px;padding:6px 10px}
.stats div{display:flex;justify-content:space-between}.stats span{font-weight:700;color:#7a6550}.stats em{font-style:normal;color:#e9a24a;letter-spacing:-1px}
.lst{background:#f6efe2;border-radius:12px;padding:4px 10px;margin:6px 0}
.lst .row{display:flex;flex-wrap:wrap;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eadfcb;font-size:13px}.lst .row:last-child{border:0}
.lst .row small{width:100%;font-size:11px;color:#9a7f5f}.lst i{font-style:normal;font-weight:900}
.lbl{font-size:12px;font-weight:800;color:#9a7f5f;margin:10px 0 6px}
.btn{border:0;background:#e9a24a;color:#fff;font:inherit;font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;margin-top:6px}
.btn.sub{background:#efe4d2;color:#5a4a3a}.btn.big{font-size:17px;padding:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.btns.col{flex-direction:column}
#ov{position:fixed;inset:0;background:rgba(35,28,22,.5);backdrop-filter:blur(3px);overflow-y:auto;padding:20px 12px 40px;z-index:20}
.card,.res{max-width:520px;margin:0 auto;background:#fffaf1;border-radius:22px;padding:18px 18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.card h1{font-size:24px;margin:4px 0 8px;text-align:center}.card h2{margin:0 0 8px}
.card p{font-size:14px;line-height:1.7;text-align:center}
.logo{font-size:52px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #e4d6bf;background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:#4a3b2d}.chip.on{background:#3b2f25;border-color:#3b2f25;color:#fff}
.stage{display:flex;flex-wrap:wrap;align-items:center;width:100%;border:0;background:#fff;border-radius:16px;padding:13px 14px;margin:8px 0;font:inherit;text-align:left;box-shadow:0 2px 0 #e4d6bf;color:#3b2f25}
.stage b{flex:1 1 100%;font-size:16px}.stage span{flex:1;font-size:12.5px;color:#7a6550;margin-top:3px}.stage em{font-style:normal;color:#e9a24a;font-size:13px}
textarea{width:100%;height:120px;border-radius:12px;border:1.5px solid #e4d6bf;padding:8px;font-size:12px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
.res h1{text-align:center;font-size:30px;margin:4px 0}.res.bad h1{color:#d64545}.res.good h1{color:#1e9e5a}
.res .sub{text-align:center;font-weight:700;color:#7a6550}
.res .stars{text-align:center;font-size:34px;color:#f2b234;margin:4px 0}
.dmg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.dmg div{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 0 #eadfcb}.dmg b{display:block;font-size:24px;color:#d64545}.dmg span{font-size:11px;color:#7a6550}
.res.good .dmg b{color:#3b2f25}
.res h3{font-size:14px;color:#9a7f5f;margin:16px 0 6px}
.cause{background:#fff;border-radius:14px;padding:10px 12px;margin:7px 0;font-size:13px;line-height:1.5;border-left:5px solid #d64545}
.cause .ct{font-weight:800}.cause .ct i{font-style:normal;font-size:11px;background:#fde3e3;color:#c03b3b;border-radius:6px;padding:1px 6px;margin-left:4px}
.cause .why{color:#7a6550;font-size:12px}.cause .hint{color:#1e7e4a;font-weight:700;font-size:12.5px}

#obj{font-size:11.5px;color:#9a6a2a;font-weight:700;margin-top:2px}
.tm{display:inline-block;background:#3b2f25;color:#fff;border-radius:7px;padding:0 6px;font-variant-numeric:tabular-nums}.tm.low{background:#d64545;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
pre.clue{white-space:pre-wrap;background:#20262e;color:#ffd75a;border-radius:10px;padding:12px;font:700 15px/1.7 ui-monospace,"Hiragino Sans",monospace;margin:6px 0}
pre.clue.sm{font-size:12.5px;padding:8px;color:#fff3c4}
.news{background:#c0392b;color:#fff;font-weight:800;font-size:13px;border-radius:10px;padding:7px 10px;margin-bottom:8px;line-height:1.45}
.rank{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;background:#fff;border-radius:14px;padding:10px 14px;margin:10px 0;box-shadow:0 2px 0 #eadfcb}
.rank b{font-size:40px;line-height:1;color:#e9a24a}.rank.rS b{color:#d4a017;text-shadow:0 0 8px #ffe48a}.rank.rD b{color:#9a8a7a}
.rank span{font-weight:800;font-size:14px}.rank small{width:100%;font-size:11.5px;color:#7a6550}
.opts2{display:flex;flex-direction:column;gap:8px;margin:10px 0;font-size:14px}
.zk{display:flex;flex-wrap:wrap;gap:4px}.zk span{font-size:11px;background:#efe4d2;border-radius:8px;padding:3px 7px;color:#9a8a7a}.zk span.on{background:#3b2f25;color:#fff}
.card h3{font-size:14px;color:#9a7f5f;margin:16px 0 4px}
.ideas{margin:0;padding-left:30px;font-size:13px;line-height:1.75}.ideas li.done{font-weight:700;color:#1e7e4a}
/* 横画面（スマホ） */
@media (orientation:landscape) and (max-height:520px){
 #top{right:auto;width:min(44vw,380px);top:6px;left:6px;padding:4px 8px;border-radius:10px}

 #mm{top:6px;right:52px;width:132px;height:66px}

 #help{display:none}

 #dlg .ch button{padding:8px;font-size:13px}

}

/* ボタンを右上に集約 */
#tools{position:fixed;top:8px;right:8px;display:flex;gap:2px;background:rgba(255,255,255,.9);border-radius:14px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:5}
#tools button{position:static;width:50px;height:46px;border:0;border-radius:11px;background:transparent;box-shadow:none;font-size:19px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#3b2f25}
#tools button:active{background:#efe4d2}
#tools button small{font-size:9.5px;font-weight:700;color:#7a6550}
#mm{top:62px;right:8px;width:156px;height:78px;pointer-events:auto;cursor:pointer}
#top{right:176px}
.hardsw{display:block;background:#fff3e8;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;color:#a8521e}
@media (orientation:landscape) and (max-height:520px){
 #tools{top:6px;right:6px}#tools button{width:44px;height:38px;font-size:16px}#tools button small{font-size:8.5px}
 #mm{top:50px;right:6px;width:140px;height:70px}
 #top{right:auto}
}
.memo{font-size:24px;font-weight:800;text-align:center;letter-spacing:2px;background:#fff6dc;border-radius:12px;padding:12px 4px;margin:6px 0}
.pg{display:flex;flex-direction:column;gap:4px;margin:6px 0}.pr{display:flex;align-items:center;gap:6px;background:#f6efe2;border-radius:10px;padding:5px 8px;font-size:13.5px}
.pr span{flex:1}.pr button{border:0;background:#e9a24a;color:#fff;border-radius:8px;width:36px;height:30px;font-size:14px}.pr button:disabled{opacity:.3}
.paper{max-width:640px;margin:0 auto;background:#f3eee2;color:#1c1a17;border-radius:6px;padding:16px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 2px,transparent 2px 4px)}
.paper .mast{display:flex;align-items:center;gap:10px;border-bottom:3px double #1c1a17;padding-bottom:6px;margin-bottom:8px}
.paper .gou{background:#c0392b;color:#fff;font-weight:900;font-size:18px;padding:4px 8px;border-radius:3px;writing-mode:horizontal-tb}
.paper .title{font-size:30px;font-weight:900;letter-spacing:4px;flex:1}
.paper .date{font-size:11px;text-align:right}
.paper .hd{font-size:40px;line-height:1.15;margin:6px 0 4px;font-weight:900;letter-spacing:2px;border-bottom:1px solid #1c1a17;padding-bottom:6px}
.paper .sh{font-size:16px;font-weight:800;margin-bottom:8px;background:#1c1a17;color:#f3eee2;padding:4px 8px}
.paper figure{margin:6px 0 10px}.paper img{width:100%;display:block;filter:grayscale(1) contrast(1.25) brightness(1.05);border:1px solid #1c1a17}
.paper figcaption{font-size:11px;margin-top:3px}
.paper .cols{column-count:2;column-gap:16px;column-rule:1px solid #b9b2a2;font-size:13px;line-height:1.8;text-align:justify}

.paper .side{display:flex;gap:8px;margin-top:8px}.paper .box{flex:1;border:1px solid #1c1a17;padding:6px 8px;font-size:11.5px;line-height:1.5}.paper .box b{display:block;font-size:12.5px}

@media (orientation:landscape) and (max-height:520px){.paper{max-width:820px}.paper .hd{font-size:30px}.paper figure{float:right;width:44%;margin:0 0 6px 12px}.paper .cols{column-count:2}}
.over{text-align:center}.over .go{font-size:46px;font-weight:900;color:#c0392b;letter-spacing:4px;margin:10px 0;text-shadow:0 3px 0 #5a1a12}
#flash{position:fixed;inset:0;background:#ff3b1a;opacity:0;pointer-events:none;z-index:14}#flash.on{animation:flash 1.6s ease-out}
@keyframes flash{0%{opacity:.75}30%{opacity:.35}100%{opacity:0}}

/* ===== ランディング（タイトル） ===== */
#ov.lpbg{background:radial-gradient(120% 80% at 50% 0%,rgba(10,20,45,.15),rgba(8,12,28,.78) 70%),linear-gradient(180deg,rgba(255,150,60,.18),rgba(0,0,0,0) 40%);backdrop-filter:none;padding:0}
.lp{min-height:100%;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;padding:14px 14px 10px}
.lp-top{width:100%;max-width:980px;display:flex;justify-content:space-between;font:800 11px/1 "M PLUS Rounded 1c",sans-serif;letter-spacing:.14em;opacity:.9}
.lp-live{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
.lp-live i{width:8px;height:8px;border-radius:50%;background:#5dff9b;box-shadow:0 0 10px #5dff9b;animation:blink 1.2s infinite}
.lp-gate{background:#ffd23f;color:#1b1b2f;padding:6px 10px;border-radius:6px;font-family:"Dela Gothic One",sans-serif;letter-spacing:.06em}
.lp-hero{text-align:center;margin-top:3vh;max-width:760px}
.lp-route{display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px;margin-bottom:4px}
.lp-dash{width:70px;height:0;border-top:3px dashed rgba(255,255,255,.55)}
.lp-pl{display:inline-block;animation:fly 2.8s ease-in-out infinite}

.lp-logo{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:clamp(48px,12vw,112px);line-height:1;margin:0;letter-spacing:.02em;
  filter:drop-shadow(0 6px 0 #1b1b2f) drop-shadow(0 14px 24px rgba(0,0,0,.45));transform:rotate(-3deg);animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.lp-logo span{display:inline-block;-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill}
.lp-logo .w{color:#ffb02e}.lp-logo .n{color:#ff7aa8}.lp-logo .k{color:#fff;background:linear-gradient(180deg,#fff 55%,#9fd4f5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.lp-sub{display:inline-block;margin-top:6px;font-family:"Dela Gothic One",sans-serif;font-size:clamp(22px,5vw,40px);color:#1b1b2f;background:#ffd23f;padding:2px 18px 4px;border-radius:10px;transform:rotate(2deg);box-shadow:0 5px 0 #1b1b2f;letter-spacing:.12em}

.lp-copy b{color:#ffd23f}

  box-shadow:0 6px 0 #1b1b2f,0 0 0 0 rgba(255,210,63,.7);animation:pulse 1.8s infinite;letter-spacing:.06em}

.lp-stats{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}

.lp-stats b{display:block;font-family:"Dela Gothic One",sans-serif;font-size:22px;color:#ffd23f}.lp-stats small{font-size:10.5px;opacity:.85}

/* ===== 華やかな動き ===== */
.ms::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:conic-gradient(from 0deg at 50% 120%,rgba(255,90,60,.0),rgba(255,90,60,.18),rgba(80,200,255,.0),rgba(80,200,255,.16),rgba(255,90,60,0));animation:sweep 14s linear infinite;mix-blend-mode:screen}
@keyframes sweep{to{transform:rotate(360deg)}}
.ms{overflow:hidden}.ms::before{z-index:0}.ms-head,.ms-body,.ms-foot{position:relative;z-index:1}.ms-tiles,.ms-gear{z-index:2}
.ms-head h1{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;font-size:clamp(34px,6.2vw,70px);letter-spacing:.02em;border:0;padding:0 18px 10px;position:relative;
  text-shadow:4px 4px 0 #d8452f,8px 8px 0 rgba(0,0,0,.35);perspective:600px}
.ms-head h1 span{display:inline-block;animation:drop .7s cubic-bezier(.2,1.5,.35,1) both;animation-delay:calc(var(--d)*55ms + .1s)}
@keyframes drop{0%{transform:translateY(-70px) rotateX(90deg) scale(1.4);opacity:0}100%{transform:none;opacity:1}}
.ms-head h1::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,#d8452f 15%,#ffb02e 50%,#d8452f 85%,transparent);transform-origin:left;animation:line 1s .8s cubic-bezier(.7,0,.2,1) both}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ms-head p{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(14px,1.8vw,18px);animation:track 1.1s .9s ease-out both}
@keyframes track{from{letter-spacing:1.2em;opacity:0}to{letter-spacing:.3em;opacity:.9}}
.ms-tiles,.ms-gear{animation:fadeIn .6s 1.1s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.ms-card{animation:cardIn .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*80ms + .5s);transition:transform .35s cubic-bezier(.2,1.6,.4,1),box-shadow .3s,border-color .2s}
@keyframes cardIn{0%{transform:translateY(90px) rotate(6deg) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.ms-card:hover{transform:translateY(-6px)}
.ms-card.on{transform:translateY(-12px) scale(1.05);box-shadow:0 0 0 2px #fff,0 0 30px var(--c),0 18px 40px rgba(0,0,0,.55);z-index:2}
.ms-card.pop{animation:popSel .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes popSel{0%{transform:translateY(-12px) scale(.96)}60%{transform:translateY(-16px) scale(1.09)}100%{transform:translateY(-12px) scale(1.05)}}
.ms-name{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em}
.ms-cat{font-family:"Dela Gothic One",sans-serif;font-weight:400;letter-spacing:.12em;color:var(--c);opacity:1}
.ms-art i{position:absolute;inset:0;pointer-events:none}
.ms-cloud{background:radial-gradient(40px 16px at 20% 22%,rgba(255,255,255,.55),transparent 70%),radial-gradient(60px 20px at 70% 14%,rgba(255,255,255,.45),transparent 70%),radial-gradient(50px 16px at 45% 40%,rgba(255,255,255,.35),transparent 70%);background-size:200% 100%;animation:cloud 18s linear infinite}
@keyframes cloud{from{background-position:0 0}to{background-position:-200% 0}}
.w-night .ms-cloud,.w-rnd .ms-cloud,.w-daily .ms-cloud{opacity:.25}
.w-rain .ms-fx,.w-storm .ms-fx{background:repeating-linear-gradient(105deg,rgba(200,220,255,.0) 0 9px,rgba(200,220,255,.45) 9px 10px);background-size:40px 40px;animation:rain .45s linear infinite}
.w-storm .ms-fx{animation-duration:.3s}.w-storm::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:bolt 5s infinite;z-index:1}
@keyframes rain{to{background-position:-12px 40px}}
@keyframes bolt{0%,88%,92%,96%,100%{opacity:0}90%,94%{opacity:.55}}
.w-snow .ms-fx{background:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,#fff,transparent),radial-gradient(3px 3px at 70% 30%,#fff,transparent),radial-gradient(2px 2px at 85% 75%,#fff,transparent),radial-gradient(2px 2px at 25% 85%,#fff,transparent);background-size:100px 100px;animation:snow 4s linear infinite}
@keyframes snow{to{background-position:20px 100px}}
.w-night .ms-fx{background:radial-gradient(1.5px 1.5px at 15% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 25%,#fff,transparent),radial-gradient(2px 2px at 80% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 40%,#fff,transparent);animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.4}to{opacity:1}}
.w-rnd .ms-fx,.w-daily .ms-fx{background:repeating-conic-gradient(from 0deg at 50% 60%,rgba(255,255,255,.12) 0 10deg,transparent 10deg 20deg);animation:sweep 20s linear infinite}
.ms-card.on .ms-pl{animation:flyAcross 3.4s cubic-bezier(.45,0,.25,1) infinite;width:70%}
@keyframes flyAcross{0%{transform:translate(-130%,50%) rotate(-4deg) scale(.7);opacity:0}12%{opacity:1}55%{transform:translate(10%,-5%) rotate(-12deg) scale(1)}88%{opacity:1}100%{transform:translate(150%,-80%) rotate(-20deg) scale(1.2);opacity:0}}
.ms-card.on .ms-art::before{content:"";position:absolute;left:-10%;top:58%;width:120%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:streak 3.4s cubic-bezier(.45,0,.25,1) infinite;z-index:1}
@keyframes streak{0%{transform:translateX(-80%) rotate(-12deg);opacity:0}40%{opacity:.8}100%{transform:translateX(60%) rotate(-12deg);opacity:0}}
.ms-shine{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 62%);transform:translateX(-120%)}
.ms-card.pop .ms-shine{animation:shine .8s ease-out}
@keyframes shine{to{transform:translateX(120%)}}
.ms-info{animation:fadeIn .6s 1.2s both}
.ms-info>*{animation:infoIn .45s cubic-bezier(.2,1.2,.4,1) both}
.ms-info h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px;animation-delay:.04s}.ms-info p{animation-delay:.1s}
.ms-info dt,.ms-info dd{animation:infoIn .4s both;animation-delay:calc(var(--j)*45ms + .15s)}
@keyframes infoIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.ms-ic{animation:icGrow .5s both!important}@keyframes icGrow{from{width:0}to{width:36px}}
.ms-go{position:relative;overflow:hidden;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:24px;letter-spacing:.4em;background:linear-gradient(90deg,#c9361f,#ff6a3d,#c9361f);background-size:200% 100%;animation:goBg 3s linear infinite,infoIn .5s .25s both;box-shadow:0 6px 0 #7a1d0e;transition:transform .1s}
.ms-go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.6),transparent);animation:goShine 2.4s ease-in-out infinite}
.ms-go:active{transform:translateY(4px);box-shadow:0 2px 0 #7a1d0e}
@keyframes goBg{to{background-position:-200% 0}}@keyframes goShine{0%,55%{left:-60%}100%{left:130%}}
/* 出発の画面転換 */
.takeoff{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.takeoff i{position:absolute;top:-20%;bottom:-20%;width:140%;left:-150%;transform:skewX(-18deg)}
.takeoff .tk1{background:#d8452f;animation:tkIn .55s cubic-bezier(.8,0,.2,1) forwards}
.takeoff .tk2{background:#11151d;animation:tkIn .55s .12s cubic-bezier(.8,0,.2,1) forwards}

.takeoff.out .tk1,.takeoff.out .tk2{animation:tkOut .6s cubic-bezier(.8,0,.2,1) forwards}

@keyframes tkTxt{0%{opacity:0;transform:scale(1.6) translateX(-60px)}60%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:none}}

/* ===== 本編UI：ランディングと統一（ダーク・シャープ） ===== */
:root{--pn:rgba(14,18,26,.9);--pn2:rgba(255,255,255,.06);--ln:rgba(255,255,255,.16);--tx:#e9edf2;--mu:rgba(233,237,242,.62);--red:#d8452f;--yel:#f2c14e;--cy:#4fd1e8;--grn:#2ecc71}
html,body{font-family:"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif}
/* HUD */
#top{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--cy);border-radius:0;color:var(--tx);box-shadow:0 6px 20px rgba(0,0,0,.35);padding:6px 10px 7px}
#stTitle{font-weight:800;font-size:13.5px;color:var(--tx)}
#stSub{color:var(--mu);font-weight:700}
#obj{color:var(--yel);font-weight:800}
.tm{background:var(--yel);color:#111;border-radius:0;padding:1px 7px;margin-right:4px;font-weight:800}.tm.low{background:var(--red);color:#fff}
#tools{background:var(--pn);border:1px solid var(--ln);border-radius:0;padding:2px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tools button{border-radius:0;color:var(--tx)}#tools button small{color:var(--mu)}
#tools button:active{background:rgba(255,255,255,.12)}
#mm{border:1px solid rgba(255,255,255,.55);border-radius:0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#cross{background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
#act{border-radius:0;background:linear-gradient(90deg,#c9361f,#ff6a3d);font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;letter-spacing:.04em;font-size:17px;padding:15px 22px;box-shadow:0 5px 0 #7a1d0e,0 10px 24px rgba(0,0,0,.35);border:0}
#act:active{transform:translateY(3px);box-shadow:0 2px 0 #7a1d0e}
#joy{border-color:rgba(255,255,255,.7);background:rgba(10,14,22,.35)}#knob{background:rgba(255,255,255,.9)}
#log{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--red);border-radius:0;font-weight:800;letter-spacing:.02em}
/* 会話パネル */
#dlg{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-top:3px solid var(--cy);border-radius:0;box-shadow:0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#dlg .who{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;color:var(--yel);font-size:16px;letter-spacing:.03em}
#dlg .say{font-size:15px;line-height:1.75;color:var(--tx)}
#dlg .ch button{background:var(--pn2);border:1px solid var(--ln);border-radius:0;color:var(--tx);min-height:46px;font-weight:700;transition:border-color .15s,background .15s}
#dlg .ch button:hover{border-color:rgba(255,255,255,.6)}
#dlg .ch button:active{background:rgba(255,255,255,.14)}
#dlg .ch button:first-child:not(.sub):not(:disabled){border-left:3px solid var(--red)}
#dlg .ch button.sub{background:transparent;border-color:rgba(255,255,255,.1);color:var(--mu)}
#dlg .ch button.on{border-color:var(--grn);background:rgba(46,204,113,.14)}
#dlg .ch small{color:var(--mu)}
.note{color:var(--mu)}
.hint{background:rgba(242,193,78,.12);border:1px solid rgba(242,193,78,.35);border-radius:0;color:var(--yel)}
.seq{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0;color:var(--tx)}
.stats{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0}
.stats span{color:var(--mu)}.stats em{color:var(--yel)}
.lst{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0;color:var(--tx)}
.lst .row{border-color:rgba(255,255,255,.08)}.lst .row small{color:var(--mu)}
.lbl{color:var(--cy);letter-spacing:.06em}
pre.clue{background:#0b0e14;border:1px solid var(--ln);border-radius:0}
.memo{background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:0}
#pad .disp{background:#0b0e14;border:1px solid var(--ln);border-radius:0}
#pad .keys button{background:var(--pn2);border:1px solid var(--ln);border-radius:0;color:var(--tx);min-height:46px}
#pad .keys button:active{background:rgba(255,255,255,.16)}
.pr{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0;color:var(--tx)}
.pr button{border-radius:0;background:var(--red);min-width:40px;height:34px}
/* オーバーレイ画面 */
#ov{background:rgba(6,8,14,.72);backdrop-filter:blur(4px)}
.card,.res{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-top:3px solid var(--cy);border-radius:0;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.card h2,.res h1{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;letter-spacing:.03em}
.card h2{font-size:24px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--red);display:inline-block}
.card h3,.res h3{color:var(--cy);letter-spacing:.06em}
.res h1{font-size:34px;text-shadow:3px 3px 0 rgba(0,0,0,.4)}.res.bad h1{color:#ff5a3d}.res.good h1{color:var(--grn)}
.res .sub{color:var(--mu)}.res .stars{color:var(--yel)}
.news{border-radius:0;background:var(--red)}
.dmg div{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0;box-shadow:none}.dmg b{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#ff5a3d}.dmg span{color:var(--mu)}
.res.good .dmg b{color:var(--tx)}
.rank{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:0;box-shadow:none}.rank b{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:var(--yel)}.rank small{color:var(--mu)}
.cause{background:rgba(255,255,255,.05);border:1px solid var(--ln);border-left:4px solid var(--red);border-radius:0}
.cause .ct i{background:rgba(216,69,47,.2);color:#ff8a70;border-radius:0}.cause .why{color:var(--mu)}.cause .hint{background:none;border:0;padding:0;color:var(--grn)}
.btn{border-radius:0;background:linear-gradient(90deg,#c9361f,#ff6a3d);font-weight:800;letter-spacing:.06em;box-shadow:0 4px 0 #7a1d0e;min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1d0e}
.btn.big{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;font-size:19px}
.btn.sub{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.chip{background:var(--pn2);border:1px solid var(--ln);border-radius:0;color:var(--tx);min-height:38px}.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.opts2 label,.hardsw{color:var(--tx)}.hardsw{background:rgba(216,69,47,.12);border:1px solid rgba(216,69,47,.4);border-radius:0;color:#ffb3a3}
input[type=checkbox],input[type=range]{accent-color:var(--red)}
textarea{background:#0b0e14;color:var(--tx);border:1px solid var(--ln);border-radius:0}
.setl button{background:var(--pn2);border:1px solid var(--ln);border-radius:0;color:var(--tx);min-height:44px}
.zk span{background:rgba(255,255,255,.05);border-radius:0;color:var(--mu)}.zk span.on{background:var(--tx);color:#111}
.ideas li.done{color:var(--grn)}
.over .go{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#ff5a3d;text-shadow:4px 4px 0 #5a1a12}.over p{color:var(--tx)}
/* 画面が開くときの動き */
.card,.res{animation:panelIn .45s cubic-bezier(.2,1.2,.4,1) both}
#dlg:not([hidden]){animation:dlgIn .28s cubic-bezier(.2,1.2,.4,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dlgIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (orientation:landscape) and (max-height:520px){@keyframes dlgIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}}
@media (min-width:760px) and (min-height:521px){#dlg:not([hidden]){animation:dlgInC .28s cubic-bezier(.2,1.2,.4,1) both}@keyframes dlgInC{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}}
@media (prefers-reduced-motion:reduce){.card,.res,#dlg{animation:none!important}}
@media (orientation:landscape) and (max-height:520px){#log{left:24%;max-width:44vw}}

/* ===== 仕上げ ===== */
#boot{position:fixed;inset:0;z-index:100;background:#0b0e14;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#boot.done{opacity:0;pointer-events:none}
.bt-in{text-align:center;color:#e9edf2;font-family:"Dela Gothic One","M PLUS 1p",sans-serif}
.bt-t{font-size:clamp(24px,5vw,44px);text-shadow:3px 3px 0 #d8452f;margin-bottom:18px}
.bt-bar{width:220px;height:4px;background:rgba(255,255,255,.12);margin:0 auto;overflow:hidden}.bt-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#d8452f,#f2c14e);animation:btl 1.1s ease-in-out infinite}
@keyframes btl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.bt-m{margin-top:14px;font:700 12px "M PLUS 1p",sans-serif;opacity:.7;line-height:1.7}
/* HUD のラベル */
.kv{display:inline-flex;align-items:baseline;gap:4px;margin-right:10px;color:var(--tx);font-weight:800}
.kv i{font-style:normal;font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.04em}
.wx{margin-left:8px;font-size:11px;color:var(--mu);border:1px solid var(--ln);padding:0 5px}
/* 選択肢のアイコン */
#dlg .ch button{display:flex;align-items:center;gap:9px}
#dlg .ch button .ic{flex:none;width:20px;height:20px;color:var(--cy)}
#dlg .ch button:first-child:not(.sub):not(:disabled) .ic{color:#ff7a5c}
#dlg .ch button.sub .ic{color:var(--mu)}
#dlg .ch button.on .ic{color:var(--grn)}
#dlg .ch button.warn{background:rgba(216,69,47,.18);border-color:rgba(216,69,47,.6)}#dlg .ch button.warn .ic{color:#ff7a5c}
#dlg .ch button span{flex:1;min-width:0}
/* ガイド */
#tip{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:min(440px,92vw);z-index:13;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-left:4px solid var(--yel);padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#tip.in{animation:tipIn .4s cubic-bezier(.2,1.3,.4,1) both}@keyframes tipIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translateX(-50%)}}
.tp-h span{display:block;font:800 10px "M PLUS 1p",sans-serif;color:var(--yel);letter-spacing:.12em}
.tp-h b{font-family:"Dela Gothic One","M PLUS 1p",sans-serif;font-weight:400;font-size:16px}
#tip p{margin:6px 0 10px;font-size:13.5px;line-height:1.7}
.tp-b{display:flex;gap:8px}.tp-b button{border:0;background:var(--red);color:#fff;font:800 13px "M PLUS 1p",sans-serif;padding:9px 20px;min-height:40px}.tp-b button.sub{background:transparent;border:1px solid var(--ln);color:var(--mu)}
@media (orientation:landscape) and (max-height:520px){#tip{top:auto;bottom:10px;left:10px;transform:none;width:min(360px,43vw)}@keyframes tipIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
/* 文字を大きく */
body.bigtxt #dlg .say{font-size:17px}body.bigtxt #dlg .ch button{font-size:15.5px;min-height:52px}body.bigtxt #stTitle{font-size:15px}body.bigtxt #stSub,body.bigtxt #obj{font-size:13px}
body.bigtxt .lst .row,body.bigtxt .note,body.bigtxt #tip p{font-size:15px}body.bigtxt #act{font-size:19px}

const VOX = 0.05;
const _e = new THREE.Euler(0,0,0,'YXZ');
const _v = new THREE.Vector3();
function hash3(x,y,z,s){ const h=Math.sin(x*127.1+y*311.7+z*74.7+s*19.31)*43758.5453; return h-Math.floor(h); }
function shade(hex,a){ const c=new THREE.Color(hex); const t=a<0?new THREE.Color(0,0,0):new THREE.Color(1,1,1); c.lerp(t,Math.abs(a)); return '#'+c.getHexString(); }
function track(rig,o,rx=0,ry=0,rz=0){
  o.userData.re=new THREE.Euler(rx,ry,rz,'YXZ');
  o.userData.rest=o.position.clone();
  o.userData.tp=o.position.clone();
  o.userData.tq=new THREE.Quaternion().setFromEuler(o.userData.re);
  o.quaternion.copy(o.userData.tq);
  rig.nodes.push(o); return o;
}
function rot(o,x=0,y=0,z=0){ const r=o.userData.re; _e.set(r.x+x,r.y+y,r.z+z,'YXZ'); o.userData.tq.setFromEuler(_e); }
function pos(o,dx=0,dy=0,dz=0){ o.userData.tp.copy(o.userData.rest); o.userData.tp.x+=dx; o.userData.tp.y+=dy; o.userData.tp.z+=dz; }
function resetRig(rig){ for(const o of rig.nodes){ rot(o); o.userData.tp.copy(o.userData.rest); } }
function applyRig(rig,k){ for(const o of rig.nodes){ o.quaternion.slerp(o.userData.tq,k); o.position.lerp(o.userData.tp,k); } }
function snapRig(rig){ for(const o of rig.nodes){ o.quaternion.copy(o.userData.tq); o.position.copy(o.userData.tp); } }
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); if(n.material&&n.material.map) n.material.map.dispose(); }); }

const VMAT = new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0});
const _col = new THREE.Color();
function voxGeo(list){
  const key=(x,y,z)=>x+','+y+','+z;
  const set=new Set(list.map(v=>key(v[0],v[1],v[2])));
  const P=[],N=[],C=[],I=[];
  for(const [x,y,z,hex] of list){
    _col.set(hex);
    for(let a=0;a<3;a++) for(const s of [1,-1]){
      const d=[0,0,0]; d[a]=s;
      if(set.has(key(x+d[0],y+d[1],z+d[2]))) continue;
      const b=(a+1)%3, c=(a+2)%3, base=[x,y,z];
      const quad=[[0,0],[1,0],[1,1],[0,1]];
      const order=s>0?[0,1,2,3]:[0,3,2,1];
      const vi=P.length/3;
      for(const qi of order){
        const p=base.slice(); p[a]+= s>0?1:0; p[b]+=quad[qi][0]; p[c]+=quad[qi][1];
        P.push(p[0],p[1],p[2]); N.push(d[0],d[1],d[2]); C.push(_col.r,_col.g,_col.b);
      }
      I.push(vi,vi+1,vi+2,vi,vi+2,vi+3);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeBoundingSphere();
  return g;
}
function vbox(sx,sy,sz,ox,oy,oz,fn){ const L=[]; for(let x=0;x<sx;x++)for(let y=0;y<sy;y++)for(let z=0;z<sz;z++){ const c=fn(x,y,z); if(c) L.push([ox+x,oy+y,oz+z,c]); } return L; }
function vmesh(list){ const m=new THREE.Mesh(voxGeo(list),VMAT); m.castShadow=true; m.receiveShadow=true; return m; }
const matCache={};
function mat(hex,opt){ const k=hex+(opt?JSON.stringify(opt):''); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:hex,roughness:0.62,metalness:0},opt||{})); return matCache[k]; }
function cube(w,h,d,hex){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(hex,{roughness:0.8})); m.castShadow=true; return m; }

function bodyColor(P,x,y,z){
  const {bw,bh,bl,c1,c2,c3}=P, front=z===bl-1, bottom=y===0, side=(x===0||x===bw-1);
  switch(P.pat){
    case 'bicolor': if(bottom||(front&&y<bh-1)||(z>=bl-2&&y<=1)) return c2; return c1;
    case 'tricolor':
      if(bottom||(z>=bl-2&&y<bh-1)) return c2;
      if(y>=bh-2&&z>=1&&z<=bl-3&&!(y===bh-2&&(z===1||z===bl-3))) return c3;
      if(y===bh-3&&z>=2&&z<=bl-4&&side) return c3;
      return c1;
    case 'spots': return hash3(x,y,z,P.seed)<0.2?c3:c1;
    case 'husky': if(front&&y<bh-1) return c2; return y>=bh/2?c1:c2;
    case 'saddle':
      if(y>=bh-2&&z>0&&z<bl-1) return c3;
      if(y===bh-3&&z>=1&&z<=bl-3&&side) return c3; return c1;
    case 'tuxedo': if((front&&y<bh-1)||(bottom&&z>=bl/2)) return c2; return c1;
    case 'points': if(front&&y<=1&&!side) return c2; return c1;
    case 'brindle': return (((z*2+y+(x%2))%4===0)&&hash3(x,y,z,P.seed)>0.25)?c3:c1;
    case 'patches': return (y>0&&hash3(Math.floor(x/2),Math.floor(y/2),Math.floor(z/2.5),P.seed)<0.35)?c3:c1;
    case 'patch1': return (y>=bh-2&&z<=2)?c3:c1;
  }
  return c1;
}
function headColor(P,x,y,z,eyeRow,ex){
  const {hw,hh,hd,sh,c1,c2,c3}=P, base=P.headC||c1;
  const front=z===hd-1, top=y===hh-1, cx=x-hw/2+0.5;
  const center=Math.abs(cx)<(hw%2?0.6:1.1);
  const eyeCol=Math.abs(Math.abs(cx)-ex)<0.6;
  if(P.brow&&front&&y===eyeRow+1&&eyeCol) return P.brow;
  switch(P.head){
    case 'blaze': if(center&&((front&&y>=sh)||(top&&z>=hd-3))) return c2; return base;
    case 'cheeks': if(y<sh&&(front||z>=hd-3)) return c2; return base;
    case 'mask':
      if(top) return c1;
      if(front){ if(y>eyeRow+1) return c1; if(center&&y>=eyeRow) return c1; return c2; }
      return y<=sh?c2:c1;
    case 'spots': return (!front&&hash3(x,y,z,P.seed+5)<0.16)?c3:base;
    case 'halfface': if(center&&(front||top)) return base; if(y>=sh) return c3; return base;
  }
  return base;
}
function legColor(P,front,y,li,z){
  const base=front?(P.frontLegC||P.legC||P.c1):(P.legC||P.c1);
  if(P.socks&&y<P.socks) return P.sockC||P.c2;
  if(P.pat==='spots'&&hash3(li*5,y,z,P.seed+1)<0.2) return P.c3;
  if(P.pat==='patches'&&y>=P.L-1&&hash3(li,1,1,P.seed)<0.3) return P.c3;
  return base;
}

function buildDog(P0){
  const P=Object.assign({},DOGDEF,P0);
  if(P.sh<2) P.sh=2;
  const {bw,bh,bl,L,lw,hw,hh,hd,sw,sh,sl}=P;
  const rig={type:'dog',P,nodes:[],ears:[],legs:{},eyes:[]};
  const root=new THREE.Group(); rig.root=root;
  const mover=track(rig,new THREE.Group()); root.add(mover); rig.mover=mover;
  const hipZ=-bl/2+lw/2;
  const bodyG=new THREE.Group(); bodyG.position.set(0,L,hipZ); mover.add(bodyG); track(rig,bodyG); rig.bodyG=bodyG;
  const inner=new THREE.Group(); inner.position.set(0,-L,-hipZ); bodyG.add(inner);
  inner.add(vmesh(vbox(bw,bh,bl,-bw/2,L,-bl/2,(x,y,z)=>bodyColor(P,x,y,z))));
  if(P.ruff) inner.add(vmesh(vbox(bw+2,bh,2,-(bw+2)/2,L+1,bl/2-1.5,()=>P.ruff)));
  const legX=Math.max(bw/2-lw/2,lw/2), fz=bl/2-lw/2;
  [['FL',legX,fz,true],['FR',-legX,fz,true],['RL',legX,hipZ,false],['RR',-legX,hipZ,false]].forEach(([n,x,z,front],li)=>{
    const piv=new THREE.Group(); piv.position.set(x,L,z); inner.add(piv); track(rig,piv);
    const m=vmesh(vbox(lw,L+1,lw,-lw/2,-L,-lw/2,(xx,yy,zz)=>legColor(P,front,yy,li,zz)));
    m.scale.set(0.97,1,0.97); piv.add(m); rig.legs[n]=piv;
  });
  const head=new THREE.Group(); head.position.set(0,L+bh-1,bl/2-1); inner.add(head); track(rig,head); rig.head=head;
  const eyeY=Math.min(sh+1.5,hh-1.5), eyeRow=Math.floor(eyeY), ex=Math.max(1,hw/2-1.5);
  const hm=vmesh(vbox(hw,hh,hd,-hw/2,0,-1,(x,y,z)=>headColor(P,x,y,z,eyeRow,ex))); hm.scale.setScalar(1.004); head.add(hm);
  const sz0=hd-1;
  const sc=P.snoutC||(['blaze','cheeks','mask','halfface'].includes(P.head)?P.c2:(P.headC||P.c1));
  const muzzle=P.beard||sc;
  head.add(vmesh(vbox(sw,sh-1,sl,-sw/2,1,sz0,()=>muzzle)));
  const jaw=new THREE.Group(); jaw.position.set(0,1,sz0); head.add(jaw); track(rig,jaw); rig.jaw=jaw;
  const bd=P.beard?1:0;
  jaw.add(vmesh(vbox(sw,1+bd,sl,-sw/2,-1-bd,0,()=>muzzle)));
  const tongue=cube(Math.max(1,sw-1.4),0.2,sl*0.8,'#ee7d8c'); tongue.position.set(0,0.1,sl*0.45); jaw.add(tongue);
  if(P.tongue){ const tg=cube(1,1.2,0.3,'#ee7d8c'); tg.position.set(0.2,-0.5,sl+0.1); jaw.add(tg); }
  const nw=sw>=4?2:1, nose=cube(nw,1,1,P.nose); nose.position.set(0,sh-0.45,sz0+sl-0.3); head.add(nose);
  for(const s of [1,-1]){
    const eg=new THREE.Group(); eg.position.set(s*ex,eyeY,sz0+0.12); head.add(eg); rig.eyes.push(eg);
    const e=cube(P.eS,P.eS,0.3,P.eye); eg.add(e);
    const hl=cube(0.34*P.eS,0.34*P.eS,0.1,'#ffffff'); hl.position.set(0.2*P.eS,0.2*P.eS,0.17); eg.add(hl);
  }
  const earC=P.earC||P.headC||P.c1, inC=shade(earC,0.35);
  for(const s of [1,-1]){
    const piv=new THREE.Group(); let list=[], re=[0,0,0];
    if(P.ear==='flop'){
      piv.position.set(s*hw/2,hh-0.5,(hd-2)/2-0.5);
      list=vbox(P.eW,P.eL,P.eD,s>0?0:-P.eW,-P.eL+0.5,-P.eD/2,()=>earC);
    } else if(P.ear==='fold'){
      piv.position.set(s*(hw/2-0.6),hh,hd/2-1.5);
      list=vbox(2,1,2,-1,0,-1,()=>earC).concat(vbox(2,1,1,-1,-0.6,1,()=>earC));
    } else {
      const w=P.eW,h=P.eL;
      piv.position.set(s*(hw/2-w),hh,(hd-2)/2-1);
      for(let r=0;r<h;r++){ const width=Math.max(1,w-Math.floor(r*w/h));
        for(let i=0;i<w;i++){ const keep=s>0?i>=w-width:i<width; if(!keep) continue;
          const xx=s>0?i:-w+i;
          list.push([xx,r,-1,earC]);
          const inner=(r<h-1&&width>1&&(s>0?i>w-width:i<width-1))||(w===1&&r<h-1&&h>2);
          list.push([xx,r,0,inner?inC:earC]);
        }}
      if(P.ear==='bat') re=[0,0,-s*0.3];
      if(P.ear==='butterfly') re=[0,0,-s*0.6];
    }
    piv.add(vmesh(list)); head.add(piv); track(rig,piv,...re); piv.userData.s=s; rig.ears.push(piv);
  }
  if(P.topknot){
    head.add(vmesh(vbox(3,1,3,-1.5,hh,hd/2-2.5,()=>P.headC||P.c1)));
    if(P.bow){ const b=cube(2.2,0.9,0.9,P.bow); b.position.set(0,hh+1.3,hd/2-1); head.add(b); const k=cube(0.7,0.7,1,shade(P.bow,-0.2)); k.position.copy(b.position); head.add(k); }
  }
  const collar=cube(hw+0.25,0.8,hd+0.25,'#e04848'); collar.position.set(0,0.35,hd/2-1); head.add(collar);
  const tag=cube(0.7,0.7,0.2,'#f2c94c'); tag.position.set(0,-0.3,hd-0.8); collar.add(tag);
  rig.collar=collar;
  const tail=new THREE.Group(); tail.position.set(0,L+bh-1,-bl/2+0.5); inner.add(tail);
  const tc=P.tailC||P.c1, tip=P.tailTip;
  let pts=[], w=P.tW, rx=-0.3;
  const chain=n=>{ for(let i=0;i<n;i++) pts.push([0,i,0]); };
  switch(P.tail){
    case 'up': chain(P.tl); rx=-0.3; break;
    case 'stub': chain(Math.max(1,P.tl)); rx=-0.6; break;
    case 'curl': pts=[[0,0,0],[0,1,0],[0,2,0],[0,3,1],[0,3,2],[0,2,3]]; rx=0; break;
    case 'fluffy': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,2,1],[0,2,2],[0,2,3],[0,1,3]]; rx=-0.1; break;
    case 'feather': case 'down': chain(P.tl); rx=-2.25; break;
    case 'whip': w=1; chain(P.tl); rx=-2.5; break;
    case 'pom': w=1; chain(P.tl); rx=-0.45; break;
    case 'pugcurl': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,1,1]]; rx=0.2; break;
  }
  const tv=[], seen=new Set();
  pts.forEach((p,pi)=>{ for(let a=0;a<w;a++)for(let b=0;b<w;b++)for(let c=0;c<w;c++){
    const v=[p[0]-w/2+a,p[1]+b,p[2]-w/2+c];
    const k=v.join(','); if(seen.has(k)) continue; seen.add(k);
    tv.push([v[0],v[1],v[2],(tip&&pi===pts.length-1)?tip:tc]); } });
  if(P.tail==='pom') for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++) tv.push([-1+a,P.tl+b,-1+c,tc]);
  tail.add(vmesh(tv)); track(rig,tail,rx,0,0); rig.tail=tail;
  const phone=new THREE.Group();
  const pb=cube(1.3,2.2,0.35,'#2f3440'); phone.add(pb);
  const scr=cube(1.05,1.8,0.06,'#8fd4ff'); scr.position.z=-0.2; phone.add(scr);
  phone.position.set(0.3,-L+0.6,lw/2+0.4); phone.visible=false;
  rig.legs.FR.add(phone); rig.phone=phone;
  rig.height=(L+bh+hh)*VOX; rig.withers=(L+bh)*VOX; rig.len=(bl+hd+sl)*VOX;
  resetRig(rig); snapRig(rig);
  return rig;
}

const DOG_MOTIONS=[['idle','待機'],['walk','歩く'],['run','走る'],['sit','おすわり'],['down','伏せ'],['sleep','寝る'],['jump','ジャンプ'],['happy','喜ぶ'],['bark','吠える'],['shake','ブルブル'],['dig','穴掘り'],['sad','しょんぼり'],['beg','おねだり'],['phone','電話'],['paw','お手'],['spin','くるくる'],['sniff','クンクン']];
function dogWag(R,amt){ rot(R.tail,0,0,amt); }
function dogEars(R,amt,back=0){ for(const e of R.ears){ if(R.P.ear==='flop') rot(e,back,0,e.userData.s*amt); else rot(e,-amt*0.6-back,0,0); } }
function sitPose(R){
  const P=R.P, D=P.bl-P.lw, L=P.L;
  const a=Math.min(1.0,Math.max(0.12,Math.asin(Math.max(-0.99,Math.min(0.99,(L-0.3)/D)))));
  const hipY=Math.max(0.2,L-D*Math.sin(a));
  const beta=Math.acos(Math.min(1,hipY/L));
  return {a,hipY,beta};
}
function animateDog(R,m,t){
  resetRig(R);
  const P=R.P, Lg=R.legs, s=Math.sin;
  let blink=((t+P.seed)%3.7)<0.13, eyeS=1;
  R.phone.visible=false;
  switch(m){
    case 'idle':
      pos(R.bodyG,0,s(t*2.2)*0.12,0); dogWag(R,s(t*5)*0.35); rot(R.head,s(t*0.7)*0.06,s(t*0.5)*0.15,0); dogEars(R,0.05+s(t*1.3)*0.04); break;
    case 'walk': { const ph=t*7;
      rot(Lg.FL,s(ph)*0.5); rot(Lg.RR,s(ph)*0.5); rot(Lg.FR,-s(ph)*0.5); rot(Lg.RL,-s(ph)*0.5);
      pos(R.bodyG,0,Math.abs(s(ph))*0.25,0); rot(R.head,s(ph*2)*0.04); dogWag(R,s(t*7)*0.4); dogEars(R,0.1+Math.abs(s(ph))*0.1); break; }
    case 'run': { const ph=t*13;
      rot(Lg.FL,s(ph)*0.95); rot(Lg.FR,s(ph+0.35)*0.95); rot(Lg.RL,s(ph+Math.PI)*0.95); rot(Lg.RR,s(ph+Math.PI+0.35)*0.95);
      rot(R.bodyG,s(ph)*0.12); pos(R.mover,0,Math.abs(s(ph))*1.2,0); rot(R.tail,-0.6,0,s(ph)*0.2); rot(R.head,-s(ph)*0.1+0.1);
      dogEars(R,0.5+s(ph)*0.3,0.4); break; }
    case 'sit': case 'phone': case 'paw': { const S=sitPose(R);
      rot(R.bodyG,-S.a); pos(R.bodyG,0,S.hipY-P.L,0);
      rot(Lg.FL,S.a); rot(Lg.FR,S.a); rot(Lg.RL,-S.beta+S.a,0,0.15); rot(Lg.RR,-S.beta+S.a,0,-0.15);
      rot(R.head,S.a*0.85+s(t*0.8)*0.04); rot(R.tail,-0.9,0,s(t*5)*0.4); dogEars(R,0.06);
      if(m==='phone'){ rot(Lg.FR,S.a-2.55,0,-0.35); rot(R.head,S.a*0.85+0.05,0.15,0.28); R.phone.visible=true;
        rot(R.jaw,Math.max(0,s(t*11))*0.28*(s(t*1.7)>-0.3?1:0)); dogEars(R,-0.08,0); }
      if(m==='paw'){ rot(Lg.FR,S.a-1.35+s(t*4)*0.1,0,0); rot(R.head,S.a*0.85,0,s(t*2)*0.2); rot(R.tail,-0.9,0,s(t*12)*0.5); }
      break; }
    case 'down': case 'sleep': {
      pos(R.bodyG,0,P.lw/2-P.L,0); rot(Lg.FL,-1.45); rot(Lg.FR,-1.45); rot(Lg.RL,-1.45,0,0.2); rot(Lg.RR,-1.45,0,-0.2);
      rot(R.tail,-1.4,0,m==='sleep'?0.6:s(t*3)*0.3);
      if(m==='sleep'){ rot(R.head,0.32,0.25,0.15); pos(R.head,0,-1.2,0); pos(R.bodyG,0,P.lw/2-P.L+s(t*1.6)*0.12,0); eyeS=0.12; dogEars(R,-0.1,0.2); }
      else { rot(R.head,0.05,s(t*0.6)*0.25); dogEars(R,0.06); }
      break; }
    case 'jump': { const cyc=1.3, p=(t%cyc)/cyc;
      let y=0, crouch=0;
      if(p<0.2) crouch=s(p/0.2*Math.PI); else if(p<0.8) y=s((p-0.2)/0.6*Math.PI)*8;
      pos(R.mover,0,y,0); pos(R.bodyG,0,-crouch*1.2,0);
      const air=p>=0.2&&p<0.8; const up=p<0.5;
      rot(Lg.FL,air?-0.8:crouch*0.4); rot(Lg.FR,air?-0.8:crouch*0.4); rot(Lg.RL,air?0.9:-crouch*0.5); rot(Lg.RR,air?0.9:-crouch*0.5);
      rot(R.bodyG,air?(up?-0.3:0.25):0); rot(R.tail,-0.5,0,s(t*10)*0.3); dogEars(R,air?0.7:0.1,air?0.3:0); break; }
    case 'happy': {
      const hop=Math.max(0,s(t*9));
      rot(R.bodyG,-hop*0.18); rot(Lg.FL,-hop*0.6); rot(Lg.FR,-hop*0.6);
      pos(R.mover,0,hop*0.6,0); rot(R.mover,0,s(t*4.5)*0.3,0);
      dogWag(R,s(t*20)*0.7); rot(R.head,-0.1,0,s(t*3)*0.2); rot(R.jaw,0.3); dogEars(R,0.3+hop*0.2); break; }
    case 'bark': { const b=Math.max(0,s(t*7))**2;

const DOWN=new THREE.Vector3(0,-1,0);
function ik(rig,side,target,pole){
  const sh=side<0?rig.shR:rig.shL, el=side<0?rig.elR:rig.elL, D=rig.dims;
  const S=sh.userData.rest, a=D.upper, b=D.fore+D.handR*0.55;
  const d=target.clone().sub(S); let dist=d.length(); dist=Math.min(a+b-1e-4,Math.max(Math.abs(a-b)+1e-4,dist));
  const dir=d.normalize();
  const cosA=Math.min(1,Math.max(-1,(a*a+dist*dist-b*b)/(2*a*dist))), A=Math.acos(cosA);
  const P=(pole||new THREE.Vector3(side*0.9,-0.4,-0.5)).clone();
  const perp=P.sub(dir.clone().multiplyScalar(P.dot(dir))).normalize();
  const e1=dir.clone().multiplyScalar(cosA).add(perp.multiplyScalar(Math.sin(A))).normalize();
  const E=S.clone().add(e1.clone().multiplyScalar(a)), T2=S.clone().add(dir.clone().multiplyScalar(dist));
  const e2=T2.sub(E).normalize();
  const qU=new THREE.Quaternion().setFromUnitVectors(DOWN,e1);
  const e2l=e2.applyQuaternion(qU.clone().invert());
  sh.userData.tq.copy(qU); el.userData.tq.setFromUnitVectors(DOWN,e2l);
}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function animateHuman(R,m,t){

    case 'idle': pos(R.hips,0,s(t*2)*D.T*0.004,0); rot(R.shL,0,0,s(t*2)*0.03); rot(R.shR,0,0,-s(t*2)*0.03); rot(R.neck,s(t*0.7)*0.04,s(t*0.5)*0.18,0); rot(R.torso,0,s(t*0.5)*0.04,0); break;
    case 'walk': { const ph=t*7; legs(ph,0.55,0.8); rot(R.shL,-s(ph)*0.5); rot(R.shR,s(ph)*0.5); rot(R.elL,-0.25); rot(R.elR,-0.25);
      pos(R.mover,0,Math.abs(s(ph))*D.T*0.015,0); rot(R.torso,0,s(ph)*0.08,0); rot(R.neck,0,-s(ph)*0.06,0); break; }
    case 'run': { const ph=t*11; legs(ph,0.95,1.5); rot(R.shL,-s(ph)*0.9); rot(R.shR,s(ph)*0.9); rot(R.elL,-1.4); rot(R.elR,-1.4);
      rot(R.torso,0.18,s(ph)*0.12,0); rot(R.neck,-0.12); pos(R.mover,0,Math.abs(s(ph))*D.T*0.05,0); break; }
    case 'wave': ik(R,-1,V(-(D.tw+D.R*0.55)+s(t*8)*D.R*0.28,D.headY+D.R*0.35,D.R*0.35),V(-1,-0.6,-0.2)); rot(R.neck,0,-0.1,0.14); rot(R.shL,0,0,0.05); pos(R.hips,0,s(t*2)*D.T*0.004,0); break;

      ik(R,1,V(D.tw*1.3,D.torsoLen*0.12,-D.tw*0.15),V(1,0,-0.6));

    case 'think':
      ik(R,-1,V(-D.R*0.12,D.headY-D.R*0.92,D.R*0.6),V(-1,-1,0.2));
      ik(R,1,V(-D.tw*0.15,D.torsoLen*0.42,D.tw*1.05),V(1,-0.5,0.3));

    case 'cheer': { const p=Math.abs(s(t*4));

      rot(R.torso,0.65*b); rot(R.neck,0.25*b); rot(R.shL,-0.6*b,0,0.05); rot(R.shR,-0.6*b,0,-0.05); rot(R.hipL,-0.05*b); rot(R.hipR,-0.05*b); break; }
    case 'dance': { const ph=t*6, a=s(ph);
      rot(R.hips,0,0,a*0.12); rot(R.torso,0,0,-a*0.18); pos(R.mover,a*D.T*0.03,Math.abs(s(ph*2))*D.T*0.02,0);

      ik(R,1,a<0?V(D.tw+D.R*0.4,D.headY+D.R*1.2,D.R*0.2):V(D.tw*1.3,D.torsoLen*0.2,D.tw*0.4),V(1,0,-0.5));

function makeRandomStage(){
  const pool=ORDER.filter(j=>!['pilot','fuel','deice','lights'].includes(j)); const n=rint(4,9); const jobs=['fuel','pilot'];
  while(jobs.length<n+2){ const j=pick(pool); if(!jobs.includes(j)) jobs.push(j); }
  const w=pick(['clear','rain','snow','night','storm']); if((w==='snow'||w==='storm')&&!jobs.includes('deice')) jobs.push('deice'); if((w==='night'||w==='storm')&&!jobs.includes('lights')) jobs.push('lights');
  const names=BREEDS.map(b=>b[0]); const dogs=[];
  while(dogs.length<Math.min(18,jobs.length+3)){ const d=pick(names); if(!dogs.includes(d)) dogs.push(d); }
  return {id:'rnd',lv:2,n:'ランダム便',w,pax:rint(60,300),time:420+jobs.length*50,jobs:ORDER.filter(j=>jobs.includes(j)),dogs};
}

function blockTex(base,noise=0.14,seed=1){
  const cv=document.createElement('canvas'); cv.width=cv.height=16; const g=cv.getContext('2d');
  for(let x=0;x<16;x++)for(let y=0;y<16;y++){ g.fillStyle=shade(base,(hash3(x,y,0,seed)-0.5)*noise*2); g.fillRect(x,y,1,1); }
  const t=new THREE.CanvasTexture(cv); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestMipmapNearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t;
}
function flat(w,d,tex,x,z,y=0.01,rep=1){
  const t=tex.clone(); t.needsUpdate=true; t.repeat.set(w/rep,d/rep);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({map:t,roughness:1}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); m.receiveShadow=true; scene.add(m); return m;
}

function buildPlaneMesh(tint){
  const L=[]; const add=(x,y,z,c)=>L.push([x,y,z,c]);
  const W='#f4f6f8',BL='#2f7fd8',BE='#d8dde3',TL='#e04848',WIN='#24344d';
  for(let x=0;x<28;x++){
    let r=3, cy=2.5;
    if(x>=23) r=3-(x-23)*0.55; if(x<6){ r=1.6+x*0.24; cy=2.5+(6-x)*0.35; }
    for(let y=-1;y<7;y++)for(let z=-4;z<4;z++){
      const dy=(y+0.5-cy)/r, dz=(z+0.5)/3; if(dy*dy+dz*dz>1) continue;
      let c=W; if(y+0.5<cy-r*0.45) c=BE;
      if(Math.abs(y+0.5-cy+0.4)<0.6) c=BL;
      if(y===3&&x>=6&&x<=21&&x%2===0&&(z===-3||z===2)) c=WIN;
      if(x>=23&&x<=24&&y===3&&Math.abs(z+0.5)<2) c=WIN;
      add(x,y,z,c);
    }
  }
  for(let x=10;x<16;x++)for(let z=-16;z<16;z++){ const az=Math.abs(z+0.5); if(x<10+az*0.25) continue; if(az<3) continue; add(x,1,z,az>14?TL:'#e8ebef'); }
  for(const s of [-1,1]) for(let x=9;x<14;x++)for(let y=-1;y<1;y++)for(let z=0;z<2;z++) add(x,y,s>0?6+z:-8+z,x===13?'#555':'#c9ced4');
  for(let x=0;x<5;x++)for(let y=5;y<11;y++){ if(x<(y-5)*0.7) continue; add(x,y,-1,TL); add(x,y,0,TL); }
  for(let x=0;x<3;x++)for(let z=-7;z<7;z++) add(x,4,z,'#e8ebef');
  for(const [gx,gz] of [[22,-1],[22,0],[12,-3],[12,2]]) { add(gx,-2,gz,'#222'); add(gx,-3,gz,'#222'); }
  const m=new THREE.Mesh(voxGeo(L),tint?new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,color:tint}):VMAT);
  m.castShadow=true; m.scale.setScalar(0.5); m.position.set(-7,1.5,0);
  const g=new THREE.Group(); g.add(m); return g;
}

  sun.intensity={clear:2.2,rain:1.2,snow:1.2,night:0.45,storm:0.8}[w]; hemi.intensity={clear:1.5,rain:1.8,snow:1.8,night:0.95,storm:1.5}[w];
  sun.color.set(w==='night'?'#9fb0ff':'#ffffff'); termLight.intensity=w==='night'?80:40; hangLight.intensity=w==='night'?60:30;
  if(w==='clear'||w==='night') return; const wk=w==='storm'?'rain':w;
  const N=w==='storm'?4000:w==='rain'?2500:1800, P=new Float32Array(N*3);

function updateWeather(dt,c){

function buildCat(P){
  const rig=buildDog(Object.assign({},CATBASE,P,{seed:(P.seed||7)}));
  const Q=rig.P, z=Q.hd-1+Q.sl+0.05, y=Q.sh-0.6;
  for(const sd of [-1,1]) for(const k of [0,1]){ const w=cube(3,0.14,0.14,'#ffffff'); w.position.set(sd*(Q.sw/2+1.2),y+k*0.5,z-0.3); w.rotation.z=sd*(k?-0.15:0.15); rig.head.add(w); }
  rig.collar.scale.set(0.8,0.7,0.8); rig.collar.material=mat('#e86a8f',{roughness:0.8});
  return rig;
}

function choosePuzzles(n,lv=2){
  // 便の難易度で重みをつけ、カテゴリが偏らないように選ぶ。おつかいは最大2つ
  const WT={1:[3,1,0.05],2:[1,3,1.2],3:[0.3,2,3]}[lv];
  const byCat={}; PUZ.map(p=>({p,k:Math.pow(Math.random(),1/WT[p.d-1])})).sort((a,b)=>b.k-a.k).forEach(({p})=>{ (byCat[p.cat]=byCat[p.cat]||[]).push(p); });
  const cats=shuffle(Object.keys(byCat)); const out=[]; let fetches=0, k=0;
  while(out.length<n&&k<500){ const c=cats[k%cats.length]; k++; const list=byCat[c]; if(!list.length) continue;
    const p=list.shift(); if(p.fetch){ if(fetches>=2) continue; fetches++; } out.push(p); }
  return out;
}

function routeTo(d,t){

  if(inTerm(p)&&!inTerm(t)) path.push(V(-37.5,0,28),V(-37.5,0,24));
  if(inHang(p)&&!inHang(t)) path.push(V(9.5,0,27),V(9.5,0,22));
  if(!inTerm(p)&&inTerm(t)) path.push(V(-37.5,0,24),V(-37.5,0,28));

      P.vx=Math.max(0,P.vx-5*dt); P.x+=P.vx*dt; P.y=Math.abs(Math.sin(P.pt*9))*0.4*Math.max(0,1-P.pt/3); P.pitch=Math.sin(P.pt*9)*0.06; if(P.x>59) crashAt(1.6); break;
  }
  if(ty==='collision'&&P.phase==='roll') plane2.position.z=Math.min(0,-34+P.t*7.2);
  if(P.phase!=='taxi') engineSet(P.boomed?0:P.vx);
  P.mesh.position.set(P.x,P.y,P.z); P.mesh.rotation.set(P.roll,-P.yaw,P.pitch,'YZX');
  const t=new THREE.Vector3(P.x,P.y+1,P.z); camTarget.lerp(t,1-Math.exp(-dt*4));
  camera.position.lerp(t.clone().add(new THREE.Vector3(-10,7+P.y*0.3,-26)),1-Math.exp(-dt*2.5)); camera.lookAt(camTarget);
}

  if(crash||planeRes.some(p=>p.crash)){ bld+=3; dmg+=80; }

  if(planeRes.length>1) h+=`<h3>✈️ 各機の結果</h3><div class="lst">${planeRes.map(pr=>`<div class="row"><b>${G.planes[pr.pi].label}機${pr.pi===planeRes.length-1?'（あなたの便）':''}</b><span>${pr.crash?'💥 '+CRASH_NAME[pr.crash]:pr.fails.length?'🛫 離陸（トラブル'+pr.fails.length+'件）':'🛫 完璧に離陸'}</span></div>`).join('')}</div>`;
  if(fails.length||hazards.length){ h+=`<h3>何がいけなかったか</h3>`;
    for(const j of fails){ const J=JOBS[j], r=res[j], b=bestFor(j); let why,cause;
      if(r.viol&&!r.rebel){ cause=`手順ミス：${r.viol}`; why='離陸プログラムの順番がまちがっていた（手順書で確認できる）'; }

  }

  h+=scoreBlock(crash,starsN,inj,dmg);

}

const MCCOL=['light_blue','light_gray','white','orange','magenta','yellow','lime','pink','gray','cyan','purple','blue','brown','green','red','black'];
function mcColor(name){
  let n=name.toLowerCase().replace(/^minecraft:/,'').replace(/\[.*$/,'');
  if(MC[n]) return MC[n];
  for(const c of MCCOL) if(n.startsWith(c+'_')){ const base=MC[c]; if(n.includes('glass')) return shade(base,0.45); if(n.includes('terracotta')) return shade(base,-0.25); return base; }
  for(const [k,c] of [['glass','#cde9f5'],['leaves','#4f8a2e'],['log','#6b5533'],['wood','#6b5533'],['planks','#a2834f'],['stair','#9a9a9a'],['slab','#9a9a9a'],['brick','#966153'],['stone','#7d7d7d'],['concrete','#a0a0a0'],['wool','#e9ecec'],['fence','#a2834f'],['door','#8a6a3e'],['lamp','#f0c36a'],['lantern','#f0c36a'],['ore','#808080'],['copper','#c06a4e']]) if(n.includes(k)) return c;
  const h=[...n].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7); return '#'+new THREE.Color().setHSL((Math.abs(h)%360)/360,0.35,0.55).getHexString();
}
function parseMcfunction(text){
  const vox=new Map(); const LIMIT=400000; let lines=0, skipped=0;
  const num=t=>{ t=t.replace(/^[~^]/,''); return t===''?0:Math.floor(parseFloat(t)); };
  const isAir=b=>/(^|:)(air|cave_air|void_air)\b/.test(b);
  for(let raw of text.split(/\r?\n/)){
    let s=raw.trim(); if(!s||s.startsWith('#')) continue; s=s.replace(/^\//,'').replace(/^execute\s.*?\brun\s+/,'');
    const tk=s.match(/\S+\[[^\]]*\]|\S+/g)||[]; const cmd=tk[0];
    if(cmd==='fill'&&tk.length>=8){
      let [x1,y1,z1,x2,y2,z2]=tk.slice(1,7).map(num); const b=tk[7]; const rest=tk.slice(8).join(' ');
      const hollow=/\bhollow\b/.test(rest), outline=/\boutline\b/.test(rest), keep=/\bkeep\b/.test(rest);
      if(x1>x2)[x1,x2]=[x2,x1]; if(y1>y2)[y1,y2]=[y2,y1]; if(z1>z2)[z1,z2]=[z2,z1];
      const air=isAir(b), col=air?null:mcColor(b), glass=/glass/.test(b);
      for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++){
        const shell=x===x1||x===x2||y===y1||y===y2||z===z1||z===z2; const k=x+','+y+','+z;
        if(!shell&&outline) continue; if(!shell&&hollow){ vox.delete(k); continue; } if(keep&&vox.has(k)) continue;
        if(air) vox.delete(k); else { if(vox.size>=LIMIT){ skipped++; continue; } vox.set(k,[x,y,z,col,glass]); } }
      lines++;
    } else if(cmd==='setblock'&&tk.length>=5){
      const [x,y,z]=tk.slice(1,4).map(num); const b=tk[4]; const k=x+','+y+','+z;
      if(isAir(b)) vox.delete(k); else if(vox.size<LIMIT) vox.set(k,[x,y,z,mcColor(b),/glass/.test(b)]); else skipped++;
      lines++; }
  }
  return {vox:[...vox.values()],lines,skipped};
}
function applyCustomMap(text){
  const r=parseMcfunction(text); if(!r.vox.length) return {ok:false,msg:'fill / setblock のコマンドが見つかりませんでした'};
  customGroup.clear(); for(const k of customSolid) SOLID.delete(k); customSolid=[];
  let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9; for(const v of r.vox){ mnx=Math.min(mnx,v[0]); mny=Math.min(mny,v[1]); mnz=Math.min(mnz,v[2]); mxx=Math.max(mxx,v[0]); }
  const cx=Math.floor((mnx+mxx)/2);
  const A=[],Gl=[]; for(const [x,y,z,c,g] of r.vox){ const X=x-cx-30, Y=y-mny, Z=z-mnz+24; (g?Gl:A).push([X,Y,Z,shade(c,(hash3(x,y,z,3)-0.5)*0.12)]);
    if(Y>=1&&Y<=2){ const k=X+','+Z; if(!SOLID.has(k)){ SOLID.add(k); customSolid.push(k); } } }
  if(A.length) customGroup.add(blockMesh(A)); if(Gl.length) customGroup.add(blockMesh(Gl,glassMat));
  bldg.visible=false; customMap=true;
  return {ok:true,msg:`${r.vox.length.toLocaleString()}ブロック（${r.lines}コマンド）を配置しました${r.skipped?`／上限超過で${r.skipped}ブロック省略`:''}。地面の1段目は床として歩けます`};
}

let AC=null, ENG=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); return AC; }
function tone(f0,f1,dur,type='square',vol=0.12,delay=0){ if(!CFG.snd) return; const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(Math.max(0.0009,vol*CFG.vse),t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.03); }
function noise(dur,vol=0.2,lp=1200,delay=0){ if(!CFG.snd) return; const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; const g=a.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); s.connect(f).connect(g).connect(a.destination); s.start(t); }
function sfx(k,arg){
  switch(k){
    case 'bark': { const p=900-clamp(arg||1,0.4,1.6)*380; tone(p,p*0.55,0.11,'square',0.1); tone(p*0.95,p*0.5,0.13,'square',0.08,0.15); break; }
    case 'ok': [523,659,784,1046].forEach((f,i)=>tone(f,f*1.01,0.18,'triangle',0.12,i*0.08)); break;
    case 'ng': tone(240,110,0.32,'sawtooth',0.08); break;
    case 'pick': tone(880,1400,0.12,'triangle',0.12); tone(1400,1800,0.1,'triangle',0.08,0.1); break;
    case 'unlock': [392,523,659,784].forEach((f,i)=>tone(f,f,0.25,'triangle',0.12,i*0.11)); break;
    case 'step': noise(0.045,0.035,500); break;
    case 'click': tone(1300,1200,0.03,'square',0.03); break;
    case 'boom': noise(1.4,0.5*Math.min(1.5,arg||1),420); tone(110,28,1.1,'sine',0.35); break;
    case 'meow': { const p=650/clamp(arg||0.6,0.4,1.2); tone(p*0.8,p*1.3,0.16,'triangle',0.1); tone(p*1.3,p*0.7,0.3,'triangle',0.09,0.15); break; }
    case 'build': noise(0.08,0.25,2500); tone(320,260,0.1,'square',0.07,0.06); tone(640,520,0.08,'square',0.05,0.2); break;
    case 'warn': tone(880,880,0.15,'square',0.07); tone(660,660,0.15,'square',0.07,0.2); break;
  }
}
function engineStart(){ if(!CFG.snd) return; const a=ac(); if(!a||ENG) return; const o=a.createOscillator(), o2=a.createOscillator(), f=a.createBiquadFilter(), g=a.createGain();
  o.type='sawtooth'; o2.type='square'; o.frequency.value=60; o2.frequency.value=61; f.type='lowpass'; f.frequency.value=500; g.gain.value=0.0001;
  o.connect(f); o2.connect(f); f.connect(g).connect(a.destination); o.start(); o2.start(); g.gain.linearRampToValueAtTime(0.07,a.currentTime+1); ENG={o,o2,f,g}; }
function engineSet(v){ if(!ENG||!AC) return; const t=AC.currentTime; ENG.o.frequency.setTargetAtTime(60+v*7,t,0.2); ENG.o2.frequency.setTargetAtTime(61+v*7.3,t,0.2); ENG.f.frequency.setTargetAtTime(500+v*60,t,0.2); if(v===0) ENG.g.gain.setTargetAtTime(0.0001,t,0.3); }
function engineStop(){ if(!ENG||!AC) return; const e=ENG; ENG=null; e.g.gain.setTargetAtTime(0.0001,AC.currentTime,0.4); setTimeout(()=>{ try{ e.o.stop(); e.o2.stop(); }catch(x){} },1500); }

function handleTap(x,y){
  if((G.phase!=='play'&&G.phase!=='rebuild')||G.dlg) return;
  tapRay.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-y/innerHeight*2+1),camera); tapRay.far=60;
  const objs=G.phase==='rebuild'?[rbGroup]:[dogGroup,world,...G.npcs.map(n=>n.holder)]; if(props.userData.stairs) objs.push(props.userData.stairs);
  const hits=tapRay.intersectObjects(objs,true);
  for(const h of hits){ let o=h.object, pk=null; while(o){ if(o.userData&&o.userData.pick){ pk=o.userData.pick; break; } o=o.parent; }
    if(!pk&&h.object.parent===props.userData.stairs) pk={k:'board'};
    if(!pk) continue;
    if(pk.k==='item'&&pk.o.taken) continue;
    const wp=new THREE.Vector3(); (o||h.object).getWorldPosition(wp);
    if(pk.k==='clue'){ wp.set(pk.o.x,0,pk.o.z); } if(pk.k==='special'&&pk.o.at){ wp.set(pk.o.at[0],0,pk.o.at[1]); } if(pk.k==='board'){ wp.set(-32.2,0,6.8); }

}

const MUS={cur:null,next:null,step:0,bar:0,loop:0,nt:0,bus:null,flt:null,timer:null,jingleUntil:0,noise:null};

function musStep(T,t){

function itemVox(id){
  const L=[]; const add=(x,y,z,c)=>L.push([x,y,z,c]);
  const box=(x0,y0,z0,x1,y1,z1,c)=>{ for(let x=x0;x<x1;x++)for(let y=y0;y<y1;y++)for(let z=z0;z<z1;z++) add(x,y,z,typeof c==='function'?c(x,y,z):c); };
  const sphere=(cx,cy,cz,r,c)=>{ for(let x=-r;x<=r;x++)for(let y=-r;y<=r;y++)for(let z=-r;z<=r;z++) if(x*x+y*y+z*z<=r*r+0.6) add(cx+x,cy+y,cz+z,typeof c==='function'?c(x,y,z):c); };
  const bone=(c,d)=>{ box(-4,0,0,5,2,2,c); for(const ex of [-6,5]) for(const ey of [-1,2]) box(ex,ey,0,ex+2,ey+1,2,c); box(-6,0,0,-4,2,2,c); box(5,0,0,7,2,2,c); if(d) for(const ex of [-6,5]) add(ex,2,1,d); };
  switch(id){
    case 'bone': bone('#f1eadb','#d9cfb8'); break;
    case 'gold': bone('#ffd23f','#ffe98a'); break;
    case 'ball': sphere(0,0,0,3,(x,y,z)=>Math.abs(x-Math.sin(y*0.8)*1.8)<0.75&&Math.abs(z)>=1?'#f6f6ee':'#cfe23a'); break;
    case 'cap': for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)for(let y=0;y<=3;y++) if(x*x+z*z+y*y*1.6<=11) add(x,y,z,y===0&&z>=2?'#b83030':'#e04848');
      box(-2,0,3,3,1,7,'#c23a3a'); add(0,4,0,'#ffffff'); break;
    case 'key': for(let x=0;x<5;x++)for(let y=0;y<5;y++) if(x===0||x===4||y===0||y===4) add(x,y,0,'#f2c94c'); box(5,2,0,12,3,1,'#f2c94c'); box(9,0,0,10,2,1,'#e0b43a'); box(11,0,0,12,2,1,'#e0b43a'); break;
    case 'oldkey': for(let x=0;x<6;x++)for(let y=0;y<6;y++) if(x===0||x===5||y===0||y===5||(x===2&&y===2)||(x===3&&y===3)) add(x,y,0,'#8a6a3a'); box(6,2,0,15,4,1,'#7a5a2e'); box(11,-1,0,12,2,1,'#6b4d26'); box(13,-1,0,15,2,1,'#6b4d26'); add(2,3,0,'#c9a25a'); break;
    case 'slipper': box(0,0,0,4,1,9,'#4aa3df'); box(0,1,4,4,3,6,'#2f7fd8'); box(0,1,5,1,2,6,'#2f7fd8'); box(1,0,0,3,1,1,'#3a8fca'); break;
    case 'frisbee': for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){ const r=x*x+z*z; if(r<=17) add(x,0,z,'#ff7a1a'); if(r>=11&&r<=17) add(x,1,z,'#e05e0a'); } add(0,1,0,'#ffb02e'); break;
    case 'fish': for(let x=-4;x<=4;x++)for(let y=-2;y<=2;y++) if((x*x)/20+(y*y)/5<=1) for(let z=0;z<2;z++) add(x,y,z,y<0?'#dfe8f2':'#7fb2e5');
      for(const [x,y] of [[5,-2],[5,-1],[5,0],[5,1],[5,2],[6,-2],[6,2]]) for(let z=0;z<2;z++) add(x,y,z,'#5a8fcf'); add(-3,1,2,'#1a1a1a'); add(-3,1,-1,'#1a1a1a'); break;
    case 'toy': box(0,0,0,1,9,1,'#8a5a2b'); sphere(0,10,0,2,(x,y,z)=>(x+y+z)%2?'#f2e27a':'#e8d45a'); add(1,12,0,'#f8f0a8'); add(-1,12,1,'#f8f0a8'); break;
    case 'treatbag': for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)for(let y=0;y<6;y++){ const r=3.4-Math.max(0,y-3)*0.9; if(x*x+z*z<=r*r) add(x,y,z,y===3?'#e04848':'#a8743c'); }
      box(-1,6,-1,2,8,2,'#8a5a2b'); box(-1,2,3,2,3,4,'#f1eadb'); add(-2,2,3,'#f1eadb'); add(2,2,3,'#f1eadb'); break;
    case 'clock': for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++) if(x*x+y*y<=10) for(let z=0;z<2;z++) add(x,y,z,z===1&&x*x+y*y<=6?'#f6f3ea':'#d8452f');
      add(0,0,2,'#222'); add(0,1,2,'#222'); add(0,2,2,'#222'); add(1,0,2,'#222'); for(const sx of [-3,3]) box(sx-1,3,0,sx+1,5,2,'#f2c94c'); box(-3,-5,0,-2,-3,1,'#555'); box(2,-5,0,3,-3,1,'#555'); break;
    default: sphere(0,0,0,2,'#cccccc');
  }
  // 中心に寄せる
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9]; for(const v of L) for(let i=0;i<3;i++){ mn[i]=Math.min(mn[i],v[i]); mx[i]=Math.max(mx[i],v[i]+1); }
  const c=[0,1,2].map(i=>(mn[i]+mx[i])/2), size=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);
  return {L:L.map(v=>[v[0]-c[0],v[1]-c[1],v[2]-c[2],v[3]]),size};
}

      if(L<0.2) d.path.shift(); else { pos.addScaledVector(dv.normalize(),Math.min(L,6*dt)); m=L>4||d.path.length>1?'run':'walk'; d.face=Math.atan2(dv.x,dv.z); } }

  if(G.me&&G.me.holder.visible){ animateHuman(G.me.rig,'wave',time); applyRig(G.me.rig,k); }

  for(const k in SECRET){ const S=SECRET[k]; if(S.open&&S.mesh.visible){ S.mesh.position.y-=dt*1.5; if(S.mesh.position.y<-4.2) S.mesh.visible=false; } }
  updateRebuildAnim(dt);
  if(G.phase==='rebuild'){ tickRebuild(dt); updatePlayer(dt); tgtT+=dt; if(tgtT>0.12){ tgtT=0; findTarget(); } mmT+=dt; if(mmT>0.1){ mmT=0; drawMinimap(); } sunFollow(camera.position); }
  else if(MEGA.on){ updateMega(dt); sunFollow(camTarget); }
  else if(G.phase==='play'){ tickPlay(dt); updatePlayer(dt); tgtT+=dt; if(tgtT>0.12){ tgtT=0; findTarget(); } mmT+=dt; if(mmT>0.1){ mmT=0; drawMinimap(); } sunFollow(camera.position); }
  else if(COL.on){ updateCollapse(dt); sunFollow(camTarget); }
  else if(G.plane){ updatePlane(dt); sunFollow(camTarget); }
  else if(camGoal){ camTarget.lerp(camGoal.t,1-Math.exp(-dt*3)); camera.position.lerp(camGoal.t.clone().addScaledVector(camOff,camGoal.d),1-Math.exp(-dt*2.5)); camera.lookAt(camTarget); sunFollow(camTarget); }
  else if(G.phase==='title'){ const a=time*0.08; camera.position.set(-20+Math.cos(a)*45,22,10+Math.sin(a)*45); camTarget.set(-20,6,10); camera.lookAt(camTarget); sunFollow(camTarget);
    const b=time*0.35; plane.visible=true; plane.position.set(-20+Math.cos(b)*38,16+Math.sin(b*2)*2,10+Math.sin(b)*38); plane.rotation.set(-0.35,-(b+Math.PI/2),0.05,'YZX'); }
  updateFx(dt); updateWeather(dt,camera.position);
  if(shake>0){ shake=Math.max(0,shake-dt*1.5); camera.position.x+=rnd(-1,1)*shake*0.4; camera.position.y+=rnd(-1,1)*shake*0.4; }
  renderer.render(scene,camera);
  if(G.snapReq){ G.snapReq=false; try{ G.snap=canvas.toDataURL('image/jpeg',0.72); }catch(e){ G.snap=null; } }
}
buildDefaultMap(); buildProps(); buildSecretDoors(); setWeather('clear'); applyCfg();
{ const saved=LS.get('map',null); if(saved) applyCustomMap(saved); }
titleScreen(); loop();

</script>
