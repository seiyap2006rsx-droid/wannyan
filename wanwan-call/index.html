html,body{margin:0;height:100%;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:#eef3f8;color:#2f3440}
#app{display:flex;flex-direction:column;height:100%}
#stage{position:relative;height:44vh;min-height:260px;flex:none;background:#dfe9f2}
#c{display:block;width:100%;height:100%}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.qd{background:rgba(255,255,255,.88);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;min-width:120px}
.qd .pb{height:5px;background:#e3e7ee;border-radius:3px;margin-top:3px;overflow:hidden}
.qd .pb i{display:block;height:100%;background:#5cc48a}
#caption{position:absolute;right:8px;bottom:8px;background:rgba(40,46,60,.85);color:#fff;border-radius:10px;padding:4px 9px;font-size:12px;font-weight:700}
#panel{flex:1;overflow-y:auto;padding:12px 12px 30px;background:#fbfcfe;border-top:1px solid #dfe5ee}
h1{font-size:22px;margin:4px 0 6px}
.lead{font-size:13px;color:#6a7385;line-height:1.6;margin:0 0 12px}
.big{display:block;width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-size:17px;font-weight:800;color:#fff;background:#ff8a3d;box-shadow:0 4px 0 #d86a22;margin:8px 0}
.big.sub{background:#e8edf5;color:#3b4456;box-shadow:0 4px 0 #c9d2e0}
.big.green{background:#3fbf7f;box-shadow:0 4px 0 #2a9a62}
.ring{animation:ring .5s infinite alternate}
@keyframes ring{from{transform:rotate(-2deg)}to{transform:rotate(2deg) scale(1.02)}}
.incoming{background:#fff;border:2px solid #ffd2b3;border-radius:18px;padding:14px;text-align:center}
.incoming .ic{font-size:40px}
.incoming b{font-size:18px}
.callhead{display:flex;align-items:center;gap:8px;font-size:15px}
.callhead b{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:#6a7385}
.emo{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.emo .face{font-size:24px}
.emo .bar{flex:1;height:12px;background:#e6eaf1;border-radius:6px;overflow:hidden}
.emo .bar i{display:block;height:100%;width:40%;background:#f0b13e;transition:width .6s,background .6s}
.emo .num{font-size:12px;font-weight:800;color:#6a7385;width:58px;text-align:right}
#log{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.55}
.bub.dog{align-self:flex-start;background:#fff4e6;border:1.5px solid #ffd9ad;border-bottom-left-radius:4px}
.bub.op{align-self:flex-end;background:#e3f0ff;border:1.5px solid #bcd9ff;border-bottom-right-radius:4px}
.bub.sys{align-self:center;background:#eef1f6;color:#6a7385;font-size:12px;border-radius:999px;padding:5px 12px}
.bub .nm{font-size:11px;font-weight:800;color:#b07a3a;margin-bottom:2px}
.bub .bark{font-size:12px;color:#a08868;font-style:italic}
.hint{font-size:12px;color:#5b7bb5;background:#eef4ff;border-radius:10px;padding:6px 10px;margin:10px 0 0}
#acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;font-weight:700;text-align:left;background:#fff;border:1.5px solid #d6deea;color:#2f3440}
.act.tool{background:#fff7ef;border-color:#ffd2b3}
.acts-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#modal.on{display:flex}
.mcard{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.mcard h2{font-size:18px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{border:1.5px solid #d6deea;background:#fff;border-radius:14px;padding:10px 4px;font:inherit;font-size:12px;font-weight:700;text-align:center}

.stamp{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stamp div{font-size:9px;text-align:center;border-radius:8px;padding:6px 2px;background:#f1f3f7;color:#a0a8b8;min-height:40px;display:flex;align-items:center;justify-content:center}

  #panel{flex:none;width:420px;border-top:0;border-left:1px solid #dfe5ee}

  #modal{align-items:center}

function hash3(x,y,z,s){ const h=Math.sin(x*127.1+y*311.7+z*74.7+s*19.31)*43758.5453; return h-Math.floor(h); }
function shade(hex,a){ const c=new THREE.Color(hex); const t=a<0?new THREE.Color(0,0,0):new THREE.Color(1,1,1); c.lerp(t,Math.abs(a)); return '#'+c.getHexString(); }
function track(rig,o,rx=0,ry=0,rz=0){
  o.userData.re=new THREE.Euler(rx,ry,rz,'YXZ');
  o.userData.rest=o.position.clone();
  o.userData.tp=o.position.clone();
  o.userData.tq=new THREE.Quaternion().setFromEuler(o.userData.re);
  o.quaternion.copy(o.userData.tq);
  rig.nodes.push(o); return o;
}
function rot(o,x=0,y=0,z=0){ const r=o.userData.re; _e.set(r.x+x,r.y+y,r.z+z,'YXZ'); o.userData.tq.setFromEuler(_e); }
function pos(o,dx=0,dy=0,dz=0){ o.userData.tp.copy(o.userData.rest); o.userData.tp.x+=dx; o.userData.tp.y+=dy; o.userData.tp.z+=dz; }
function resetRig(rig){ for(const o of rig.nodes){ rot(o); o.userData.tp.copy(o.userData.rest); } }
function applyRig(rig,k){ for(const o of rig.nodes){ o.quaternion.slerp(o.userData.tq,k); o.position.lerp(o.userData.tp,k); } }
function snapRig(rig){ for(const o of rig.nodes){ o.quaternion.copy(o.userData.tq); o.position.copy(o.userData.tp); } }
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); if(n.material&&n.material.map) n.material.map.dispose(); }); }

   ========================================================= */
const VMAT = new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0});
const _col = new THREE.Color();
function voxGeo(list){
  const key=(x,y,z)=>x+','+y+','+z;
  const set=new Set(list.map(v=>key(v[0],v[1],v[2])));
  const P=[],N=[],C=[],I=[];
  for(const [x,y,z,hex] of list){
    _col.set(hex);
    for(let a=0;a<3;a++) for(const s of [1,-1]){
      const d=[0,0,0]; d[a]=s;
      if(set.has(key(x+d[0],y+d[1],z+d[2]))) continue;
      const b=(a+1)%3, c=(a+2)%3, base=[x,y,z];
      const quad=[[0,0],[1,0],[1,1],[0,1]];
      const order=s>0?[0,1,2,3]:[0,3,2,1];
      const vi=P.length/3;
      for(const qi of order){
        const p=base.slice(); p[a]+= s>0?1:0; p[b]+=quad[qi][0]; p[c]+=quad[qi][1];
        P.push(p[0],p[1],p[2]); N.push(d[0],d[1],d[2]); C.push(_col.r,_col.g,_col.b);
      }
      I.push(vi,vi+1,vi+2,vi,vi+2,vi+3);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeBoundingSphere();
  return g;
}
function vbox(sx,sy,sz,ox,oy,oz,fn){ const L=[]; for(let x=0;x<sx;x++)for(let y=0;y<sy;y++)for(let z=0;z<sz;z++){ const c=fn(x,y,z); if(c) L.push([ox+x,oy+y,oz+z,c]); } return L; }
function vmesh(list){ const m=new THREE.Mesh(voxGeo(list),VMAT); m.castShadow=true; m.receiveShadow=true; return m; }
const matCache={};
function mat(hex,opt){ const k=hex+(opt?JSON.stringify(opt):''); if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:hex,roughness:0.62,metalness:0},opt||{})); return matCache[k]; }
function cube(w,h,d,hex){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(hex,{roughness:0.8})); m.castShadow=true; return m; }

/* ---------- 色の決め方 ---------- */
function bodyColor(P,x,y,z){
  const {bw,bh,bl,c1,c2,c3}=P, front=z===bl-1, bottom=y===0, side=(x===0||x===bw-1);
  switch(P.pat){
    case 'bicolor': if(bottom||(front&&y<bh-1)||(z>=bl-2&&y<=1)) return c2; return c1;
    case 'tricolor':
      if(bottom||(z>=bl-2&&y<bh-1)) return c2;
      if(y>=bh-2&&z>=1&&z<=bl-3&&!(y===bh-2&&(z===1||z===bl-3))) return c3;
      if(y===bh-3&&z>=2&&z<=bl-4&&side) return c3;
      return c1;
    case 'spots': return hash3(x,y,z,P.seed)<0.2?c3:c1;
    case 'husky': if(front&&y<bh-1) return c2; return y>=bh/2?c1:c2;
    case 'saddle':
      if(y>=bh-2&&z>0&&z<bl-1) return c3;
      if(y===bh-3&&z>=1&&z<=bl-3&&side) return c3; return c1;
    case 'tuxedo': if((front&&y<bh-1)||(bottom&&z>=bl/2)) return c2; return c1;
    case 'points': if(front&&y<=1&&!side) return c2; return c1;
    case 'brindle': return (((z*2+y+(x%2))%4===0)&&hash3(x,y,z,P.seed)>0.25)?c3:c1;
    case 'patches': return (y>0&&hash3(Math.floor(x/2),Math.floor(y/2),Math.floor(z/2.5),P.seed)<0.35)?c3:c1;
    case 'patch1': return (y>=bh-2&&z<=2)?c3:c1;
  }
  return c1;
}
function headColor(P,x,y,z,eyeRow,ex){
  const {hw,hh,hd,sh,c1,c2,c3}=P, base=P.headC||c1;
  const front=z===hd-1, top=y===hh-1, cx=x-hw/2+0.5;
  const center=Math.abs(cx)<(hw%2?0.6:1.1);
  const eyeCol=Math.abs(Math.abs(cx)-ex)<0.6;
  if(P.brow&&front&&y===eyeRow+1&&eyeCol) return P.brow;
  switch(P.head){
    case 'blaze': if(center&&((front&&y>=sh)||(top&&z>=hd-3))) return c2; return base;
    case 'cheeks': if(y<sh&&(front||z>=hd-3)) return c2; return base;
    case 'mask':
      if(top) return c1;
      if(front){ if(y>eyeRow+1) return c1; if(center&&y>=eyeRow) return c1; return c2; }
      return y<=sh?c2:c1;
    case 'spots': return (!front&&hash3(x,y,z,P.seed+5)<0.16)?c3:base;
    case 'halfface': if(center&&(front||top)) return base; if(y>=sh) return c3; return base;
  }
  return base;
}
function legColor(P,front,y,li,z){
  const base=front?(P.frontLegC||P.legC||P.c1):(P.legC||P.c1);
  if(P.socks&&y<P.socks) return P.sockC||P.c2;
  if(P.pat==='spots'&&hash3(li*5,y,z,P.seed+1)<0.2) return P.c3;
  if(P.pat==='patches'&&y>=P.L-1&&hash3(li,1,1,P.seed)<0.3) return P.c3;
  return base;
}

/* ---------- 犬の組み立て ---------- */
function buildDog(P0){
  const P=Object.assign({},DOGDEF,P0);
  if(P.sh<2) P.sh=2;
  const {bw,bh,bl,L,lw,hw,hh,hd,sw,sh,sl}=P;
  const rig={type:'dog',P,nodes:[],ears:[],legs:{},eyes:[]};
  const root=new THREE.Group(); rig.root=root;
  const mover=track(rig,new THREE.Group()); root.add(mover); rig.mover=mover;
  const hipZ=-bl/2+lw/2;
  const bodyG=new THREE.Group(); bodyG.position.set(0,L,hipZ); mover.add(bodyG); track(rig,bodyG); rig.bodyG=bodyG;
  const inner=new THREE.Group(); inner.position.set(0,-L,-hipZ); bodyG.add(inner);
  // 胴体
  inner.add(vmesh(vbox(bw,bh,bl,-bw/2,L,-bl/2,(x,y,z)=>bodyColor(P,x,y,z))));
  if(P.ruff) inner.add(vmesh(vbox(bw+2,bh,2,-(bw+2)/2,L+1,bl/2-1.5,()=>P.ruff)));
  // 脚
  const legX=Math.max(bw/2-lw/2,lw/2), fz=bl/2-lw/2;
  [['FL',legX,fz,true],['FR',-legX,fz,true],['RL',legX,hipZ,false],['RR',-legX,hipZ,false]].forEach(([n,x,z,front],li)=>{
    const piv=new THREE.Group(); piv.position.set(x,L,z); inner.add(piv); track(rig,piv);
    const m=vmesh(vbox(lw,L+1,lw,-lw/2,-L,-lw/2,(xx,yy,zz)=>legColor(P,front,yy,li,zz)));
    m.scale.set(0.97,1,0.97); piv.add(m); rig.legs[n]=piv;
  });
  // 頭
  const head=new THREE.Group(); head.position.set(0,L+bh-1,bl/2-1); inner.add(head); track(rig,head); rig.head=head;
  const eyeY=Math.min(sh+1.5,hh-1.5), eyeRow=Math.floor(eyeY), ex=Math.max(1,hw/2-1.5);
  const hm=vmesh(vbox(hw,hh,hd,-hw/2,0,-1,(x,y,z)=>headColor(P,x,y,z,eyeRow,ex))); hm.scale.setScalar(1.004); head.add(hm);
  const sz0=hd-1;
  const sc=P.snoutC||(['blaze','cheeks','mask','halfface'].includes(P.head)?P.c2:(P.headC||P.c1));
  const muzzle=P.beard||sc;
  head.add(vmesh(vbox(sw,sh-1,sl,-sw/2,1,sz0,()=>muzzle)));
  const jaw=new THREE.Group(); jaw.position.set(0,1,sz0); head.add(jaw); track(rig,jaw); rig.jaw=jaw;
  const bd=P.beard?1:0;
  jaw.add(vmesh(vbox(sw,1+bd,sl,-sw/2,-1-bd,0,()=>muzzle)));
  const tongue=cube(Math.max(1,sw-1.4),0.2,sl*0.8,'#ee7d8c'); tongue.position.set(0,0.1,sl*0.45); jaw.add(tongue);
  if(P.tongue){ const tg=cube(1,1.2,0.3,'#ee7d8c'); tg.position.set(0.2,-0.5,sl+0.1); jaw.add(tg); }
  const nw=sw>=4?2:1, nose=cube(nw,1,1,P.nose); nose.position.set(0,sh-0.45,sz0+sl-0.3); head.add(nose);
  for(const s of [1,-1]){
    const eg=new THREE.Group(); eg.position.set(s*ex,eyeY,sz0+0.12); head.add(eg); rig.eyes.push(eg);
    const e=cube(P.eS,P.eS,0.3,P.eye); eg.add(e);
    const hl=cube(0.34*P.eS,0.34*P.eS,0.1,'#ffffff'); hl.position.set(0.2*P.eS,0.2*P.eS,0.17); eg.add(hl);
  }
  // 耳
  const earC=P.earC||P.headC||P.c1, inC=shade(earC,0.35);
  for(const s of [1,-1]){
    const piv=new THREE.Group(); let list=[], re=[0,0,0];
    if(P.ear==='flop'){
      piv.position.set(s*hw/2,hh-0.5,(hd-2)/2-0.5);
      list=vbox(P.eW,P.eL,P.eD,s>0?0:-P.eW,-P.eL+0.5,-P.eD/2,()=>earC);
    } else if(P.ear==='fold'){
      piv.position.set(s*(hw/2-0.6),hh,hd/2-1.5);
      list=vbox(2,1,2,-1,0,-1,()=>earC).concat(vbox(2,1,1,-1,-0.6,1,()=>earC));
    } else { // prick / bat / butterfly
      const w=P.eW,h=P.eL;
      piv.position.set(s*(hw/2-w),hh,(hd-2)/2-1);
      for(let r=0;r<h;r++){ const width=Math.max(1,w-Math.floor(r*w/h));
        for(let i=0;i<w;i++){ const keep=s>0?i>=w-width:i<width; if(!keep) continue;
          const xx=s>0?i:-w+i;
          list.push([xx,r,-1,earC]);
          const inner=(r<h-1&&width>1&&(s>0?i>w-width:i<width-1))||(w===1&&r<h-1&&h>2);
          list.push([xx,r,0,inner?inC:earC]);
        }}
      if(P.ear==='bat') re=[0,0,-s*0.3];
      if(P.ear==='butterfly') re=[0,0,-s*0.6];
    }
    piv.add(vmesh(list)); head.add(piv); track(rig,piv,...re); piv.userData.s=s; rig.ears.push(piv);
  }
  if(P.topknot){
    head.add(vmesh(vbox(3,1,3,-1.5,hh,hd/2-2.5,()=>P.headC||P.c1)));
    if(P.bow){ const b=cube(2.2,0.9,0.9,P.bow); b.position.set(0,hh+1.3,hd/2-1); head.add(b); const k=cube(0.7,0.7,1,shade(P.bow,-0.2)); k.position.copy(b.position); head.add(k); }
  }
  // 首輪
  const collar=cube(hw+0.25,0.8,hd+0.25,'#e04848'); collar.position.set(0,0.35,hd/2-1); head.add(collar);
  const tag=cube(0.7,0.7,0.2,'#f2c94c'); tag.position.set(0,-0.3,hd-0.8); collar.add(tag);
  rig.collar=collar;
  // しっぽ
  const tail=new THREE.Group(); tail.position.set(0,L+bh-1,-bl/2+0.5); inner.add(tail);
  const tc=P.tailC||P.c1, tip=P.tailTip;
  let pts=[], w=P.tW, rx=-0.3;
  const chain=n=>{ for(let i=0;i<n;i++) pts.push([0,i,0]); };
  switch(P.tail){
    case 'up': chain(P.tl); rx=-0.3; break;
    case 'stub': chain(Math.max(1,P.tl)); rx=-0.6; break;
    case 'curl': pts=[[0,0,0],[0,1,0],[0,2,0],[0,3,1],[0,3,2],[0,2,3]]; rx=0; break;
    case 'fluffy': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,2,1],[0,2,2],[0,2,3],[0,1,3]]; rx=-0.1; break;
    case 'feather': case 'down': chain(P.tl); rx=-2.25; break;
    case 'whip': w=1; chain(P.tl); rx=-2.5; break;
    case 'pom': w=1; chain(P.tl); rx=-0.45; break;
    case 'pugcurl': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,1,1]]; rx=0.2; break;
  }
  const tv=[], seen=new Set();
  pts.forEach((p,pi)=>{ for(let a=0;a<w;a++)for(let b=0;b<w;b++)for(let c=0;c<w;c++){
    const v=[p[0]-w/2+a,p[1]+b,p[2]-w/2+c];
    const k=v.join(','); if(seen.has(k)) continue; seen.add(k);
    tv.push([v[0],v[1],v[2],(tip&&pi===pts.length-1)?tip:tc]); } });
  if(P.tail==='pom') for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++) tv.push([-1+a,P.tl+b,-1+c,tc]);
  tail.add(vmesh(tv)); track(rig,tail,rx,0,0); rig.tail=tail;
  // 電話（小道具）
  const phone=new THREE.Group();
  const pb=cube(1.3,2.2,0.35,'#2f3440'); phone.add(pb);
  const scr=cube(1.05,1.8,0.06,'#8fd4ff'); scr.position.z=-0.2; phone.add(scr);
  phone.position.set(0.3,-L+0.6,lw/2+0.4); phone.visible=false;
  rig.legs.FR.add(phone); rig.phone=phone;
  // サイズ情報
  rig.height=(L+bh+hh)*VOX; rig.withers=(L+bh)*VOX; rig.len=(bl+hd+sl)*VOX;
  resetRig(rig); snapRig(rig);
  return rig;
}

/* ---------- 犬のモーション ---------- */
const DOG_MOTIONS=[['idle','待機'],['walk','歩く'],['run','走る'],['sit','おすわり'],['down','伏せ'],['sleep','寝る'],['jump','ジャンプ'],['happy','喜ぶ'],['bark','吠える'],['shake','ブルブル'],['dig','穴掘り'],['sad','しょんぼり'],['beg','おねだり'],['phone','電話'],['paw','お手'],['spin','くるくる'],['sniff','クンクン']];
function dogWag(R,amt){ rot(R.tail,0,0,amt); }
function dogEars(R,amt,back=0){ for(const e of R.ears){ if(R.P.ear==='flop') rot(e,back,0,e.userData.s*amt); else rot(e,-amt*0.6-back,0,0); } }
function sitPose(R){
  const P=R.P, D=P.bl-P.lw, L=P.L;
  const a=Math.min(1.0,Math.max(0.12,Math.asin(Math.max(-0.99,Math.min(0.99,(L-0.3)/D)))));
  const hipY=Math.max(0.2,L-D*Math.sin(a));
  const beta=Math.acos(Math.min(1,hipY/L));
  return {a,hipY,beta};
}
function animateDog(R,m,t){
  resetRig(R);
  const P=R.P, Lg=R.legs, s=Math.sin;
  let blink=((t+P.seed)%3.7)<0.13, eyeS=1;
  R.phone.visible=false;
  switch(m){
    case 'idle':
      pos(R.bodyG,0,s(t*2.2)*0.12,0); dogWag(R,s(t*5)*0.35); rot(R.head,s(t*0.7)*0.06,s(t*0.5)*0.15,0); dogEars(R,0.05+s(t*1.3)*0.04); break;
    case 'walk': { const ph=t*7;
      rot(Lg.FL,s(ph)*0.5); rot(Lg.RR,s(ph)*0.5); rot(Lg.FR,-s(ph)*0.5); rot(Lg.RL,-s(ph)*0.5);
      pos(R.bodyG,0,Math.abs(s(ph))*0.25,0); rot(R.head,s(ph*2)*0.04); dogWag(R,s(t*7)*0.4); dogEars(R,0.1+Math.abs(s(ph))*0.1); break; }
    case 'run': { const ph=t*13;
      rot(Lg.FL,s(ph)*0.95); rot(Lg.FR,s(ph+0.35)*0.95); rot(Lg.RL,s(ph+Math.PI)*0.95); rot(Lg.RR,s(ph+Math.PI+0.35)*0.95);
      rot(R.bodyG,s(ph)*0.12); pos(R.mover,0,Math.abs(s(ph))*1.2,0); rot(R.tail,-0.6,0,s(ph)*0.2); rot(R.head,-s(ph)*0.1+0.1);
      dogEars(R,0.5+s(ph)*0.3,0.4); break; }
    case 'sit': case 'phone': case 'paw': { const S=sitPose(R);
      rot(R.bodyG,-S.a); pos(R.bodyG,0,S.hipY-P.L,0);
      rot(Lg.FL,S.a); rot(Lg.FR,S.a); rot(Lg.RL,-S.beta+S.a,0,0.15); rot(Lg.RR,-S.beta+S.a,0,-0.15);
      rot(R.head,S.a*0.85+s(t*0.8)*0.04); rot(R.tail,-0.9,0,s(t*5)*0.4); dogEars(R,0.06);
      if(m==='phone'){ rot(Lg.FR,S.a-2.55,0,-0.35); rot(R.head,S.a*0.85+0.05,0.15,0.28); R.phone.visible=true;
        rot(R.jaw,Math.max(0,s(t*11))*0.28*(s(t*1.7)>-0.3?1:0)); dogEars(R,-0.08,0); }
      if(m==='paw'){ rot(Lg.FR,S.a-1.35+s(t*4)*0.1,0,0); rot(R.head,S.a*0.85,0,s(t*2)*0.2); rot(R.tail,-0.9,0,s(t*12)*0.5); }
      break; }
    case 'down': case 'sleep': {

/* ---------- 顔テクスチャ ---------- */
const FACE_W=256;
function drawFace(cv,H,closed){
  const g=cv.getContext('2d'); g.clearRect(0,0,FACE_W,FACE_W);
  const ink='#3a2620', ex=47, ey=104;
  g.lineCap='round'; g.lineJoin='round';
  const ell=(x,y,rx,ry,fill)=>{ g.fillStyle=fill; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); };
  if(H.blush) for(const s of [-1,1]) ell(128+s*74,142,21,11,'rgba(255,110,130,0.38)');
  // 眉
  if(H.brows!=='none'){ g.strokeStyle=shade(H.hairC,-0.35); g.lineWidth=6;
    for(const s of [-1,1]){ const x=128+s*ex; let yi=64,yo=60;
      if(H.brows==='worried'){yi=53;yo=64;} if(H.brows==='angry'){yi=68;yo=53;}
      g.beginPath(); g.moveTo(x-s*15,yi); g.quadraticCurveTo(x,Math.min(yi,yo)-4,x+s*15,yo); g.stroke(); } }
  // 目
  const eye=(x,rx,ry,dy=0)=>{ const y=ey+dy;
    ell(x,y,rx,ry,'#2a1c15'); ell(x,y+ry*0.22,rx*0.8,ry*0.68,H.eyeC); ell(x,y+ry*0.3,rx*0.4,ry*0.36,shade(H.eyeC,-0.5));
    ell(x-rx*0.3,y-ry*0.36,rx*0.38,ry*0.3,'#fff'); ell(x+rx*0.38,y+ry*0.46,rx*0.17,rx*0.17,'#fff');
    g.strokeStyle='#2a1c15'; g.lineWidth=5; g.beginPath(); g.ellipse(x,y,rx+1.5,ry+1.5,0,Math.PI*1.12,Math.PI*1.88); g.stroke(); };
  for(const s of [-1,1]){
    const x=128+s*ex;
    let t=closed?'blink':H.eyes; if(H.eyes==='wink'&&s===1) t='smile'; else if(H.eyes==='wink') t=closed?'blink':'round';
    g.strokeStyle=ink; g.lineWidth=6;
    if(t==='blink'){ g.beginPath(); g.moveTo(x-15,ey+5); g.quadraticCurveTo(x,ey+13,x+15,ey+5); g.stroke(); }
    else if(t==='smile'){ g.beginPath(); g.arc(x,ey+12,15,Math.PI*1.15,Math.PI*1.85); g.stroke(); }
    else if(t==='round') eye(x,17,26);
    else if(t==='sparkle'){ eye(x,18,27); g.fillStyle='#fff'; const sx=x+6,sy=ey+2; g.beginPath(); g.moveTo(sx,sy-8); g.lineTo(sx+2.5,sy-2.5); g.lineTo(sx+8,sy); g.lineTo(sx+2.5,sy+2.5); g.lineTo(sx,sy+8); g.lineTo(sx-2.5,sy+2.5); g.lineTo(sx-8,sy); g.lineTo(sx-2.5,sy-2.5); g.closePath(); g.fill(); }
    else if(t==='sharp'){ eye(x,16,21,4); g.strokeStyle='#2a1c15'; g.lineWidth=7; g.beginPath(); g.moveTo(x-s*19,ey-10); g.lineTo(x+s*19,ey-20); g.stroke(); }
    else if(t==='sleepy'){ g.save(); g.beginPath(); g.rect(x-30,ey-4,60,50); g.clip(); eye(x,17,24); g.restore(); g.strokeStyle='#2a1c15'; g.lineWidth=6; g.beginPath(); g.moveTo(x-19,ey-3); g.quadraticCurveTo(x,ey-9,x+19,ey-3); g.stroke(); }
    else if(t==='dot'){ ell(x,ey+4,8,10,'#2a1c15'); ell(x-3,ey,3,3,'#fff'); }
  }
  // 口
  g.strokeStyle=ink; g.lineWidth=5; const my=168;
  switch(H.mouth){
    case 'smile': g.beginPath(); g.arc(128,my-10,13,Math.PI*0.2,Math.PI*0.8); g.stroke(); break;
    case 'grin': g.fillStyle='#7a2d2d'; g.beginPath(); g.moveTo(110,my-2); g.quadraticCurveTo(128,my+30,146,my-2); g.closePath(); g.fill(); ell(128,my+12,9,5.5,'#f08a8a'); g.stroke(); break;
    case 'fang': g.beginPath(); g.arc(128,my-10,13,Math.PI*0.2,Math.PI*0.8); g.stroke(); g.fillStyle='#fff'; g.beginPath(); g.moveTo(132,my+1); g.lineTo(140,my-1); g.lineTo(137,my+8); g.closePath(); g.fill(); break;
    case 'cat': g.beginPath(); g.arc(121,my-2,7,0,Math.PI); g.stroke(); g.beginPath(); g.arc(135,my-2,7,0,Math.PI); g.stroke(); break;
    case 'o': ell(128,my+2,7,9,'#7a2d2d'); break;
    case 'flat': g.beginPath(); g.moveTo(117,my); g.lineTo(139,my); g.stroke(); break;
  }
}

const DOWN=new THREE.Vector3(0,-1,0);
function ik(rig,side,target,pole){
  const sh=side<0?rig.shR:rig.shL, el=side<0?rig.elR:rig.elL, D=rig.dims;
  const S=sh.userData.rest, a=D.upper, b=D.fore+D.handR*0.55;

  const perp=P.sub(dir.clone().multiplyScalar(P.dot(dir))).normalize();
  const e1=dir.clone().multiplyScalar(cosA).add(perp.multiplyScalar(Math.sin(A))).normalize();
  const E=S.clone().add(e1.clone().multiplyScalar(a)), T2=S.clone().add(dir.clone().multiplyScalar(dist));

  const e2l=e2.applyQuaternion(qU.clone().invert());
  sh.userData.tq.copy(qU); el.userData.tq.setFromUnitVectors(DOWN,e2l);
}

  const d=Math.max(2.9,3.3/camera.aspect); camera.position.set(0.0,1.05,d); camera.lookAt(0.02,0.82,0); }

let AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='triangle',g=0.04,when=0){ if(muted||!AC) return; const t=AC.currentTime+when; const o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t+d+0.03); }
function blip(p){ tone(p*(0.85+Math.random()*0.45),0.06,'triangle',0.05); }
function rumble(){ if(muted||!AC) return; const n=AC.sampleRate*1.4, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180; const g=AC.createGain(); g.gain.value=0.6; s.connect(f).connect(g).connect(AC.destination); s.start(); }
let ringIv=null;
function ringStart(){ ringStop(); const r=()=>{ for(let k=0;k<2;k++){ tone(1046,0.09,'square',0.025,k*0.22); tone(784,0.09,'square',0.025,k*0.22+0.1);} }; r(); ringIv=setInterval(r,1500); }
function ringStop(){ clearInterval(ringIv); ringIv=null; }
function holdMusic(sec){ const notes=[523,659,784,659,587,698,880,698,523,659,784,1046]; const step=sec/notes.length; notes.forEach((f,i)=>tone(f,step*0.9,'sine',0.05,i*step)); }
function chime(ok){ if(ok){ tone(784,0.12,'sine',0.06); tone(1046,0.18,'sine',0.06,0.12); } else { tone(330,0.18,'sawtooth',0.03); tone(262,0.25,'sawtooth',0.03,0.15); } }

function thankCall(k){ return {breed:k.bi,name:k.name,room:'home',emo:70,topic:'お礼の電話',random:1,thanks:1,steps:[{say:['ワンワン♪',`「${k.topic}」のときはありがとうワン！お礼を持ってきたワン！`],motion:'happy',

function makeRandomCall(){
  if(G.endless&&Math.random()<0.2){ const cand=G.karte.filter(k=>k.st>=4&&!k.thanked); if(cand.length){ const k=pick(cand); k.thanked=1; return thankCall(k); } }
  const name=pick(NAMES);
  if(G.rep>=70&&Math.random()<0.15) return Object.assign({breed:pick([23,43,24,33]),name,room:'home',emo:5,random:1},BOSS_T);
  const t=G.night&&Math.random()<0.6?pick(NIGHT_T):pick(RANDOM_T);
  return Object.assign({breed:rnd(50),name,room:G.night?'night':'home',emo:35+rnd(15),random:1},t);
}

function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let skipTyping=false;
panel.addEventListener('click',e=>{ if(e.target.closest('#log')) skipTyping=true; });
async function typeInto(node,text,pitch,speed=34){
  skipTyping=false;
  for(let i=0;i<text.length;i++){ if(skipTyping){ node.textContent=text; break; } node.textContent=text.slice(0,i+1);
    if(pitch&&i%2===0&&!/[…、。！？\s（）]/.test(text[i])) blip(pitch); await sleep(speed); scrollDown(); }
  scrollDown();
}
function scrollDown(){ panel.scrollTop=panel.scrollHeight; }
function hud(){
  $('#clock').textContent=`${G.night?'🌙':'☀️'} Day${G.day} ${G.hour%24}:00${G.endless?'〜':''}`; $('#coins').textContent='🦴 '+G.coins;
  $('#rep').textContent='📣 '+G.rep; $('#avg').textContent='⭐ '+(G.stars.length?(G.stars.reduce((a,b)=>a+b,0)/G.stars.length).toFixed(1):'-');
}
function renderQueue(){
  const q=$('#queue'); q.innerHTML='';
  G.queue.forEach(d=>{ const e=el('div','qd',`⏳ ${BREEDS[d.breed][0]}の${d.name}<div class="pb"><i style="width:${Math.max(0,d.pat)}%;background:${d.pat<30?'#ff6b6b':d.pat<60?'#f0b13e':'#5cc48a'}"></i></div>`); q.append(e); });
}
const pitchOf=bi=>Math.max(260,Math.min(1100,560/Math.sqrt(BREEDS[bi][1].s||1)));
function modal(html){ const m=$('#modal'), c=$('#mcard'); c.innerHTML=html; m.classList.add('on'); return c; }
function closeModal(){ $('#modal').classList.remove('on'); }
function toast(t){ const d=el('div',null,t); Object.assign(d.style,{position:'fixed',left:'50%',top:'64px',transform:'translateX(-50%)',background:'#2f3440',color:'#fff',padding:'8px 14px',borderRadius:'999px',fontSize:'13px',zIndex:30,whiteSpace:'nowrap'}); document.body.append(d); setTimeout(()=>d.remove(),2200); }

function baseMotion(){ if(!C) return 'idle'; if(C.emo>=75) return 'happy'; if(C.sc.base&&C.emo<45) return C.sc.base; return C.emo<30?'sad':'idle'; }

async function startCall(sc){

async function showStep(i){
  C.step=i; const st=C.sc.steps[i]; $('#acts').innerHTML='';
  if(!C.said.has(i)){ C.said.add(i); if(st.motion) setDog(st.motion,2600); await dogSay(st.say[0],st.say[1]); }
  const h=$('#hint'); if(st.hint){ h.style.display='block'; h.textContent='💡 '+st.hint; } else h.style.display='none';
  const acts=st.actions.map((a,k)=>[a,i+':'+k]).filter(([a,key])=>!(a.once&&C.used.has(key)));
  const box=$('#acts'); const tools=el('div','acts-tools');
  acts.forEach(([a,key])=>{
    const b=el('button','act'+(a.type==='game'?' tool':''),a.type==='choice'?'💬 '+a.t:a.label);
    b.onclick=()=>doAction(a,key); (a.type==='game'?tools:box).append(b);
  });
  if(tools.children.length) box.append(tools);
  if(G.helps>0){ const hb=el('button','act helpb',`🆘 先輩に聞く（残り${G.helps}回）`); hb.onclick=()=>{ if(C.busy) return; G.helps--; bubble('sys','🧑‍💼 先輩：「'+tipFor(st)+'」'); hb.remove(); }; box.append(hb); }
  C.busy=false; scrollDown();
}
function tipFor(st){ if(st.tip) return st.tip; let best=null,bv=-1e9; st.actions.forEach(a=>{ if(a.type==='choice'&&a.r.emo>bv){ bv=a.r.emo; best=a; } });
  if(best&&bv>0) return `「${best.t}」と言ってみたら？`; const t=st.actions.find(a=>a.type==='game'); return t?`${t.label.replace(/^\S+\s/,'')}を試してみて`:'まずは気持ちに寄り添って'; }
async function doAction(a,key){
  if(C.busy) return; C.busy=true; $('#acts').innerHTML=''; $('#hint').style.display='none';
  if(a.once) C.used.add(key);
  let o;
  if(a.type==='choice'){ await opSay(a.t); o=a.r; }
  else { G.usedGames.add(a.game); const r=await GAMES[a.game](a.p||{});
    if(a.game==='dispatch'&&r==='ken'){ let best=null; for(const id of ['take','mina','yui']){ const x=a.r(id); if(!best||(x.emo||0)>(best.emo||0)) best=x; } o=Object.assign({},best,{emo:Math.round((best.emo||0)*0.8)}); }
    else o=a.r(r); }
  await playOutcome(o);
}
async function playOutcome(o){
  if(o.op) await opSay(o.op);
  if(o.gift){ bubble('sys','🎁 お礼のプレゼントが届きました（🦴+50）'); await dropItem('gift'); G.coins+=50; G.thanks++; hud(); }
  if(o.emo){ setEmo(C.emo+o.emo); bubble('sys',(o.emo>0?'💗 安心 +':'💔 安心 ')+o.emo); if(o.emo<0) C.miss=(C.miss||0)+1; }
  setDog(o.motion||baseMotion(),2800);
  if(o.say) await dogSay(o.say[0],o.say[1]);
  if(o.end) return endCall();
  showStep(o.next!=null?o.next:C.step);
}
async function endCall(){

    <div class="res">${C.sc.name}（${BREEDS[C.sc.breed][0]}）<br>安心度 ${Math.round(e)} ／ 通話時間 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}<br><b>🦴 +${coin}</b>${C.sc.boss?'（ボスボーナス込み）':''}${comboB?`<br>🔥 ${G.combo}コンボ！ +${comboB}`:''}<br>📣 評判 ${dRep>=0?'+':''}${dRep}（${G.rep}）${newStamp?'<br>🐾 新しい犬種スタンプ！':''}</div><div class="hintlist" style="margin-top:8px">💬 口コミ：「${rv}」</div>
    <button class="big" id="nx">次の電話へ ▶</button>`);

  swRow(g,'ボトムスの色',['#2c3e66','#25232a','#8e8a94','#b07a4f','#e3d3b8'],()=>OP_H.botC,v=>{ OP_H.botC=v; up(); });
  c.querySelector('#cl').onclick=closeModal; }
function showAch(){ const c=modal(`<h2>🏆 実績 ${G.ach.size}/${ACH.length}</h2>${ACH.map(([id,n])=>`<div class="ach ${G.ach.has(id)?'':'off'}"><span style="font-size:22px">${G.ach.has(id)?'🏆':'🔒'}</span>${n}</div>`).join('')}<button class="big sub" id="cl">閉じる</button>`); c.querySelector('#cl').onclick=closeModal; }
function showKarte(){ const c=modal(`<h2>📋 カルテ・スタンプ・口コミ</h2>
  <div class="lead">🐾 犬種スタンプ帳 ${G.stamps.size}/50</div><div class="stamp">${BREEDS.map((b,i)=>`<div class="${G.stamps.has(i)?'on':''}">${G.stamps.has(i)?b[0]:'？'}</div>`).join('')}</div>
  <div class="lead" style="margin-top:12px">💬 口コミ（評判 ${G.rep}）</div>${G.reviews.length?G.reviews.slice(0,8).map(r=>`<div class="karte"><span>「${r.text}」<br><small style="color:#8a93a5">${r.name}（${r.breed}）</small></span><span style="color:#f5b301">${'★'.repeat(r.st)}</span></div>`).join(''):'<p class="lead">まだありません</p>'}
  <div class="lead" style="margin-top:12px">📋 対応履歴</div>${G.karte.length?G.karte.slice().reverse().map(k=>`<div class="karte"><span>${k.name}（${k.breed}）<br><small style="color:#8a93a5">${k.topic}</small></span><span style="color:#f5b301">${'★'.repeat(k.st)}</span></div>`).join(''):'<p class="lead">まだありません</p>'}
  <button class="big sub" id="cl">閉じる</button>`); c.querySelector('#cl').onclick=closeModal; }
function showMenu(){ const c=modal(`<h2>≡ メニュー</h2><div class="menu">
   <button id="m1">🛒 ショップ・改装</button><button id="m2">👩‍💼 着せ替え</button>
   <button id="m3">🏆 実績 ${G.ach.size}/${ACH.length}</button><button id="m4">📋 カルテ・口コミ</button>
   <button id="m5">${G.night?'☀️ 日勤に切替':'🌙 夜勤に切替'}</button><button id="m6">💡 アイデア50</button>
   <button id="m7">${muted?'🔇 音を出す':'🔊 消音'}</button><button id="m8">✕ 閉じる</button></div>`);
  c.querySelector('#m1').onclick=showShop; c.querySelector('#m2').onclick=showCustomize; c.querySelector('#m3').onclick=showAch; c.querySelector('#m4').onclick=showKarte; c.querySelector('#m6').onclick=showIdeas;
  c.querySelector('#m5').onclick=()=>{ if(C){ toast('通話中は切り替えできません'); return; } setNight(!G.night); closeModal(); toast(G.night?'🌙 夜勤：夜限定の依頼が来ます':'☀️ 日勤シフト'); checkAch(); };
  c.querySelector('#m7').onclick=()=>{ muted=!muted; ac(); showMenu(); }; c.querySelector('#m8').onclick=closeModal; }
$('#bMenu').onclick=showMenu; $('#bShop').onclick=showShop;

/* =========================================================
   ループ
   ========================================================= */
const clock=new THREE.Clock(); let lastQ=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05); time+=dt; const k=1-Math.exp(-dt*12);
  animateHuman(op,opMotion,time); applyRig(op,k); if(decor.booth.visible){ animateHuman(cow,'phone',time+1.3); applyRig(cow,k); }
  if(callDog){ animateDog(callDog,dogMotion,time); applyRig(callDog,k); }
  for(const p of props){
    if(p.kind==='staff'){ const x=p.obj.position.x; if(x>p.goal+0.01){ p.obj.position.x=Math.max(p.goal,x-dt*1.6); p.m='run'; } else if(p.m==='run'){ p.m='wave'; p.obj.rotation.y=-0.4; p.done&&p.done(); p.done=null; setTimeout(()=>{ p.m='idle'; },2500); }
      animateHuman(p.rig,p.m,time); applyRig(p.rig,k); }
    if(p.kind==='senior'){ animateDog(p.rig,'sit',time+3); applyRig(p.rig,k); }
    if(p.kind==='box'){ if(p.y>p.ground){ p.vy-=dt*9; p.y=Math.max(p.ground,p.y+p.vy*dt); p.obj.position.y=p.y; p.obj.rotation.y+=dt*2; }
      else if(!p.opened){ p.opened=true; p.t1=time; tone(520,0.1,'square',0.04); }
      else if(time-p.t1>0.35&&!p.sprite){ p.obj.children.forEach(ch=>ch.visible=false); p.sprite=emojiSprite(p.emoji,p.sz*1.6); p.sprite.position.y=p.sz*0.5; p.obj.add(p.sprite); blip(880); p.done&&p.done(); p.done=null; }
      if(p.sprite) p.sprite.position.y=p.sz*0.6+Math.sin(time*3)*p.sz*0.08; }
  }
  // 待ち列
  if(C&&!C.ended&&G.queue.length){ for(const q of G.queue) q.pat-=dt*(holdBoost?3:0.35)*(G.endless?1:0.8)*(G.upg.booth?0.5:1);
    const gone=G.queue.filter(q=>q.pat<=0); if(gone.length){ G.queue=G.queue.filter(q=>q.pat>0); G.missed+=gone.length; gone.forEach(q=>toast(`📴 ${BREEDS[q.breed][0]}の${q.name}が電話を切りました…`)); G.queue.push(mkQueue()); }
    if(time-lastQ>0.5){ lastQ=time; renderQueue(); } }
  if(C&&!C.ended){ const s=Math.floor((performance.now()-C.t0)/1000), tm=$('#tm'); if(tm) tm.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  thunderTick(dt);
  if(flash>0){ flash-=dt; dHemi.intensity=flash>0?3.5:0.55; dogScene.background.set(flash>0?'#e8ecff':'#1b2140'); }
  dogCam.position.lerp(camGoal.pos,1-Math.exp(-dt*3)); camTgt.lerp(camGoal.tgt,1-Math.exp(-dt*3)); dogCam.lookAt(camTgt);
  if(screen.material===screenMat){ renderer.setRenderTarget(rt); renderer.render(dogScene,dogCam); renderer.setRenderTarget(null); }
  renderer.render(scene,camera);
}
screen.material=standbyMat;
hud(); title(); loop();
</script>
