<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d0a">
<title>裁判RTA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#d8b26a;--gold2:#f3d99b;--ink:#f6efe2;--dim:#b9a88f;--panel:rgba(18,13,10,.82);--line:rgba(216,178,106,.45);
  --red:#e0574a;--blue:#5aa2e6;--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden;background:#120d0a;color:var(--ink);font-family:var(--sans)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#ui>*{pointer-events:auto}
.hide{display:none!important}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}

/* ---------- 上部 ---------- */
#hud{position:absolute;left:10px;right:10px;top:calc(8px + var(--st));padding:8px 12px 10px;border-radius:14px;
  background:linear-gradient(180deg,rgba(20,14,10,.88),rgba(20,14,10,.7));border:1px solid var(--line);
  box-shadow:0 6px 20px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
#hud .row{display:flex;align-items:center;justify-content:space-between}
#phase{font-family:var(--mincho);font-size:15px;letter-spacing:.08em;color:var(--gold2)}
#phase small{font-family:var(--sans);font-size:11px;color:var(--dim);margin-right:6px;letter-spacing:0}
#timer{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:24px;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(243,217,155,.45);font-variant-numeric:tabular-nums}
#dots{display:flex;gap:4px;margin:6px 0 7px}
#dots span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .4s}
#dots span.on{background:var(--gold)}
#gauges{display:flex;gap:10px}
.gauge{flex:1;font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.gauge b{color:#fff;font-weight:600;font-size:11px}
.gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
#topbtns{position:absolute;right:12px;top:calc(98px + var(--st));display:flex;gap:6px}
.pill{font-size:12px;padding:6px 11px;border-radius:999px;background:rgba(18,13,10,.7);border:1px solid var(--line);color:var(--gold2)}
.jmini{display:flex;gap:4px;height:22px;align-items:flex-end}
.jmini div{flex:1;height:100%;position:relative;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.jmini i{position:absolute;left:0;right:0;bottom:0;transition:height .45s}
.jmini small{position:absolute;left:0;right:0;top:3px;text-align:center;font-size:9px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000}
#jurPanel{position:absolute;left:12px;top:calc(98px + var(--st));width:170px;padding:8px 10px;border-radius:12px;background:rgba(18,13,10,.75);border:1px solid var(--line);font-size:11px;pointer-events:none}
#jurPanel .jr{display:flex;align-items:center;gap:6px;margin:3px 0}
#jurPanel .jr span{width:62px;white-space:nowrap;color:var(--dim)}
#jurPanel .jr em{font-style:normal;width:26px;text-align:right;font-weight:700}

/* ---------- 会話 ---------- */
#dialog{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--sb));min-height:118px;padding:22px 16px 14px;border-radius:16px;
  background:linear-gradient(180deg,rgba(28,20,14,.92),rgba(14,10,8,.95));border:1.5px solid var(--gold);
  box-shadow:0 0 0 4px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.5)}
#dialog::before{content:"";position:absolute;inset:5px;border:1px solid rgba(216,178,106,.22);border-radius:11px;pointer-events:none}
#name{position:absolute;left:14px;top:-15px;padding:4px 14px 5px;border-radius:8px;font-family:var(--mincho);font-weight:700;font-size:15px;letter-spacing:.06em;
  background:#2a1d14;border:1.5px solid var(--gold);color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#name:empty{display:none}
#text{font-size:16.5px;line-height:1.75;min-height:56px;white-space:pre-wrap;text-shadow:0 1px 0 #000}
#text.narr{color:var(--gold2);font-style:italic}
#next{position:absolute;right:16px;bottom:8px;color:var(--gold);font-size:13px;animation:bob .8s ease-in-out infinite;opacity:0}
#next.on{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

#choices{position:absolute;left:14px;right:14px;bottom:calc(146px + var(--sb));display:flex;flex-direction:column;gap:7px}
.ch{position:relative;text-align:left;padding:10px 14px 10px 36px;border-radius:12px;font-size:14.5px;font-weight:600;line-height:1.4;
  background:linear-gradient(180deg,rgba(250,243,228,.97),rgba(234,220,193,.97));color:#2a1d12;border:1px solid #b89557;
  box-shadow:0 4px 0 #7a5a2c,0 8px 18px rgba(0,0,0,.35);animation:chIn .28s both}
.ch::before{content:"⚖";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8a6a34;font-size:15px}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5a2c,0 4px 10px rgba(0,0,0,.35)}
.ch.act{background:linear-gradient(180deg,#f3e1b4,#e2c78c)}
.ch.act::before{content:"▶"}
.ch.hot{background:linear-gradient(180deg,#ffd9c8,#f0a890);border-color:#c0392b}
.ch.hot::before{content:"🌀"}
@keyframes chIn{from{opacity:0;transform:translateX(-14px)}}
#free{display:flex;gap:6px}
#free textarea{flex:1;height:46px;resize:none;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color:#fff;
  background:rgba(18,13,10,.88);border:1px solid var(--line);outline:none}
#free textarea:focus{border-color:var(--gold)}
#free button{padding:0 16px;border-radius:12px;background:linear-gradient(180deg,#4f8ed6,#2c64a8);font-weight:700;color:#fff;box-shadow:0 3px 0 #1d4475}
#free button:disabled{opacity:.5}
.fhint{font-size:11px;color:var(--dim);text-align:center;text-shadow:0 1px 2px #000}

/* ---------- 演出 ---------- */
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s;pointer-events:none}
#fade.on{opacity:1}
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#card .bars{position:absolute;left:0;right:0;height:0;background:#000;transition:height .35s}
#card .bars.t{top:0}#card .bars.b{bottom:0}
#card.on .bars{height:16vh}
#card .inner{text-align:center;opacity:0;transform:scale(1.08);transition:all .35s}
#card.on .inner{opacity:1;transform:none}
#card .no{font-size:13px;letter-spacing:.5em;color:var(--gold);margin-bottom:8px}
#card .ttl{font-family:var(--mincho);font-size:38px;font-weight:700;letter-spacing:.25em;color:#fff;text-shadow:0 0 30px rgba(216,178,106,.6),0 2px 0 #000;
  padding:10px 26px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:linear-gradient(90deg,transparent,rgba(0,0,0,.65),transparent)}
#flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#flash span{font-family:var(--mincho);font-weight:900;font-size:58px;color:#fff;padding:6px 18px;transform:rotate(-6deg);
  -webkit-text-stroke:3px #7a1010;text-shadow:4px 4px 0 #7a1010,0 0 40px rgba(255,80,60,.8);animation:slam .55s cubic-bezier(.2,1.6,.3,1) both}
#flash span.blue{-webkit-text-stroke-color:#10357a;text-shadow:4px 4px 0 #10357a,0 0 40px rgba(60,140,255,.8)}
#flash span.gold{-webkit-text-stroke-color:#5a3d0a;text-shadow:4px 4px 0 #5a3d0a,0 0 40px rgba(255,200,80,.8)}
@keyframes slam{from{transform:scale(2.6) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.toast{position:absolute;left:50%;top:calc(110px + var(--st));transform:translateX(-50%);padding:6px 16px;border-radius:999px;font-weight:800;font-size:15px;
  background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:toast 1.2s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
#verdict{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.85));pointer-events:none}
#verdict .lab{font-family:var(--mincho);letter-spacing:.8em;color:var(--gold);font-size:16px;margin-bottom:14px;padding-left:.8em}
#verdict .res{font-family:var(--mincho);font-weight:900;font-size:44px;color:#fff;padding:14px 24px;border:3px double var(--gold);background:rgba(20,10,5,.7);
  text-align:center;line-height:1.3;animation:slam .6s cubic-bezier(.2,1.5,.3,1) both;max-width:90vw}
#verdict .tm{margin-top:16px;font-family:"SF Mono",Menlo,monospace;font-size:26px;color:var(--gold2);opacity:0;animation:fadeup .5s .5s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 画面（タイトル・結果など） ---------- */
#overlay{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#overlay.dim{background:rgba(10,7,5,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wrap{max-width:520px;margin:0 auto;padding:calc(24px + var(--st)) 18px calc(30px + var(--sb))}
.title{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px calc(26px + var(--sb));max-width:520px;margin:0 auto;
  background:linear-gradient(180deg,transparent 30%,rgba(10,7,5,.75) 62%,rgba(10,7,5,.95))}
.logo{text-align:center;margin-bottom:22px}
.logo .sub{font-size:12px;letter-spacing:.6em;color:var(--gold);padding-left:.6em}
.logo h1{font-family:var(--mincho);font-weight:900;font-size:64px;letter-spacing:.12em;line-height:1.1;margin:6px 0 4px;
  background:linear-gradient(180deg,#fff7e0,#e9c27a 55%,#a77a35);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(216,178,106,.35))}
.logo h1 span{font-family:"SF Mono",Menlo,monospace;font-size:.7em;letter-spacing:.02em}
.logo p{color:var(--dim);font-size:13px}
.menu{display:grid;gap:10px}
.mbtn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;text-align:left;
  background:linear-gradient(180deg,rgba(46,33,22,.95),rgba(26,18,12,.95));border:1px solid var(--line);box-shadow:0 4px 0 #000,0 10px 20px rgba(0,0,0,.35)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.mbtn .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:rgba(216,178,106,.12);border:1px solid var(--line);flex:none}
.mbtn b{display:block;font-size:16px;color:#fff}
.mbtn small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.mbtn.main{background:linear-gradient(180deg,#e9c27a,#b8873e);border-color:#f3d99b;color:#2a1a0a;box-shadow:0 4px 0 #6d4a17,0 10px 24px rgba(216,178,106,.25)}
.mbtn.main b{color:#2a1a0a}.mbtn.main small{color:#5a3d16}.mbtn.main .ic{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keyst{text-align:center;font-size:12px;color:var(--dim);margin-top:14px}
.keyst b{color:var(--gold2)}
h2.sec{font-family:var(--mincho);font-size:26px;letter-spacing:.12em;color:var(--gold2);margin-bottom:14px;text-align:center}
.box{background:rgba(30,22,15,.9);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.box h4{font-size:14px;color:var(--gold2);margin-bottom:6px}
.small{font-size:13px;color:var(--dim);line-height:1.75}
label.l{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--gold2)}
input.in{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0e0a07;color:#fff;outline:none}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:15px;text-align:center;margin-top:10px;
  background:rgba(46,33,22,.95);border:1px solid var(--line);box-shadow:0 3px 0 #000}
.btn.gold{background:linear-gradient(180deg,#e9c27a,#b8873e);color:#2a1a0a;border-color:#f3d99b;box-shadow:0 3px 0 #6d4a17}
.btn:active{transform:translateY(2px);box-shadow:none}
.rhead{text-align:center;padding-top:10px}
.rhead .md{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.rhead h3{font-family:var(--mincho);font-size:32px;margin:8px 0;line-height:1.3}
.big{font-family:"SF Mono",Menlo,monospace;font-size:46px;font-weight:700;text-align:center;color:#fff;text-shadow:0 0 18px rgba(243,217,155,.4)}
.rec{text-align:center;font-weight:800;color:var(--gold2);min-height:22px;margin:4px 0 8px}
table.sp{width:100%;border-collapse:collapse;font-size:14px}
table.sp td{padding:8px 4px;border-bottom:1px solid rgba(216,178,106,.18)}
table.sp td:last-child{text-align:right;font-family:"SF Mono",Menlo,monospace}
.enjo{text-align:center;font-size:20px;margin-top:6px}
.zk{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid rgba(216,178,106,.15);font-size:14px}
.zk.no{color:#6d5f4f}
.zk span:last-child{font-family:"SF Mono",Menlo,monospace}
.logl{font-size:14px;line-height:1.7;padding:7px 0;border-bottom:1px solid rgba(216,178,106,.12)}
.logl b{color:var(--gold2);margin-right:6px}
.loading{text-align:center;padding:60px 0;color:var(--dim)}
.spin{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(216,178,106,.2);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 新聞 ---------- */
.paper{background:#f7f2e6;color:#141210;padding:16px 14px 18px;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.6);font-family:var(--mincho);
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:4px 4px;transform:rotate(-.6deg);animation:paperIn .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes paperIn{from{transform:rotate(-14deg) scale(.4);opacity:0}}
.paper .np{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px double #141210;padding-bottom:6px}
.paper .np h3{font-size:26px;letter-spacing:.2em;font-weight:900}
.paper .np small{font-size:11px;text-align:right;line-height:1.4}
.paper .midashi{font-size:30px;font-weight:900;line-height:1.28;margin:12px 0 8px;letter-spacing:.02em}
.paper .komi{font-size:15px;font-weight:800;border-left:6px solid #141210;padding-left:8px;margin-bottom:10px}
.paper .honbun{columns:2;column-gap:14px;column-rule:1px solid #b7ae9c;font-size:13.5px;line-height:1.85;text-align:justify}
.paper .pbox{border:1px solid #141210;padding:8px 10px;margin-top:12px;font-size:13px;line-height:1.7}
.paper .pbox h4{display:inline-block;background:#141210;color:#f7f2e6;font-size:12px;padding:1px 8px;margin-bottom:5px}
.paper .lt{padding:5px 0;border-top:1px dashed #9a917f}
.paper .lt:first-of-type{border-top:none}
.paper .fire{color:#b42318;font-weight:900;text-align:right;margin-top:10px}
.pnote{text-align:center;font-size:12px;color:var(--dim);margin:12px 0 0}
.case{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;background:linear-gradient(180deg,rgba(46,33,22,.95),rgba(26,18,12,.95));border:1px solid var(--line);box-shadow:0 3px 0 #000}
.case:active{transform:translateY(2px);box-shadow:none}
.case b{display:block;font-family:var(--mincho);font-size:19px;color:#fff;margin:4px 0 2px;letter-spacing:.04em}
.case small{color:var(--dim);font-size:12px}
.case .ct{display:flex;justify-content:space-between;align-items:center}
.case .era{font-size:11px;color:var(--dim)}
.case .cb{display:flex;justify-content:space-between;font-size:11px;color:#8a7a66;margin-top:6px}
.case .bt{color:var(--gold2);font-family:"SF Mono",Menlo,monospace}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.chip.real{background:rgba(224,87,74,.18);color:#ff9a8a;border:1px solid rgba(224,87,74,.5)}
.chip.fun{background:rgba(160,110,230,.18);color:#d0b0ff;border:1px solid rgba(160,110,230,.5)}
h4.grp{font-family:var(--mincho);color:var(--gold2);font-size:15px;margin:18px 2px 4px;letter-spacing:.06em}
h4.grp small{font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:0}
.box.real{border-color:rgba(216,178,106,.7);background:linear-gradient(180deg,rgba(60,42,22,.92),rgba(30,22,15,.92))}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.court{padding:9px 6px;border-radius:10px;background:rgba(30,22,15,.9);border:1px solid var(--line);text-align:center}
.court b{display:block;font-size:13px;color:#fff}.court small{font-size:10px;color:var(--dim)}
.court.on{background:linear-gradient(180deg,#e9c27a,#b8873e);border-color:#f3d99b}.court.on b,.court.on small{color:#2a1a0a}
.court.lock{opacity:.45}
.prog{margin:12px 0 6px;padding:10px 12px;border-radius:12px;background:rgba(30,22,15,.85);border:1px solid var(--line)}
.prog .pt{font-size:12px;color:var(--dim)}.prog .pt b{color:var(--gold2)}
.prog .gbar{height:6px;margin:7px 0 5px}.prog .pn{font-size:11px;color:var(--dim)}
.lvup{margin:10px 0;padding:14px;border-radius:14px;text-align:center;background:linear-gradient(180deg,rgba(233,194,122,.25),rgba(184,135,62,.15));border:1.5px solid var(--gold);animation:paperIn .6s both}
.lvup .lt{font-size:13px;color:var(--gold2);letter-spacing:.1em}.lvup b{display:block;font-family:var(--mincho);font-size:22px;margin:4px 0;color:#fff}.lvup small{font-size:12px;color:var(--dim)}

/* ===== 左メニュー＋タイルの画面 ===== */
:root{--bg1:#141824;--bg2:#1c2232;--tile:#262d40;--tile2:#2e3650;--acc:#e9b85c;--acc2:#ff9a52;--txt:#eef1f8;--sub:#9aa3b8}
.shell{display:flex;min-height:100%;background:linear-gradient(180deg,rgba(18,22,34,.93),rgba(14,17,27,.97));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rail{position:sticky;top:0;height:100vh;height:100dvh;flex:none;width:76px;padding:calc(10px + var(--st)) 6px calc(10px + var(--sb));display:flex;flex-direction:column;gap:4px;background:rgba(10,13,22,.85);border-right:1px solid rgba(255,255,255,.06)}
.rlogo{font-size:24px;text-align:center;color:var(--acc);margin:4px 0 10px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;color:var(--sub);font-size:10.5px;border:1.5px solid transparent;transition:.2s}
.rb:active{transform:scale(.96)}
.rb.on{color:#fff;background:rgba(233,184,92,.12);border-color:var(--acc2);box-shadow:0 0 0 1px rgba(255,154,82,.25),0 6px 18px rgba(255,154,82,.18)}
.pane{flex:1;min-width:0;padding:calc(16px + var(--st)) 14px calc(28px + var(--sb))}
.ph h2{font-family:var(--sans);font-weight:800;font-size:28px;color:var(--txt);letter-spacing:.02em}
.ph p{font-size:12.5px;color:var(--sub);margin:4px 0 12px}
.sh{font-size:13px;color:var(--sub);margin:18px 2px 8px;font-weight:700;letter-spacing:.08em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.tile .tt{display:flex;flex-direction:column;gap:3px}
.tiles.big{grid-template-columns:1fr}
@media(min-width:620px){.tiles.big{grid-template-columns:repeat(3,1fr)}}

const VMAT = new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0});
const _col = new THREE.Color();
function voxGeo(list){
  const key=(x,y,z)=>x+','+y+','+z;
  const set=new Set(list.map(v=>key(v[0],v[1],v[2])));
  const P=[],N=[],C=[],I=[];
  for(const [x,y,z,hex] of list){
    _col.set(hex);

/* ---------- 色の決め方 ---------- */
function bodyColor(P,x,y,z){
  const {bw,bh,bl,c1,c2,c3}=P, front=z===bl-1, bottom=y===0, side=(x===0||x===bw-1);
  switch(P.pat){
    case 'bicolor': if(bottom||(front&&y<bh-1)||(z>=bl-2&&y<=1)) return c2; return c1;
    case 'tricolor':
      if(bottom||(z>=bl-2&&y<bh-1)) return c2;
      if(y>=bh-2&&z>=1&&z<=bl-3&&!(y===bh-2&&(z===1||z===bl-3))) return c3;
      if(y===bh-3&&z>=2&&z<=bl-4&&side) return c3;
      return c1;
    case 'spots': return hash3(x,y,z,P.seed)<0.2?c3:c1;
    case 'husky': if(front&&y<bh-1) return c2; return y>=bh/2?c1:c2;
    case 'saddle':
      if(y>=bh-2&&z>0&&z<bl-1) return c3;
      if(y===bh-3&&z>=1&&z<=bl-3&&side) return c3; return c1;
    case 'tuxedo': if((front&&y<bh-1)||(bottom&&z>=bl/2)) return c2; return c1;
    case 'points': if(front&&y<=1&&!side) return c2; return c1;
    case 'brindle': return (((z*2+y+(x%2))%4===0)&&hash3(x,y,z,P.seed)>0.25)?c3:c1;
    case 'patches': return (y>0&&hash3(Math.floor(x/2),Math.floor(y/2),Math.floor(z/2.5),P.seed)<0.35)?c3:c1;
    case 'patch1': return (y>=bh-2&&z<=2)?c3:c1;
  }
  return c1;
}
function headColor(P,x,y,z,eyeRow,ex){
  const {hw,hh,hd,sh,c1,c2,c3}=P, base=P.headC||c1;
  const front=z===hd-1, top=y===hh-1, cx=x-hw/2+0.5;
  const center=Math.abs(cx)<(hw%2?0.6:1.1);
  const eyeCol=Math.abs(Math.abs(cx)-ex)<0.6;
  if(P.brow&&front&&y===eyeRow+1&&eyeCol) return P.brow;
  switch(P.head){
    case 'blaze': if(center&&((front&&y>=sh)||(top&&z>=hd-3))) return c2; return base;
    case 'cheeks': if(y<sh&&(front||z>=hd-3)) return c2; return base;
    case 'mask':
      if(top) return c1;
      if(front){ if(y>eyeRow+1) return c1; if(center&&y>=eyeRow) return c1; return c2; }
      return y<=sh?c2:c1;
    case 'spots': return (!front&&hash3(x,y,z,P.seed+5)<0.16)?c3:base;
    case 'halfface': if(center&&(front||top)) return base; if(y>=sh) return c3; return base;
  }
  return base;
}
function legColor(P,front,y,li,z){
  const base=front?(P.frontLegC||P.legC||P.c1):(P.legC||P.c1);
  if(P.socks&&y<P.socks) return P.sockC||P.c2;
  if(P.pat==='spots'&&hash3(li*5,y,z,P.seed+1)<0.2) return P.c3;
  if(P.pat==='patches'&&y>=P.L-1&&hash3(li,1,1,P.seed)<0.3) return P.c3;
  return base;
}

/* ---------- 犬の組み立て ---------- */
function buildDog(P0){
  const P=Object.assign({},DOGDEF,P0);
  if(P.sh<2) P.sh=2;
  const {bw,bh,bl,L,lw,hw,hh,hd,sw,sh,sl}=P;
  const rig={type:'dog',P,nodes:[],ears:[],legs:{},eyes:[]};
  const root=new THREE.Group(); rig.root=root;
  const mover=track(rig,new THREE.Group()); root.add(mover); rig.mover=mover;
  const hipZ=-bl/2+lw/2;
  const bodyG=new THREE.Group(); bodyG.position.set(0,L,hipZ); mover.add(bodyG); track(rig,bodyG); rig.bodyG=bodyG;
  const inner=new THREE.Group(); inner.position.set(0,-L,-hipZ); bodyG.add(inner);
  // 胴体
  inner.add(vmesh(vbox(bw,bh,bl,-bw/2,L,-bl/2,(x,y,z)=>bodyColor(P,x,y,z))));
  if(P.ruff) inner.add(vmesh(vbox(bw+2,bh,2,-(bw+2)/2,L+1,bl/2-1.5,()=>P.ruff)));
  // 脚
  const legX=Math.max(bw/2-lw/2,lw/2), fz=bl/2-lw/2;
  [['FL',legX,fz,true],['FR',-legX,fz,true],['RL',legX,hipZ,false],['RR',-legX,hipZ,false]].forEach(([n,x,z,front],li)=>{
    const piv=new THREE.Group(); piv.position.set(x,L,z); inner.add(piv); track(rig,piv);
    const m=vmesh(vbox(lw,L+1,lw,-lw/2,-L,-lw/2,(xx,yy,zz)=>legColor(P,front,yy,li,zz)));
    m.scale.set(0.97,1,0.97); piv.add(m); rig.legs[n]=piv;
  });
  // 頭
  const head=new THREE.Group(); head.position.set(0,L+bh-1,bl/2-1); inner.add(head); track(rig,head); rig.head=head;
  const eyeY=Math.min(sh+1.5,hh-1.5), eyeRow=Math.floor(eyeY), ex=Math.max(1,hw/2-1.5);
  const hm=vmesh(vbox(hw,hh,hd,-hw/2,0,-1,(x,y,z)=>headColor(P,x,y,z,eyeRow,ex))); hm.scale.setScalar(1.004); head.add(hm);
  const sz0=hd-1;
  const sc=P.snoutC||(['blaze','cheeks','mask','halfface'].includes(P.head)?P.c2:(P.headC||P.c1));
  const muzzle=P.beard||sc;
  head.add(vmesh(vbox(sw,sh-1,sl,-sw/2,1,sz0,()=>muzzle)));
  const jaw=new THREE.Group(); jaw.position.set(0,1,sz0); head.add(jaw); track(rig,jaw); rig.jaw=jaw;
  const bd=P.beard?1:0;
  jaw.add(vmesh(vbox(sw,1+bd,sl,-sw/2,-1-bd,0,()=>muzzle)));
  const tongue=cube(Math.max(1,sw-1.4),0.2,sl*0.8,'#ee7d8c'); tongue.position.set(0,0.1,sl*0.45); jaw.add(tongue);
  if(P.tongue){ const tg=cube(1,1.2,0.3,'#ee7d8c'); tg.position.set(0.2,-0.5,sl+0.1); jaw.add(tg); }
  const nw=sw>=4?2:1, nose=cube(nw,1,1,P.nose); nose.position.set(0,sh-0.45,sz0+sl-0.3); head.add(nose);
  for(const s of [1,-1]){
    const eg=new THREE.Group(); eg.position.set(s*ex,eyeY,sz0+0.12); head.add(eg); rig.eyes.push(eg);
    const e=cube(P.eS,P.eS,0.3,P.eye); eg.add(e);
    const hl=cube(0.34*P.eS,0.34*P.eS,0.1,'#ffffff'); hl.position.set(0.2*P.eS,0.2*P.eS,0.17); eg.add(hl);
  }
  // 耳
  const earC=P.earC||P.headC||P.c1, inC=shade(earC,0.35);
  for(const s of [1,-1]){
    const piv=new THREE.Group(); let list=[], re=[0,0,0];
    if(P.ear==='flop'){
      piv.position.set(s*hw/2,hh-0.5,(hd-2)/2-0.5);
      list=vbox(P.eW,P.eL,P.eD,s>0?0:-P.eW,-P.eL+0.5,-P.eD/2,()=>earC);
    } else if(P.ear==='fold'){
      piv.position.set(s*(hw/2-0.6),hh,hd/2-1.5);
      list=vbox(2,1,2,-1,0,-1,()=>earC).concat(vbox(2,1,1,-1,-0.6,1,()=>earC));
    } else { // prick / bat / butterfly
      const w=P.eW,h=P.eL;
      piv.position.set(s*(hw/2-w),hh,(hd-2)/2-1);
      for(let r=0;r<h;r++){ const width=Math.max(1,w-Math.floor(r*w/h));
        for(let i=0;i<w;i++){ const keep=s>0?i>=w-width:i<width; if(!keep) continue;
          const xx=s>0?i:-w+i;
          list.push([xx,r,-1,earC]);
          const inner=(r<h-1&&width>1&&(s>0?i>w-width:i<width-1))||(w===1&&r<h-1&&h>2);
          list.push([xx,r,0,inner?inC:earC]);
        }}
      if(P.ear==='bat') re=[0,0,-s*0.3];
      if(P.ear==='butterfly') re=[0,0,-s*0.6];
    }
    piv.add(vmesh(list)); head.add(piv); track(rig,piv,...re); piv.userData.s=s; rig.ears.push(piv);
  }
  if(P.topknot){
    head.add(vmesh(vbox(3,1,3,-1.5,hh,hd/2-2.5,()=>P.headC||P.c1)));
    if(P.bow){ const b=cube(2.2,0.9,0.9,P.bow); b.position.set(0,hh+1.3,hd/2-1); head.add(b); const k=cube(0.7,0.7,1,shade(P.bow,-0.2)); k.position.copy(b.position); head.add(k); }
  }
  // 首輪
  const collar=cube(hw+0.25,0.8,hd+0.25,'#e04848'); collar.position.set(0,0.35,hd/2-1); head.add(collar);
  const tag=cube(0.7,0.7,0.2,'#f2c94c'); tag.position.set(0,-0.3,hd-0.8); collar.add(tag);
  rig.collar=collar;
  // しっぽ
  const tail=new THREE.Group(); tail.position.set(0,L+bh-1,-bl/2+0.5); inner.add(tail);
  const tc=P.tailC||P.c1, tip=P.tailTip;
  let pts=[], w=P.tW, rx=-0.3;
  const chain=n=>{ for(let i=0;i<n;i++) pts.push([0,i,0]); };
  switch(P.tail){
    case 'up': chain(P.tl); rx=-0.3; break;
    case 'stub': chain(Math.max(1,P.tl)); rx=-0.6; break;
    case 'curl': pts=[[0,0,0],[0,1,0],[0,2,0],[0,3,1],[0,3,2],[0,2,3]]; rx=0; break;
    case 'fluffy': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,2,1],[0,2,2],[0,2,3],[0,1,3]]; rx=-0.1; break;
    case 'feather': case 'down': chain(P.tl); rx=-2.25; break;
    case 'whip': w=1; chain(P.tl); rx=-2.5; break;
    case 'pom': w=1; chain(P.tl); rx=-0.45; break;
    case 'pugcurl': w=Math.max(2,w); pts=[[0,0,0],[0,1,0],[0,1,1]]; rx=0.2; break;
  }
  const tv=[], seen=new Set();
  pts.forEach((p,pi)=>{ for(let a=0;a<w;a++)for(let b=0;b<w;b++)for(let c=0;c<w;c++){
    const v=[p[0]-w/2+a,p[1]+b,p[2]-w/2+c];
    const k=v.join(','); if(seen.has(k)) continue; seen.add(k);
    tv.push([v[0],v[1],v[2],(tip&&pi===pts.length-1)?tip:tc]); } });
  if(P.tail==='pom') for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++) tv.push([-1+a,P.tl+b,-1+c,tc]);
  tail.add(vmesh(tv)); track(rig,tail,rx,0,0); rig.tail=tail;
  // 電話（小道具）
  const phone=new THREE.Group();
  const pb=cube(1.3,2.2,0.35,'#2f3440'); phone.add(pb);
  const scr=cube(1.05,1.8,0.06,'#8fd4ff'); scr.position.z=-0.2; phone.add(scr);
  phone.position.set(0.3,-L+0.6,lw/2+0.4); phone.visible=false;
  rig.legs.FR.add(phone); rig.phone=phone;
  // サイズ情報
  rig.height=(L+bh+hh)*VOX; rig.withers=(L+bh)*VOX; rig.len=(bl+hd+sl)*VOX;
  resetRig(rig); snapRig(rig);
  return rig;
}

/* ---------- 犬のモーション ---------- */
const DOG_MOTIONS=[['idle','待機'],['walk','歩く'],['run','走る'],['sit','おすわり'],['down','伏せ'],['sleep','寝る'],['jump','ジャンプ'],['happy','喜ぶ'],['bark','吠える'],['shake','ブルブル'],['dig','穴掘り'],['sad','しょんぼり'],['beg','おねだり'],['phone','電話'],['paw','お手'],['spin','くるくる'],['sniff','クンクン']];
function dogWag(R,amt){ rot(R.tail,0,0,amt); }
function dogEars(R,amt,back=0){ for(const e of R.ears){ if(R.P.ear==='flop') rot(e,back,0,e.userData.s*amt); else rot(e,-amt*0.6-back,0,0); } }
function sitPose(R){
  const P=R.P, D=P.bl-P.lw, L=P.L;
  const a=Math.min(1.0,Math.max(0.12,Math.asin(Math.max(-0.99,Math.min(0.99,(L-0.3)/D)))));
  const hipY=Math.max(0.2,L-D*Math.sin(a));
  const beta=Math.acos(Math.min(1,hipY/L));
  return {a,hipY,beta};
}
function animateDog(R,m,t){
  resetRig(R);
  const P=R.P, Lg=R.legs, s=Math.sin;
  let blink=((t+P.seed)%3.7)<0.13, eyeS=1;
  R.phone.visible=false;
  switch(m){
    case 'idle':
      pos(R.bodyG,0,s(t*2.2)*0.12,0); dogWag(R,s(t*5)*0.35); rot(R.head,s(t*0.7)*0.06,s(t*0.5)*0.15,0); dogEars(R,0.05+s(t*1.3)*0.04); break;
    case 'walk': { const ph=t*7;
      rot(Lg.FL,s(ph)*0.5); rot(Lg.RR,s(ph)*0.5); rot(Lg.FR,-s(ph)*0.5); rot(Lg.RL,-s(ph)*0.5);
      pos(R.bodyG,0,Math.abs(s(ph))*0.25,0); rot(R.head,s(ph*2)*0.04); dogWag(R,s(t*7)*0.4); dogEars(R,0.1+Math.abs(s(ph))*0.1); break; }
    case 'run': { const ph=t*13;
      rot(Lg.FL,s(ph)*0.95); rot(Lg.FR,s(ph+0.35)*0.95); rot(Lg.RL,s(ph+Math.PI)*0.95); rot(Lg.RR,s(ph+Math.PI+0.35)*0.95);
      rot(R.bodyG,s(ph)*0.12); pos(R.mover,0,Math.abs(s(ph))*1.2,0); rot(R.tail,-0.6,0,s(ph)*0.2); rot(R.head,-s(ph)*0.1+0.1);
      dogEars(R,0.5+s(ph)*0.3,0.4); break; }
    case 'sit': case 'phone': case 'paw': { const S=sitPose(R);
      rot(R.bodyG,-S.a); pos(R.bodyG,0,S.hipY-P.L,0);
      rot(Lg.FL,S.a); rot(Lg.FR,S.a); rot(Lg.RL,-S.beta+S.a,0,0.15); rot(Lg.RR,-S.beta+S.a,0,-0.15);
      rot(R.head,S.a*0.85+s(t*0.8)*0.04); rot(R.tail,-0.9,0,s(t*5)*0.4); dogEars(R,0.06);
      if(m==='phone'){ rot(Lg.FR,S.a-2.55,0,-0.35); rot(R.head,S.a*0.85+0.05,0.15,0.28); R.phone.visible=true;
        rot(R.jaw,Math.max(0,s(t*11))*0.28*(s(t*1.7)>-0.3?1:0)); dogEars(R,-0.08,0); }
      if(m==='paw'){ rot(Lg.FR,S.a-1.35+s(t*4)*0.1,0,0); rot(R.head,S.a*0.85,0,s(t*2)*0.2); rot(R.tail,-0.9,0,s(t*12)*0.5); }
      break; }
    case 'down': case 'sleep': {
      pos(R.bodyG,0,P.lw/2-P.L,0); rot(Lg.FL,-1.45); rot(Lg.FR,-1.45); rot(Lg.RL,-1.45,0,0.2); rot(Lg.RR,-1.45,0,-0.2);
      rot(R.tail,-1.4,0,m==='sleep'?0.6:s(t*3)*0.3);

/* ---------- 顔テクスチャ ---------- */
const FACE_W=256;
function drawFace(cv,H,closed){
  const g=cv.getContext('2d'); g.clearRect(0,0,FACE_W,FACE_W);
  const ink='#3a2620', ex=47, ey=104;
  g.lineCap='round'; g.lineJoin='round';
  const ell=(x,y,rx,ry,fill)=>{ g.fillStyle=fill; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); };
  if(H.blush) for(const s of [-1,1]) ell(128+s*74,142,21,11,'rgba(255,110,130,0.38)');
  // 眉
  if(H.brows!=='none'){ g.strokeStyle=shade(H.hairC,-0.35); g.lineWidth=6;
    for(const s of [-1,1]){ const x=128+s*ex; let yi=64,yo=60;
      if(H.brows==='worried'){yi=53;yo=64;} if(H.brows==='angry'){yi=68;yo=53;}
      g.beginPath(); g.moveTo(x-s*15,yi); g.quadraticCurveTo(x,Math.min(yi,yo)-4,x+s*15,yo); g.stroke(); } }
  // 目
  const eye=(x,rx,ry,dy=0)=>{ const y=ey+dy;
    ell(x,y,rx,ry,'#2a1c15'); ell(x,y+ry*0.22,rx*0.8,ry*0.68,H.eyeC); ell(x,y+ry*0.3,rx*0.4,ry*0.36,shade(H.eyeC,-0.5));
    ell(x-rx*0.3,y-ry*0.36,rx*0.38,ry*0.3,'#fff'); ell(x+rx*0.38,y+ry*0.46,rx*0.17,rx*0.17,'#fff');
    g.strokeStyle='#2a1c15'; g.lineWidth=5; g.beginPath(); g.ellipse(x,y,rx+1.5,ry+1.5,0,Math.PI*1.12,Math.PI*1.88); g.stroke(); };
  for(const s of [-1,1]){
    const x=128+s*ex;
    let t=closed?'blink':H.eyes; if(H.eyes==='wink'&&s===1) t='smile'; else if(H.eyes==='wink') t=closed?'blink':'round';
    g.strokeStyle=ink; g.lineWidth=6;
    if(t==='blink'){ g.beginPath(); g.moveTo(x-15,ey+5); g.quadraticCurveTo(x,ey+13,x+15,ey+5); g.stroke(); }
    else if(t==='smile'){ g.beginPath(); g.arc(x,ey+12,15,Math.PI*1.15,Math.PI*1.85); g.stroke(); }
    else if(t==='round') eye(x,17,26);
    else if(t==='sparkle'){ eye(x,18,27); g.fillStyle='#fff'; const sx=x+6,sy=ey+2; g.beginPath(); g.moveTo(sx,sy-8); g.lineTo(sx+2.5,sy-2.5); g.lineTo(sx+8,sy); g.lineTo(sx+2.5,sy+2.5); g.lineTo(sx,sy+8); g.lineTo(sx-2.5,sy+2.5); g.lineTo(sx-8,sy); g.lineTo(sx-2.5,sy-2.5); g.closePath(); g.fill(); }
    else if(t==='sharp'){ eye(x,16,21,4); g.strokeStyle='#2a1c15'; g.lineWidth=7; g.beginPath(); g.moveTo(x-s*19,ey-10); g.lineTo(x+s*19,ey-20); g.stroke(); }
    else if(t==='sleepy'){ g.save(); g.beginPath(); g.rect(x-30,ey-4,60,50); g.clip(); eye(x,17,24); g.restore(); g.strokeStyle='#2a1c15'; g.lineWidth=6; g.beginPath(); g.moveTo(x-19,ey-3); g.quadraticCurveTo(x,ey-9,x+19,ey-3); g.stroke(); }
    else if(t==='dot'){ ell(x,ey+4,8,10,'#2a1c15'); ell(x-3,ey,3,3,'#fff'); }
  }
  // 口
  g.strokeStyle=ink; g.lineWidth=5; const my=168;
  switch(H.mouth){
    case 'smile': g.beginPath(); g.arc(128,my-10,13,Math.PI*0.2,Math.PI*0.8); g.stroke(); break;
    case 'grin': g.fillStyle='#7a2d2d'; g.beginPath(); g.moveTo(110,my-2); g.quadraticCurveTo(128,my+30,146,my-2); g.closePath(); g.fill(); ell(128,my+12,9,5.5,'#f08a8a'); g.stroke(); break;
    case 'fang': g.beginPath(); g.arc(128,my-10,13,Math.PI*0.2,Math.PI*0.8); g.stroke(); g.fillStyle='#fff'; g.beginPath(); g.moveTo(132,my+1); g.lineTo(140,my-1); g.lineTo(137,my+8); g.closePath(); g.fill(); break;
    case 'cat': g.beginPath(); g.arc(121,my-2,7,0,Math.PI); g.stroke(); g.beginPath(); g.arc(135,my-2,7,0,Math.PI); g.stroke(); break;
    case 'o': ell(128,my+2,7,9,'#7a2d2d'); break;
    case 'flat': g.beginPath(); g.moveTo(117,my); g.lineTo(139,my); g.stroke(); break;
  }
}

const DOWN=new THREE.Vector3(0,-1,0);
function ik(rig,side,target,pole){
  const sh=side<0?rig.shR:rig.shL, el=side<0?rig.elR:rig.elL, D=rig.dims;
  const S=sh.userData.rest, a=D.upper, b=D.fore+D.handR*0.55;
  const d=target.clone().sub(S); let dist=d.length(); dist=Math.min(a+b-1e-4,Math.max(Math.abs(a-b)+1e-4,dist));
  const dir=d.normalize();
  const cosA=Math.min(1,Math.max(-1,(a*a+dist*dist-b*b)/(2*a*dist))), A=Math.acos(cosA);
  const P=(pole||new THREE.Vector3(side*0.9,-0.4,-0.5)).clone();
  const perp=P.sub(dir.clone().multiplyScalar(P.dot(dir))).normalize();
  const e1=dir.clone().multiplyScalar(cosA).add(perp.multiplyScalar(Math.sin(A))).normalize();
  const E=S.clone().add(e1.clone().multiplyScalar(a)), T2=S.clone().add(dir.clone().multiplyScalar(dist));
  const e2=T2.sub(E).normalize();
  const qU=new THREE.Quaternion().setFromUnitVectors(DOWN,e1);
  const e2l=e2.applyQuaternion(qU.clone().invert());
  sh.userData.tq.copy(qU); el.userData.tq.setFromUnitVectors(DOWN,e2l);
}

      rot(R.hips,0,0,a*0.12); rot(R.torso,0,0,-a*0.18); pos(R.mover,a*D.T*0.03,Math.abs(s(ph*2))*D.T*0.02,0);
      ik(R,-1,a>0?V(-(D.tw+D.R*0.4),D.headY+D.R*1.2,D.R*0.2):V(-D.tw*1.3,D.torsoLen*0.2,D.tw*0.4),V(-1,0,-0.5));
      ik(R,1,a<0?V(D.tw+D.R*0.4,D.headY+D.R*1.2,D.R*0.2):V(D.tw*1.3,D.torsoLen*0.2,D.tw*0.4),V(1,0,-0.5));
      rot(R.hipL,a>0?-0.4:0,0,0.1); rot(R.kneeL,a>0?0.7:0); rot(R.hipR,a<0?-0.4:0,0,-0.1); rot(R.kneeR,a<0?0.7:0); rot(R.neck,0,0,a*0.2); break; }
    case 'point': { const p=s(t*3)*0.03;

      rot(R.neck,-0.05,-0.2,0); rot(R.torso,0,-0.15,0); rot(R.hipR,-0.15); break; }
    case 'surprise': { const p=(t%2.4)/2.4, j=p<0.25?s(p/0.25*Math.PI):0, sh=s(t*30)*0.02;

      rot(R.torso,-0.15); rot(R.neck,-0.2); pos(R.mover,0,j*D.T*0.07,-j*D.T*0.02); rot(R.hipR,-0.2); rot(R.kneeR,0.3); break; }
    case 'sad':
      rot(R.neck,0.45,s(t*0.4)*0.1,0); rot(R.torso,0.18); rot(R.shL,-0.2,0,0.02); rot(R.shR,-0.2,0,-0.02); rot(R.elL,-0.1); rot(R.elR,-0.1);

  }
  const blink=((t+0.7)%3.6)<0.13;

}

function noise(dur,vol=0.08,freq=800,when=0,q=0.8){

  const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0);

  const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(t);
}

function headWorld(a,out=new THREE.Vector3()){ return a.rig.head.getWorldPosition(out); }
const _hv=new THREE.Vector3(), _tv=new THREE.Vector3();
function animateActor(a,t,dt){
  const R=a.rig, D=R.dims, s=Math.sin;
  // 歩き
  if(a.walk){ const w=a.walk; const k=clamp((t-w.t0)/w.dur,0,1); const e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    a.g.position.lerpVectors(w.from,w.to,e);
    const dir=_tv.copy(w.to).sub(w.from); const face=Math.atan2(dir.x,dir.z);
    a.g.rotation.y=k<0.85?face:w.ry;
    if(k>=1){ a.walk=null; a.g.rotation.y=w.ry; a.sit=w.sit; } }
  let m=a.walk?'walk':(a.motionUntil>t?a.motion:'idle');
  const tt=t+a.t0;
  animateHuman(R,m==='gavel'||m==='talk'?'idle':m,tt);
  if(a.sit && !a.walk){
    const li=a.li;
    rot(R.hipL,-Math.PI/2,0,0.06); rot(R.hipR,-Math.PI/2,0,-0.06); rot(R.kneeL,Math.PI/2); rot(R.kneeR,Math.PI/2);
    pos(R.hips,0,-li.thigh+s(tt*2)*D.T*0.002,-li.thigh*0.6); pos(R.mover,0,m==='surprise'?Math.max(0,s(tt*14))*0.03:0,0);
    if(m==='idle'){ ik(R,-1,V(-D.tw*0.55,D.tw*0.25,D.tw*1.35),V(-1,-0.3,-0.4)); ik(R,1,V(D.tw*0.55,D.tw*0.25,D.tw*1.35),V(1,-0.3,-0.4)); }
  }
  if(m==='gavel'){ const p=Math.max(0,s(tt*14)); ik(R,-1,V(-D.tw*0.9,D.torsoLen*0.55+p*D.R*0.6,D.tw*2.0),V(-1,-0.3,-0.5)); rot(R.neck,0.15); }
  if(a.talking && !a.walk){
    rot(R.neck,s(tt*7)*0.05,(a.lookYaw||0)*0.5,s(tt*3)*0.05);
    if(m==='idle'||m==='talk'){ const side=a.sit?1:1; ik(R,side,V(D.tw*1.05,D.torsoLen*0.5+s(tt*4.2)*D.R*0.18,D.tw*1.7+s(tt*2.7)*D.tw*0.3),V(1,-0.6,-0.2)); }
  } else if(a.lookYaw!=null && !a.walk && (m==='idle'||m==='gavel')){
    rot(R.neck,0.02,clamp(a.lookYaw,-1.0,1.0)*0.8,0);

/* =========================================================

   ========================================================= */
function buildTree(C,mode){
  const T=buildTreeBase(C,mode);
  const wl=t=>C.wit.dog?'ワン？':t;
  const add=(id,list,beforeLast=true)=>{ const n=T[id]; if(!n) return; if(beforeLast&&n.choices.length) n.choices.splice(n.choices.length-1,0,...list); else n.choices.push(...list); };
  if(mode==='defendant'){
    add('start',[
      {t:'「裁判長、今日はいい天気ですね」',r:[[J,'……天気の話は、あとにしてください。']],e:{z:5},once:true},
      {t:'「名前は、紙に書いて出します」',r:[[J,'……口で言ってください。'],[D,C.def.name+'です……。']],e:{s:-3,e:3},p:3,next:'kiso'}],false);
    add('kiso',[
      {t:'「弁護人に、全部お任せします」',r:[[B,C.defClaim]],e:{s:2},next:'shoko'},
      {t:'「一部だけ、認めます」',r:[[J,'……どの部分を、ですか。'],[D,'えっと……あとで考えます。'],[P,'（なんだそれは）']],e:{s:-6,z:8},next:'shoko'}]);
    add('shoko',[
      {t:'「弁護人、反論をお願いします」',r:[[B,C.ev[0].obj]],e:{s:6},next:'shoko2'},
      {t:'「その証拠、近くで見せてください」',r:[[P,'……どうぞ。'],[J,'確認したら、席に戻ってください。']],p:3,once:true}]);
    add('shoko2',[
      {t:'「弁護人、反論をお願いします」',r:[[B,C.ev[1].obj]],e:{s:6},next:'shonin'},
      {t:'黙ってうなずく',a:1,r:[[J,'……被告人、それは同意という意味ですか。'],[B,'（うなずかないで！）']],e:{s:-5},next:'shonin'},
      {t:'「その証拠、どこで手に入りますか」',r:[[P,'……売っていません。'],[G,'（クスクス）']],e:{z:10,e:5},p:3,once:true}],false);
    add('shonin',[
      {t:'証人をじっと見つめる',a:1,r:[[W,wl('……な、なんですか。')],[J,'被告人、質問がないなら次へ進みます。']],e:{z:5,e:3},once:true},
      {t:'「弁護人に、質問を任せます」',r:[[B,'では、私から。'+C.wq[0].t.replace(/^「|」$/g,'')],...C.wq[0].r],e:{s:3},next:'shonin2'}]);
    add('shonin2',[
      {t:'「証人、来てくれてありがとう」',r:[[W,wl('は、はい……。')],[J,'では、最終陳述に移ります。']],e:{s:2},next:'saishu'}]);
    add('saishu',[
      {t:'「弁護人に、代わりに話してもらいます」',r:[[B,'被告人に代わり、申し上げます。どうか、公正なご判断を。'],[J,'……分かりました。']],e:{s:5},next:'kekka'}]);
  }
  if(mode==='juror'){
    add('start',[
      {t:'「事件のこと、ニュースで見ました」',r:[[J,'……先入観を持たずに判断できますか？'],['あなた','がんばります。'],[J,'では、選任します。']],next:'shinri'},
      {t:'「日当は、いくらもらえますか」',r:[[J,'……あとで、書記官から説明します。'],[J,'選任します。']],e:{e:3},next:'shinri'}]);
    add('shinri',[
      {t:'被告人の表情をメモする',a:1,r:[['あなた','（緊張している……と）']],next:'shinri2'},
      {t:'証人の服装をメモする',a:1,r:[['あなた','（……なかなか、おしゃれだ）']],e:{z:3},next:'shinri2'}]);
    add('shinri2',[
      {t:'全部の発言を書き写そうとする',a:1,r:[['あなた','（手が、追いつかない……！）']],p:3,next:'hyogi'},
      {t:'隣の裁判員のメモをのぞく',a:1,r:[['5番 料理人','ちょっと、見ないでくれ！'],[J,'静粛に。']],e:{z:8,e:5},next:'hyogi'}]);
    add('vote',[
      {t:'白票を投じる',a:1,vote:'blank'},
      {t:'サイコロで決める',a:1,vote:'dice',news:'評決をサイコロで決めた裁判員がいたことが分かった。'},
      {t:'「投票の前に、もう一言だけ」',r:[[J,'……手短にどうぞ。'],['あなた','みなさん、よく考えましょう。'],['1番 会社員','もう十分考えましたよ。']],p:3,once:true}],false);
  }
  if(mode==='judge'){
    add('start',[
      {t:'「まず、全員で深呼吸をしましょう」',r:[[G,'（スー……ハー……）'],[P,'……あの、裁判長？']],e:{z:-10,f:2},once:true},
      {t:'「起立したまま、始めます」',r:[[B,'……座ってもよろしいでしょうか。'],[J,'あ、どうぞ。']],e:{f:-3,z:5},next:'kiso'}],false);
    add('kiso',[
      {t:'「被告人、あなたには黙秘権があります」',r:[[D,'は、はい。分かりました。']],e:{f:8},once:true},
      {t:'「検察官、起訴状をもう一度」',r:[[P,'……もう一度、読み上げます。'],[P,C.kiso]],e:{f:2},p:4,once:true}]);
    for(const id of ['shoko','shoko2']) add(id,[
      {t:'「検察官の意見も聞きます」',r:[[P,'本証拠は、事件の核心に関わるものです。']],e:{f:5},once:true},
      {t:'「判断は保留して、次へ進みます」',r:[[B,'……保留、ですか。']],e:{f:-5},next:id==='shoko'?'shoko2':'shonin'}],false);
    add('shonin',[
      {t:'「証人、宣誓をお願いします」',r:[[W,wl('良心に従って、真実を述べ、何事も隠さず、偽りを述べないことを誓います。')]],e:{f:6},once:true},
      {t:'「検察官、先に尋問してください」',r:[[P,'証人、あなたの知っていることを、話してください。']],e:{f:4},next:'shonin2'}]);
    add('shonin2',[
      {t:'「弁護人も、尋問してください」',r:[[B,'証人、今の証言は確かですか。'],[W,wl('……はい。')]],e:{f:6},once:true},
      {t:'「証人、ありがとうございました」',r:[[W,wl('……失礼します。')]],e:{f:2},next:'hanketsu'}]);
    add('hanketsu',[
      {t:'被告人以外の誰かを有罪にする…',a:1,next:'daisan'},
      {t:'「判決は、明日に延期します」',r:[[G,'（えーっ）'],[P,'……裁判長、本日中にお願いします。']],e:{f:-5,z:15,e:10},p:10,once:true,news:'裁判長が判決の言い渡しを延期しようとし、法廷がざわついた。'}],false);
  }
  const REP={t:'同じ質問をもう一度する',a:1,rep:'q'};
  if(mode==='defendant'||mode==='judge'){ for(const id of ['shonin','shonin2']) if(T[id]) T[id].choices.splice(1,0,{...REP}); }
  if(mode==='juror'&&T.hyogi) T.hyogi.choices.splice(T.hyogi.choices.length-1,0,{t:'同じ意見を、何回も言う',a:1,rep:'j'});
  if(mode==='judge'){
    T.daisan={lines:[[J,'……判決の前に、この法廷で、もう一人裁くべき者がいます。'],[G,'（ざわっ）']],choices:[
      {t:'証人を有罪にする',a:1,third:'witness'},
      {t:'検察官を有罪にする',a:1,third:'prosecutor'},
      {t:'弁護人を有罪にする',a:1,third:'lawyer'},
      {t:'傍聴席の全員を有罪にする',a:1,third:'gallery'},
      {t:'書記官を有罪にする',a:1,third:'clerk'},
      {t:'傍聴席の柴犬を有罪にする',a:1,third:'dog'},
      {t:'裁判長である自分を有罪にする',a:1,third:'self'},
      {t:'やっぱりやめる',r:[[J,'……いえ、何でもありません。'],[G,'（なんだったんだ……）']],e:{f:-3},p:2,next:'hanketsu'}]};
  }
  return T;
}

function showZukan(){

  for(const m of Object.keys(MODES)){
    let rows='';
    for(const k of Object.keys(ENDINGS)){ const e=ENDINGS[k]; if(!e.modes.includes(m)) continue; const has=zk[m+'_'+k]; rows+='<div class="zk'+(has?'':' no')+'"><span>'+(has?e.name:'？？？')+'</span><span>'+(has?ic('check',16):'')+'</span></div>'; }

function paperTemplate(){
  const f=paperFacts(), C=f.C;

  if(f.mode==='judge') body+='裁判長の訴訟指揮には、'+(S.g.f>=60?pick(['「公正だった」と評価する声がある。','法曹関係者からも一定の評価が集まった。']):pick(['「公正さを欠いた」との批判が相次いでいる。','疑問の声が上がっている。']));
  body+=pick(SPEED_PARA[f.speed])+pick(CLOSE);
  const lvl=f.es>=60?'hi':f.es>=30?'mid':'lo';
  const ex=(CASE_EXPERT[C.id]&&Math.random()<0.5)?CASE_EXPERT[C.id]:pick(EXPERTS[lvl]);
  let pool=[...LETTERS.any,...(f.speed<=1?LETTERS.fast:[]),...(f.speed===3?LETTERS.slow:[]),...(f.es>=50?LETTERS.hot:LETTERS.calm),...(f.mode==='judge'?LETTERS.judge:[]),...(f.mode==='juror'?LETTERS.juror:[]),...(f.dog?LETTERS.dog:[]),...(f.id==='daisansha'?LETTERS.third:[])];
  const letters=pickN(pool,3);
  let ed=f.id==='daisansha'||f.mode==='judge'?EDITORIALS[5]:f.speed===0?EDITORIALS[1]:f.es>=60?EDITORIALS[0]:C.cat==='fun'?EDITORIALS[2]:f.mode==='juror'?EDITORIALS[4]:EDITORIALS[3];
  if(Math.random()<0.3) ed=pick(EDITORIALS);
  const q=pick(POLLS)[0]; const yes=clamp(Math.round(50+(f.es>=50?-20:15)+(Math.random()*30-15)),5,95);
  return {midashi,komidashi,honbun:body,yushikisha:{katagaki:ex[0],comment:ex[1]},toushyo:letters.map(l=>({name:l[0],text:l[1]})),
    shasetsu:{title:ed[0],text:ed[1]},poll:{q,yes,no:100-yes},ad:pick(ADS),weather:pick(WEATHER),gogai:f.speed===0,edition:f.speed===0?'号外':pick(['朝刊','夕刊']),gemini:false};
}

  return {mode,case:C,tree:buildTree(C,mode),phase:0,nodeId:null,g:{s:50,z:0,e:0,f:60},flags:new Set(),used:new Set(),events:[],news:[],log:[],
    acc:0,startedAt:0,running:false,pen:0,splits:[],lastSplit:0,endingId:null,special:'',busy:false,done:false,
    bribe:0,vote:null,verdict:null,jurors:mode==='juror'?JURORS.map(j=>({...j})):null,paper:null,inRoom:false};
}
function tree(){ return S.tree; }
function nowMs(){return S?S.acc+(S.running?performance.now()-S.startedAt:0)+S.pen*1000:0}
function pauseT(){if(S&&S.running){S.acc+=performance.now()-S.startedAt;S.running=false}}
function resumeT(){if(S&&!S.running&&!S.done){S.startedAt=performance.now();S.running=true}}
function fmt(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,c=Math.floor(ms/10)%100;return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')}
function fmtJa(ms){const s=Math.round(ms/1000);return s<60?s+'秒':Math.floor(s/60)+'分'+(s%60?(s%60)+'秒':'')}
function player(){ if(!S) return ACT['被告人']; return S.mode==='juror'?ACT['6番 あなた']:S.mode==='judge'?ACT['裁判長']:ACT['被告人']; }

let WB=null;
function rebuildRole(id,H,home,col,voice){
  const old=ACT[id];
  if(old){ scene.remove(old.g); disposeTree(old.g); }
  const a=makeActor(id,H,{col,voice});
  a.home={p:home.p.clone(),ry:home.ry}; setSpot(a,a.home,true);
  return a;
}
function setupCase(C){
  rebuildRole('被告人',{heads:3.1,height:1,skin:'#ffe0c9',...C.def.H,heads:3.1,height:1,acc:C.def.H.acc||[]},{p:SPOT.defSeat.p,ry:SPOT.defSeat.ry},'#9be38a',230);
  if(C.wit.dog){ const w=rebuildRole('証人',{heads:3.0,height:1,hair:'short',acc:[]},{p:V3(1.8,0,ROWS[0]),ry:Math.PI},'#7fe0b0',320); w.g.visible=false; }
  else rebuildRole('証人',{heads:3.0,height:1,skin:'#ffe0c9',...C.wit.H,heads:3.0,height:1,acc:C.wit.H.acc||[]},{p:V3(1.8,0,ROWS[0]),ry:Math.PI},'#7fe0b0',320);
  if(WB){ WB.material.map=canvasTex(512,256,(c,w,h)=>{
    c.fillStyle='#fbfbf8'; c.fillRect(0,0,w,h); c.font='bold 28px sans-serif'; c.fillStyle='#1d4fa0'; c.fillText('事件：'+C.title,20,44);
    c.font='22px sans-serif'; c.fillStyle='#333'; wrapText(c,'争点：'+C.issue,20,84,470,28);
    c.font='bold 30px sans-serif'; c.fillStyle='#c0392b'; c.fillText(C.pWin.tag+'？',40,215); c.fillStyle='#1d4fa0'; c.fillText(C.dWin.tag+'？',300,215);
    c.strokeStyle='#333'; c.lineWidth=3; c.beginPath(); c.moveTo(256,170); c.lineTo(256,240); c.stroke(); }); WB.material.needsUpdate=true; }
}
function wrapText(c,text,x,y,maxW,lh){ let line=''; for(const ch of text){ if(c.measureText(line+ch).width>maxW){ c.fillText(line,x,y); line=ch; y+=lh; } else line+=ch; } if(line) c.fillText(line,x,y); }

const UI={hud:$('hud'),dialog:$('dialog'),name:$('name'),text:$('text'),next:$('next'),choices:$('choices'),ov:$('overlay'),card:$('card'),flash:$('flash'),verdict:$('verdict'),fade:$('fade'),jur:$('jurPanel'),top:$('topbtns')};
function show(e,on=true){ e.classList.toggle('hide',!on); }
function renderHud(){
  if(!S) return;
  const ph=PHASES[S.mode];
  $('phase').innerHTML='<small>'+MODES[S.mode]+'</small>'+(ph[S.phase]||'判決');
  $('dots').innerHTML=ph.map((_,i)=>'<span class="'+(i<=S.phase?'on':'')+'"></span>').join('');
  const gs=[];
  if(S.mode==='defendant') gs.push(['心証',S.g.s,'linear-gradient(90deg,#3a7ad0,#7cc0ff)']);
  if(S.mode==='judge') gs.push(['公正さ',S.g.f,'linear-gradient(90deg,#2e8b57,#7ee0a0)']);
  gs.push(['ざわめき',S.g.z,'linear-gradient(90deg,#d08a2a,#ffc65a)'],['炎上度',S.g.e,'linear-gradient(90deg,#c0392b,#ff7a5a)']);
  let html=gs.map(g=>'<div class="gauge"><span>'+g[0]+' <b>'+Math.round(g[1])+'</b></span><div class="gbar"><i style="width:'+clamp(g[1],0,100)+'%;background:'+g[2]+'"></i></div></div>').join('');
  if(S.jurors && S.phase>=2 && !S.done){
    html+='<div class="gauge" style="flex:2.2"><span>評議のゆくえ</span><div class="jmini">'+S.jurors.map(j=>'<div><i style="height:'+Math.max(8,j.g)+'%;background:'+(j.g>=50?'#e0574a':'#5aa2e6')+'"></i><small>'+j.name[0]+'</small></div>').join('')+'</div></div>';
  }
  $('gauges').innerHTML=html;
  show(UI.jur,false);
  if(S.jurors) updateJurorLabels();
}
function toast(msg,color){ const t=el('div','toast',msg); if(color) t.style.background=color; $('ui').append(t); setTimeout(()=>t.remove(),1300); }
function flash(text,cls='',ms=900){ UI.flash.innerHTML=''; const s=el('span',cls,text); UI.flash.append(s); document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); return new Promise(r=>setTimeout(()=>{ UI.flash.innerHTML=''; r(); },ms)); }
async function fadeOut(){ UI.fade.classList.add('on'); await sleep(380); }
async function fadeIn(){ UI.fade.classList.remove('on'); await sleep(200); }

/* ---------- 文字送り ---------- */
let typing=null, tapWait=null, curSpeaker=null;
function onTap(){
  if(typing){ typing.finish(); return; }
  if(tapWait){ const r=tapWait; tapWait=null; UI.next.classList.remove('on'); r(); }
}
UI.dialog.addEventListener('pointerdown',e=>{ e.preventDefault(); onTap(); });
canvas.addEventListener('pointerdown',()=>{ if((S&&!S.done)||tapWait) onTap(); });

function isDogSpeaker(sp){ return sp==='犬' || (sp&&(sp.includes('犬')||sp.includes('ポチ'))) || (sp==='W'&&S&&S.case.wit.dog); }
function actorFor(sp){
  if(!sp) return null;
  if(sp==='あなた') return player();
  if(sp==='W') return ACT['証人'];
  if(sp==='D') return ACT['被告人'];
  if(ACT[sp]) return ACT[sp];
  if(sp.includes('裁判長')) return ACT['裁判長'];
  if(sp.includes('右陪席')) return ACT['右陪席'];
  if(sp.includes('陪席')) return ACT['左陪席'];
  if(sp.includes('検察')) return ACT['検察官'];
  if(sp.includes('弁護')) return ACT['弁護人'];
  if(sp.includes('書記')) return ACT['書記官'];
  if(S){ const C=S.case; if(sp.includes('証人')||sp.includes(C.wit.name)) return ACT['証人']; if(sp.includes('被告')||sp.includes(C.def.name)) return ACT['被告人']; }
  const m=sp.match(/([1-6])番/); if(m){ const k=Object.keys(ACT).find(n=>n.startsWith(m[1]+'番')); if(k) return ACT[k]; }
  return null;
}
function displayName(sp){
  const C=S&&S.case;
  if(sp==='あなた') return S.mode==='juror'?'6番（あなた）':S.mode==='judge'?'裁判長（あなた）':'被告人（あなた）';
  if(sp==='裁判長'&&S.mode==='judge') return '裁判長（あなた）';
  if(sp==='W') return '証人・'+(C.wit.dog?'柴犬':'')+C.wit.name;
  if(sp==='D'||sp==='被告人') return '被告人・'+C.def.name;
  if(sp==='証人') return '証人・'+C.wit.name;
  return sp;
}
const STANDERS=['検察官','弁護人'];
async function say(sp,text){
  if(!S) return;
  const narr=sp==='narr';
  const isGallery=!!(sp&&sp.includes('傍聴')&&!sp.includes('犬'));
  const isDog=!narr&&isDogSpeaker(sp);
  let a=narr?player():isGallery?GALLERY[Math.floor(Math.random()*GALLERY.length)]:isDog?null:actorFor(sp);
  if(!a && !isDog && !narr) a=ACT['裁判長'];
  if(curSpeaker && curSpeaker!==a){ curSpeaker.talking=false; if(curSpeaker.standTemp && !curSpeaker.walk){ curSpeaker.sit=true; curSpeaker.standTemp=false; } }
  curSpeaker=a;
  if(a){ a.talking=!narr; if(!narr && a.sit && !a.walk && (STANDERS.includes(a.id) || (a.id==='被告人' && a.spot===SPOT.defSeat))){ a.sit=false; a.standTemp=true; } }
  if(isDog&&DOG){ const h=DOG.g.position.clone().add(V3(0,0.3,0)); camTo(h.clone().add(V3(0.5,0.7,-1.8)),h,7); DOG.motion='bark'; DOG.until=clock.elapsedTime+1.5; SFX.bark(); lookAllAt(null); }
  else if(isGallery){ camWide('gallery',6); react(GALLERY,Math.random()<0.5?'surprise':'cheer',1.6); SFX.crowd(); }
  else if(a){ camActor(a); lookAllAt(a); }
  if(text.includes('異議あり')){ if(a){ a.motion='point'; a.motionUntil=clock.elapsedTime+1.6; } SFX.objection(); await flash('異議あり！','',850); }
  if(text.includes('静粛に')){ const j=ACT['裁判長']; j.motion='gavel'; j.motionUntil=clock.elapsedTime+0.7; SFX.gavel(); }
  if(/えええ|！？|まさか/.test(text) && !isGallery){ react(Object.values(ACT).filter(x=>x!==a&&!x.walk),'surprise',1.2); SFX.shock(); }
  if(text.includes('♪') && a){ a.motion='dance'; a.motionUntil=clock.elapsedTime+3; }
  const nm=narr?'':isGallery?'傍聴席':isDog?(sp==='W'||sp.includes('証人')?displayName('W'):'傍聴席の柴犬'):displayName(sp);
  UI.name.textContent=nm;
  UI.name.style.color=isDog?'#ffb86b':a&&!narr&&!isGallery?a.col:'#fff';
  UI.text.className=narr?'narr':''; UI.text.textContent='';
  UI.next.classList.remove('on');
  show(UI.dialog,true);
  S.log.push([nm,text]);
  const chars=[...text]; let i=0; const voice=isDog?520:a?a.voice:240;
  await new Promise(res=>{
    let iv=null;
    const done=()=>{ clearInterval(iv); UI.text.textContent=text; typing=null; res(); };
    typing={finish:done};
    iv=setInterval(()=>{ i++; UI.text.textContent=chars.slice(0,i).join(''); if(i%2===0 && !narr) SFX.blip(voice+Math.random()*30); if(i>=chars.length) done(); },22);
  });
  if(a) a.talking=false;
  UI.next.classList.add('on');
  await new Promise(r=>{ tapWait=r; });
}
async function sayAll(lines){ for(const l of lines||[]){ if(!S) return; await say(l[0],l[1]); } }

async function phaseCard(i){ await showCard('第'+['一','二','三','四','五'][i]+'幕',PHASES[S.mode][i]); }

/* ---------- 選択肢 ---------- */
function showChoices(){
  if(!S||S.done) return;
  const c=UI.choices; c.innerHTML='';
  const n=tree()[S.nodeId];
  const list=n.choices.map((ch,i)=>[ch,i]).filter(([ch,i])=>!(ch.if&&!ch.if(S)) && !(ch.once&&S.used.has(S.nodeId+i)));
  if(S.mode==='judge' && S.g.z>=25) list.unshift([{t:'木づちを鳴らす「静粛に！」',a:1,gavel:1,e:{z:-30,f:3}},-1]);
  list.forEach(([ch,i],k)=>{
    const lab=ch.rep==='q'?'同じ質問をもう一度する（'+((S.repQ||0)+1)+'回目）':ch.rep==='j'?'同じ意見を、何回も言う（'+((S.repJ||0)+1)+'回目）':ch.t.replace(/^「|」$/g,'');
    const b=el('button','ch'+(ch.a?' act':'')+(ch.rep&&((ch.rep==='q'?S.repQ:S.repJ)||0)>=3?' hot':''),lab);
    b.style.animationDelay=(k*0.05)+'s';
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.onclick=()=>choose(ch,i);
    c.append(b);
  });
  if(hasKey()){
    const f=el('div'); f.id='free';
    const ta=el('textarea'); ta.placeholder=S.mode==='judge'?'裁判長として自由に発言…':'自由に発言する…';
    const sb=el('button',null,'発言'); sb.onclick=()=>{ const v=ta.value.trim(); if(v) freeTalk(v); };
    ta.addEventListener('pointerdown',e=>e.stopPropagation());
    f.append(ta,sb); c.append(f);
    c.append(el('div','fhint','Geminiが考えている間はタイマーが止まります'));
  }
  show(c,true);
}
function hideChoices(){ show(UI.choices,false); UI.choices.innerHTML=''; }

function applyEffects(e,j){
  const z0=S.g.z;
  if(e){ if(e.s)S.g.s=clamp(S.g.s+e.s,0,100); if(e.z)S.g.z=clamp(S.g.z+e.z,0,100); if(e.e)S.g.e=clamp(S.g.e+e.e,0,100); if(e.f)S.g.f=clamp(S.g.f+e.f,0,100); }
  if(j&&S.jurors) S.jurors.forEach(x=>{x.g=clamp(x.g+j*x.k,0,100)});
  if(S.g.z-z0>=10){ react(GALLERY,'surprise',1.4); if(S.g.z-z0>=20&&DOG){ DOG.motion='bark'; DOG.until=clock.elapsedTime+1.6; SFX.bark(); } }
  renderHud();
}
async function go(id){
  if(!S||S.done) return;
  if(id==='kekka'||id==='end'){ await finish(); return; }
  const n=tree()[id]; S.nodeId=id;
  if(n.phase!=null && n.phase!==S.phase){ setPhase(n.phase); await onPhaseEnter(n.phase); }
  if(n.enter) n.enter();
  renderHud();
  await sayAll(n.lines);
  if(!S||S.done) return;
  showChoices();
}
function setPhase(p){ const t=nowMs(); S.splits.push([PHASES[S.mode][S.phase],t-S.lastSplit]); S.lastSplit=t; S.phase=p; }
async function onPhaseEnter(p){
  if(S.mode==='juror' && p===2){ await toRoom(); }
  else if(S.inRoom){ camWide('room',3); }
  else { camWide(p===2?'floor':p===3&&S.mode==='judge'?'floor':'court',3); }
  await phaseCard(p);
}
function badEnd(){ return S.mode==='defendant'?'taitei':S.mode==='juror'?'kainin':'dangai'; }
async function choose(ch,i){
  if(!S||S.busy||S.done) return;
  S.busy=true; hideChoices();
  if(ch.once) S.used.add(S.nodeId+i);
  if(ch.m){ const p=player(); p.motion=ch.m; p.motionUntil=clock.elapsedTime+3; }
  if(ch.gavel){ const j=ACT['裁判長']; j.motion='gavel'; j.motionUntil=clock.elapsedTime+0.8; SFX.gavel(); camActor(j); applyEffects(ch.e); react(GALLERY,'idle',0.1); await flash('静粛に！','gold',700); S.busy=false; showChoices(); return; }
  if(ch.rep==='q'){ await repeatQuestion(); return; }
  if(ch.rep==='j'){ await repeatOpinion(); return; }
  if(!ch.a && (S.nodeId==='shonin'||S.nodeId==='shonin2')) S.lastQ=ch.t.replace(/^「|」$/g,'');
  if(!ch.a && S.nodeId==='hyogi' && !ch.next) S.lastOpinion=ch.t.replace(/^「|」$/g,'').replace(/。$/,'');
  if(ch.a) await say('narr','▶ '+ch.t); else await say('あなた',ch.t.replace(/^「|」$/g,''));
  if(ch.enter) ch.enter();
  const r=typeof ch.r==='function'?ch.r(S):ch.r;
  applyEffects(ch.e,typeof ch.j==='function'?ch.j(S):ch.j);
  if(ch.f) S.flags.add(ch.f);
  if(ch.news && !S.news.includes(ch.news)) S.news.push(ch.news);
  if(ch.p){ S.pen+=ch.p; toast('+'+ch.p+'秒'); SFX.penalty(); }
  if(ch.bribe){ S.bribe++; if(puddings) puddings.visible=true; }
  if(r) await sayAll(r);
  S.busy=false;
  if(ch.bribe && S.bribe>=2){ await finish('kainin'); return; }
  if(ch.vote){ S.vote=ch.vote; await finish(); return; }
  if(ch.verdict){ S.verdict=ch.verdict; await finish(); return; }
  if(ch.third){ S.third=ch.third; await finish('daisansha'); return; }
  if(S.g.z>=100){ await flash('退場！','',900); await finish(badEnd()); return; }
  if(S.mode==='judge' && S.g.f<=0){ await flash('公正さ 0','',900); await finish('dangai'); return; }
  if(ch.end){ await finish(ch.end); return; }
  if(ch.next) await go(ch.next); else showChoices();
}

/* ---------- 同じ質問・同じ意見のくり返し ---------- */
async function repeatQuestion(){
  const C=S.case, dog=!!C.wit.dog, judge=S.mode==='judge';
  const n=S.repQ=(S.repQ||0)+1;
  const q=S.lastQ||C.wq[0].t.replace(/^「|」$/g,'');
  await say('あなた',n>=4?q+'　'+q:q);
  const W2=t=>['W',t];
  const shout=judge?['右陪席','裁判長……さっきも同じことを聞かれましたよ。']:[J,'被告人、同じ質問は控えてください。'];
  let L=[], e={}, news=null, pen=0;
  if(n===1){ L=[W2(dog?'ワン？':'……さっき、答えましたけど。')]; e={z:5}; }
  else if(n===2){ L=[W2(dog?'……ワン？ ワン？':'え、ですから……さっきも言いましたよね？'),shout]; e={z:8}; pen=2; }
  else if(n===3){ L=[W2(dog?'クゥーン……？（首をかしげている）':'……あれ？ 私、さっき何て答えましたっけ……？'),[G,'（ざわざわ）']]; e={z:10,e:5}; }
  else if(n===4){ L=[W2(dog?'ワンワンワンワン！（しっぽを追いかけて回り始めた）':'……もう分かりません！ そうよ、'+C.wit.say2.replace(/^……/,'')),[G,'（えっ、今なんて？）']];
    e={z:12,e:8,s:dog?0:12}; news=dog?'同じ質問をくり返され、証人の柴犬が自分のしっぽを追いかけ始めた。':'同じ質問を4回くり返された証人が混乱し、重要な証言を口にした。'; }
  else if(n===5){ L=[W2(dog?'（ポチは、ふて寝してしまった）':'……もう、何も分かりません！ うわああん！'),[P,'証人が泣いているじゃないですか！'],[J==='裁判長'&&judge?'右陪席':J,'静粛に！']];
    e={z:25,e:15,s:-5}; pen=3; news='同じ質問を5回くり返された証人が泣き出し、法廷が騒然となった。'; }
  else if(n<8){ L=[W2(dog?'……zzz':'……（無言で天井を見つめている）'),[judge?'右陪席':J,judge?'裁判長、これ以上は問題になります！':'被告人、これ以上は法廷侮辱とみなします！']]; e={z:20,e:10,s:-8}; pen=5; }
  else { L=[W2(dog?'ワオーーーン！':'……私は……誰？ ここは……どこ？'),[G,'（えええーっ！）']]; e={z:40,e:20}; news='同じ質問が8回もくり返され、証人は自分の名前も思い出せなくなった。'; }
  if(judge){ e.f=-(4+n*2); e.s=0; }
  applyEffects(e);
  if(pen){ S.pen+=pen; toast('+'+pen+'秒'); SFX.penalty(); }
  if(news && !S.news.includes(news)) S.news.push(news);
  if(n>=3){ const w=ACT['証人']; if(w&&!dog){ w.motion=n>=5?'sad':'think'; w.motionUntil=clock.elapsedTime+4; } }
  await sayAll(L);
  S.busy=false;
  if(n>=8){ await flash('証人、限界','',900); await finish(badEnd()); return; }
  if(S.g.z>=100){ await flash('退場！','',900); await finish(badEnd()); return; }
  if(judge && S.g.f<=0){ await finish('dangai'); return; }
  showChoices();
}
async function repeatOpinion(){
  const n=S.repJ=(S.repJ||0)+1;
  const last=S.lastOpinion||'有罪か無罪か、よく考えましょう';
  await say('あなた',n>=3?last+'！ '+last+'！':last+'。');
  let L=[], news=null;
  if(n===1) L=[['1番 会社員','……それ、さっきも聞きました。']];
  else if(n===2) L=[['2番 主婦','ええと……何の話でしたっけ？'],[J,'6番の方、同じ意見のくり返しは控えてください。']];
  else if(n===3){ L=[['3番 大学生','あれ、ぼく、どっちの意見だったっけ……'],['5番 料理人','頭がぐるぐるしてきた……']]; S.jurors.forEach(j=>{ j.g=clamp(j.g+(Math.random()*30-15),0,100); }); }
  else if(n===4){ L=[['4番 元校長','わしは、もう何が何だか……。'],['1番 会社員','もう、どっちでもいいです……']]; S.jurors.forEach(j=>{ j.g=clamp(j.g+(Math.random()*50-25),0,100); }); news='評議で同じ意見を何度もくり返した裁判員がいて、評議室は混乱した。'; }
  else if(n<7){ L=[['2番 主婦','もうやめてー！'],[J,'6番の方、これ以上は評議の妨害です！']]; S.jurors.forEach(j=>{ j.g=Math.random()*100; }); applyEffects({z:15,e:10}); S.pen+=3; toast('+3秒'); SFX.penalty(); }
  else { L=[[J,'……6番の方。あなたを、裁判員から解任します。']]; }
  applyEffects({z:n*3},0);
  if(news && !S.news.includes(news)) S.news.push(news);

async function askGemini(prompt){
  const key=store.get('key',''); const model=store.get('model','gemini-2.5-flash');
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:1}})
  });
  if(!res.ok){ const c=res.status;
    if(c===400||c===401||c===403) throw new Error('合言葉が違うか、使えない状態のようです');
    if(c===404) throw new Error('モデル名が見つかりません（設定を確認してください）');
    if(c===429) throw new Error('使いすぎのため、少し待ってからもう一度どうぞ');
    throw new Error('Geminiとの通信に失敗しました（'+c+'）'); }
  const j=await res.json();
  let txt=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'');
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}'); if(a<0||b<0) throw new Error('返事を読み取れませんでした');
  return JSON.parse(txt.slice(a,b+1));
}
function roleText(){ const C=S.case; return S.mode==='defendant'?'被告人・'+C.def.name:S.mode==='juror'?'6番の裁判員':'裁判長（判決を決める立場）'; }
function stateText(){
  let t='ざわめき'+Math.round(S.g.z)+'（100で退場）、炎上度'+Math.round(S.g.e);
  if(S.mode==='defendant') t='心証（100に近いほど弁護側に有利）'+Math.round(S.g.s)+'、'+t;
  if(S.mode==='judge') t='裁判長の公正さ'+Math.round(S.g.f)+'（0で弾劾裁判）、'+t;
  if(S.jurors) t+='\n他の裁判員の「検察寄り度」（0〜100）：'+S.jurors.map(j=>j.name+'='+Math.round(j.g)).join('、');
  return t;
}
async function freeTalk(text){

${caseText(C)}

プレイヤーの役：${roleText()}
今の手続き：${PHASES[S.mode][S.phase]}${S.inRoom?'（評議室で話し合い中）':''}
今の状態：${stateText()}
これまでの流れ（最近）：
${S.log.slice(-12).map(l=>(l[0]?l[0]+'：':'')+l[1]).join('\n')}

プレイヤーの発言：「${text}」

ルール：
- 今の手続きと、これまでの流れに自然につながる返事にする。どんなにめちゃくちゃな発言にも、登場人物は本気で、筋の通った反応をする。
- 結果がめちゃくちゃになってもよい。笑える展開を歓迎する。ただし実在の人物・団体は出さず、人が亡くなった事件では被害者をからかわない。

- event は、翌日の新聞に載りそうな出来事を25文字以内で。なければ空文字。
- 出力はJSONだけ：
{"replies":[{"speaker":"検察官","text":"…"}],"effects":{"shinsho":0,"zawa":0,"enjo":0,"fair":0,"jurors":0},"advance":false,"ending":"","ending_name":"","event":""}
- effects の範囲：shinsho -15〜15（弁護側に有利ならプラス）、zawa -10〜30、enjo 0〜20、fair -25〜15（裁判長の発言が公正ならプラス）、jurors -20〜20（検察寄りになるならプラス）。`;

  resumeT();
  const ef=r.effects||{};
  applyEffects({s:clamp(+ef.shinsho||0,-15,15),z:clamp(+ef.zawa||0,-10,30),e:clamp(+ef.enjo||0,0,20),f:S.mode==='judge'?clamp(+ef.fair||0,-25,15):0},clamp(+ef.jurors||0,-20,20));
  if(r.event){ S.events.push(String(r.event).slice(0,40)); }
  for(const x of (r.replies||[]).slice(0,3)){ if(x&&x.text) await say(String(x.speaker||'裁判長'),String(x.text)); }
  S.busy=false;
  if(r.ending && endKeys.includes(r.ending)){ if(r.ending==='tokubetsu'||r.ending==='daisansha'){ S.special=String(r.ending_name||'').slice(0,20); if(r.ending==='daisansha') r.ending='tokubetsu'; } await finish(r.ending); return; }
  if(S.g.z>=100){ await flash('退場！','',900); await finish(badEnd()); return; }
  if(S.mode==='judge'&&S.g.f<=0){ await finish('dangai'); return; }
  if(r.advance){
    const nx=PHASE_START[S.mode][S.phase+1];
    if(!nx){ if(S.mode==='defendant'){ await finish(); return; } showChoices(); return; }
    await go(nx);
  } else showChoices();
}

function decideEnding(){
  const C=S.case;
  if(S.mode==='defendant'){
    if(S.flags.has('自白')) return 'jihaku';
    if(S.g.s>=70) return 'dwin';
    if(S.g.s<=35) return 'pwin';
    return 'yarinaoshi';
  }
  if(S.mode==='juror'){
    if(S.vote==='dice') S.vote=Math.random()<0.5?'p':'d';
    const p=S.jurors.filter(j=>j.g>=50).length+(S.vote==='p'?1:0);
    if(p>=4) return 'pwin'; if(p===3) return 'ketsuretsu'; if(p===0) return 'manjo'; return 'dwin';
  }
  if(S.g.f<=0) return 'dangai';
  if(S.verdict==='x') return 'zendai';
  if(S.verdict===C.truth) return S.g.f>=60?'meihanketsu':'hanrei';
  return 'haki';
}
function verdictSide(){
  const id=S.endingId;
  if(['pwin','jihaku'].includes(id)) return 'p';
  if(['dwin','manjo'].includes(id)) return 'd';
  if(S.mode==='judge'&&['meihanketsu','hanrei','haki'].includes(id)) return S.verdict;
  if(S.mode==='judge'&&id==='zendai') return 'x';
  return null;
}

  witness:{who:C=>'証人・'+C.wit.name,act:'証人'},

   ========================================================= */
function resetCast(){
  for(const a of Object.values(ACT)){ setSpot(a,{p:a.home.p,ry:a.home.ry},true); a.standTemp=false; a.talking=false; a.motion='idle'; a.motionUntil=0; a.lookYaw=0; if(a.label) a.label.visible=false; }
  if(puddings) puddings.visible=false;
}
async function startGame(mode,C){
  ac(); hideOverlay();
  const want=Math.min(store.get('courtLv',unlockedLevel()),unlockedLevel()); if(want!==LV_I) applyLevel(want);
  setupCase(C); resetCast();
  S=newState(mode,C); curSpeaker=null;
  inGameUI(true); show(UI.dialog,false); renderHud();
  camWide('court',2.5);
  await showCard(LV.name+'　｜　'+(C.cat==='real'?'実際の判例がモデル':'荒唐無稽な事件')+'　｜　罪名：'+C.charge,C.title,1700);
  await phaseCard(0);
  resumeT();
  await go('start');
}

/* =========================================================
   毎フレーム
   ========================================================= */
let built=false;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(!built) return;
  for(const a of Object.values(ACT)) if(a.g.visible) animateActor(a,t,dt);
  if(DOG){ const m=DOG.until>t?DOG.motion:'down'; animateDog(DOG.rig,m,t); applyRig(DOG.rig,1-Math.exp(-dt*10)); }
  for(const j of (S&&S.jurors)||[]){ const a=ACT[j.name]; if(a&&a.label&&a.label.visible){ headWorld(a,a.label.position); a.label.position.y+=a.rig.dims.R*1.9; } }
  if(CAM.orbit){ const an=t*0.06, cz=(LV.rear-9)/2, rz=(LV.rear+9)/2-1.6; CAM.tp.set(Math.sin(an)*LV.hw*0.6,Math.min(3.4,LV.h-0.6)+(LV.theme==='space'?1.5:0)+Math.sin(t*0.1)*0.3,cz+Math.cos(an)*rz); CAM.tl.set(0,1.0,-3.5); CAM.speed=2; }
  const k=1-Math.exp(-dt*CAM.speed);
  CAM.pos.lerp(CAM.tp,k); CAM.look.lerp(CAM.tl,k);
  camera.position.copy(CAM.pos); camera.lookAt(CAM.look);
  const ms=S?nowMs():Date.now()%3600000;
  if(clockHands){ clockHands.s.rotation.z=-(ms/1000%60)/60*Math.PI*2; clockHands.m.rotation.z=-(ms/60000%60)/60*Math.PI*2; }
  if(S) $('timer').textContent=fmt(nowMs());
  renderer.render(scene,camera);
}
function boot(){
  LEVELS[LEVELS.length-1].need=CASES.length;
  buildCourt(); buildRoom(); buildCast(); setupCase(CASES[0]);
  applyLevel(Math.min(store.get('courtLv',unlockedLevel()),unlockedLevel()));
  built=true; frame();
  camCut(V3(0,3.6,11),V3(0,1,-3.5));
  showLanding();
  const b=$('boot'); b.style.opacity=0; setTimeout(()=>b.style.display='none',600);
}
boot();

</script>
